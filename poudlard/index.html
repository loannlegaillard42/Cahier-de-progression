 Iris doit lancer celui qui allume le bout de sa baguette. Le nombre de LETTRES de ce sort ouvre son cadenas. Quel est ce nombre ?", "choix": [], "reponse": "5", "explication": "Le sort de lumière est LUMOS (comme « lumière ») : L-U-M-O-S, 5 lettres. Une petite lumière blanche jaillit de la baguette d'Iris."}, {"q": "ACTE 3 – CADENAS DE CAPUCINE (botanique) : sur les 4 longues tables de la Grande Salle, l'Ombre a posé des pots de Mandragores (des plantes qui crient très fort : Capucine distribue des cache-oreilles !). Il y a 6 pots sur chaque table. Mais en tout, 2 pots sont vides : deux bébés Mandragores se sont sauvés sous les bancs. Combien de Mandragores reste-t-il dans les pots ?", "choix": [], "reponse": "22", "explication": "4 tables × 6 pots = 24 pots, moins les 2 pots vides = 22 Mandragores. (Les deux fugueuses seront retrouvées le lendemain, endormies dans la corbeille à pain.)"}, {"q": "ACTE 3 – CADENAS DE SILAS (potions) : Silas doit préparer un Philtre Démasqueur. Recette : 1) Verser 2 louches d'eau du lac noir. 2) Tourner 7 fois dans le sens des aiguilles d'une montre. 3) Ajouter 3 plumes de Moka (tombées toutes seules, promis). 4) Tourner 12 fois dans l'autre sens. 5) Laisser reposer 5 minutes. Le cadenas s'ouvre avec le nombre TOTAL de tours de louche (dans un sens comme dans l'autre, chaque tour compte). Quel est ce nombre ?", "choix": [], "reponse": "19", "explication": "Seuls les tours comptent : 7 + 12 = 19. Les 2 louches, les 3 plumes et les 5 minutes sont des pièges ! Silas sourit d'un air rusé : il l'avait vu tout de suite (enfin, c'est ce qu'il dit)."}], "paires": [], "ordre": [], "code": {"message": "LÉO – IRIS – IRIS – CAPUCINE – IRIS – SILAS", "cle": "Remplacez chaque héros par le nombre qui a ouvert son cadenas (Acte 3), puis chaque nombre par la lettre qui a ce rang dans l'alphabet : A=1, B=2, C=3, D=4, E=5… Z=26.", "reponse": "PEEVES ! — ÉPILOGUE à lire à voix haute : « Au cri de PEEVES !, le masque tombe avec un PLOC ridicule. L'esprit frappeur apparaît, rouge jusqu'aux oreilles. — Bon, bon, d'accord, c'était moi ! Depuis novembre ! Les lampes de la serre, l'encre partout, les pages du livre qui mord, le chewing-gum, la Bombabouse sous le Saule, le peigne de Silas… tout ! Je voulais réunir les quatre reliques pour faire la plus grande farce de l'histoire de Poudlard : faire danser tous les escaliers du château en même temps ! Au même instant, une silhouette argentée traverse le mur dans un cliquetis de chaînes : le Baron Sanglant. Peeves rend le Diadème en une demi-seconde et file se cacher dans une armure, qui se met à claquer des dents. Pépite tente aussitôt de fourrer le Diadème dans sa poche ; Silas le rattrape de justesse. Iris pose le Diadème sur la table, à côté de la Coupe de Poufsouffle, de l'Épée de Gryffondor et du Médaillon de Serpentard. Les quatre reliques s'illuminent ensemble, et le plafond magique explose en un feu d'artifice aux couleurs des quatre maisons. Poudlard est protégé. Alors Moka entre par la plus haute fenêtre, rate son looping et dépose une dernière lettre devant les héros : « Chers héros, seuls, aucun de vous n'y serait arrivé. Ensemble, vous êtes devenus dignes des quatre Fondateurs. Il ne vous reste qu'une chose à faire : endormir la Carte. Albus Dumbledore. » »"}, "indice": "Comptez sur vos doigts : A=1, B=2, C=3, D=4, E=5… Et pour l'accusation, posez-vous une seule question : qui peut à la fois voler dans les airs ET attraper un encrier ?", "reussite": "Réussite : le nom de l'Ombre est décodé, au moins 3 cadenas sur 4 ont été ouverts du premier coup par leur maison gardienne, ET au moins 2 maisons avaient trouvé le bon suspect à l'Acte 2. Partielle : le nom est décodé, mais moins de 3 cadenas ont été ouverts du premier coup, OU moins de 2 maisons avaient trouvé le bon suspect. Échec : le nom n'est pas décodé dans le temps ; le Baron Sanglant surgit et démasque l'Ombre à la place de l'équipe. Le Diadème est sauvé, mais les récompenses sont réduites. Dans tous les cas, on lit l'épilogue : l'aventure se termine en beauté."}, "defi_maison": {"titre": "La carte de Chocogrenouille des héros", "consigne": "Dernière mission, pour la gloire ! Fabrique une carte de Chocogrenouille (format carte à jouer) en l'honneur du héros de ta maison : son portrait au recto ; au verso, son nom, sa maison, sa spécialité et ses trois plus beaux exploits de l'année. Bonus : une carte spéciale « Peeves » avec sa farce la plus réussie. Le professeur valide les cartes : elles formeront la galerie des Héros de Poudlard dans la classe.", "contenu": "Modèle du verso : NOM – MAISON – SPÉCIALITÉ – 3 EXPLOITS DE L'ANNÉE – UNE PHRASE CÉLÈBRE (inventée par toi).", "mot_de_passe": ""}, "note_prof": "Au début de la séance, ne cliquez pas sur le parchemin noir de l'onglet « La lettre » : il sert à l'Acte 2, juste après le vol du Diadème. Préparez avant la séance l'alphabet numéroté A=1…Z=26 caché sous une feuille et 4 cadenas dessinés au tableau, un par héros. Si possible, apportez une petite boîte fermée (le coffre) contenant un diadème en papier doré. Gardez 4 minutes pour l'épilogue, le « Méfait accompli ! » collectif (lumière éteinte, comme à la toute première séance) et la remise de la Coupe des Maisons."}};

/* ================= Sauvegardes ================= */
function fenetreSauvegardes(id) {

  const rendre = async () => {
    const e = partieDe(id);
    corps.replaceChildren(el("h2", {}, `Sauvegardes · ${nomClasse(id)}`), el("p", { style: "margin:0;color:var(--doux)" }, "Chargement…"));
    const liste = await Store.sauvegardes(id);
    const code = btoa(unescape(encodeURIComponent(JSON.stringify({ ...e, pile: [] }))));
    const zone = el("textarea", { class: "sauvegarde", placeholder: "Collez ici un code de secours" });
    corps.replaceChildren(el("h2", {}, `Sauvegardes · ${nomClasse(id)}`),
      el("p", { style: "margin:0;color:var(--doux)" }, `Aujourd'hui : ${resume({ etape: e.etape, points: totalPoints(e), reliques: e.reliques.length })}. Un point de sauvegarde est créé automatiquement après chaque étape.`),

        el("button", { class: "b", onclick: () => { Fen.fermer(); fenetreRaz(id); } }, ico("reset"), "Recommencer à zéro")),
      el("h3", {}, "Revenir à un point de sauvegarde"),
      liste.length ? el("div", { class: "liste-sauv" }, liste.map((s) => el("div", { class: "sauv" },
        el("div", {}, el("b", {}, s.label), el("small", {}, `${date(s.date)} · ${resume(s)}`)),
        el("button", { class: "b", onclick: () => {
          let n; try { n = completer(JSON.parse(s.etat)); } catch (er) { toast("Cette sauvegarde est illisible."); return; }
          Store.instantane("Avant la restauration", id); n.introVue = true; remplacerPartie(id, n, `Retour à la sauvegarde : ${s.label}`);
          toast(`Retour à : ${s.label}`); rendre();
        } }, "Restaurer"))))
        : el("p", { style: "margin:0;color:var(--doux)" }, "Aucun point de sauvegarde pour l'instant."),
      el("details", { class: "secours" }, el("summary", {}, "Code de secours (pour changer d'ordinateur)"),
        el("div", { style: "display:grid;gap:8px;margin-top:10px" },
          el("button", { class: "b", onclick: exporterFichier }, ico("disque"), "Télécharger un fichier (toutes les classes)"), el("button", { class: "b", onclick: () => copier(code) }, ico("copie"), "Copier le code de cette partie"), zone,
          el("button", { class: "b", onclick: () => { try { const n = JSON.parse(decodeURIComponent(escape(atob(zone.value.trim())))); if (n.v !== 1) throw 0; Store.instantane("Avant la restauration", id); remplacerPartie(id, completer(n), "Partie restaurée depuis un code"); toast("Partie restaurée."); rendre(); } catch (er) { toast("Ce code de sauvegarde n'est pas valide."); } } }, "Restaurer ce code"))));
  };
  rendre();
}

/* Deux versions différentes d'une partie (cet appareil / en ligne) : le professeur choisit, l'autre reste dans les sauvegardes. */
function fenetreConflit(id, d, plusTard, garderIci, prendreEnLigne) {
  const ici = partieDe(id); let choisi = false;
  const quand = (x) => (x.maj ? new Date(x.maj).toLocaleString("fr-FR", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }) : "date inconnue");

  const choix = (titre, x, action) => el("div", { class: "sauv" }, el("div", {}, el("b", {}, titre), el("small", {}, resume(x))), el("button", { class: "b or", onclick: () => { choisi = true; Fen.fermer(); action(); toast("C'est noté. L'autre version reste dans les sauvegardes de la classe."); } }, "Garder"));
  Fen.ouvrir(el("div", { class: "f-corps" }, el("h2", {}, `Deux versions de la partie ${nomClasse(id)}`),
    el("p", { style: "margin:0;color:var(--doux)" }, "La partie enregistrée en ligne et celle de cet appareil ont avancé chacune de leur côté. Laquelle garder ? L'autre sera rangée dans les sauvegardes de la classe."),
    el("div", { class: "liste-sauv" }, choix("Celle de cet appareil", ici, garderIci), choix("Celle en ligne", completer(JSON.parse(JSON.stringify(d))), prendreEnLigne))),
    { classe: "sombre", etroite: true, bloquante: true, onFermer: () => { if (!choisi) plusTard(); } });
}

/* Où la partie est-elle enregistrée ? Explication + copie dans un fichier (toutes les classes). */
function fenetreEtatSauvegarde() {
  const e = Store.etat();
  const fichier = el("input", { type: "file", accept: ".json,application/json", hidden: true, onchange: (ev) => importerFichier(ev.target.files[0]) });
  const explication = e.c === "db" || e.c === "attente"
    ? "Chaque action est enregistrée en ligne : la partie se retrouve sur tout ordinateur où ce lien est ouvert avec un compte Claude autorisé à la modifier."
    : !ls.ok ? "Ce navigateur refuse d'enregistrer quoi que ce soit pour cette page : la progression sera perdue à la fermeture. Téléchargez la sauvegarde en fin de séance, ou ouvrez le jeu avec un compte Claude autorisé."
      : Store.mode === "db" ? "Vous voyez la partie partagée, mais ce compte n'a pas le droit de la modifier. Vos changements ne sont gardés que dans ce navigateur, sur cet ordinateur. Pour une sauvegarde en ligne, la personne qui a créé le jeu doit partager la page avec votre compte Claude en lui donnant le droit de la modifier."
        : "Sans compte Claude autorisé, la partie n'est gardée que dans ce navigateur, sur cet ordinateur. Elle disparaît si les données du navigateur sont effacées (c'est fréquent sur les ordinateurs d'un établissement). Pour une sauvegarde en ligne, ouvrez ce lien en étant connecté à un compte Claude avec lequel la page a été partagée, avec le droit de la modifier.";

    el("p", { class: "etat-sauv " + e.c }, e.t), el("p", { style: "margin:0;color:var(--doux);line-height:1.5" }, explication),
    el("h3", {}, "Garder une copie dans un fichier"),
    el("p", { style: "margin:0;color:var(--doux);line-height:1.5" }, "Le fichier contient toutes les classes. Téléchargez-le en fin de séance ; il se recharge sur n'importe quel ordinateur."),
    el("div", { class: "rangee" }, el("button", { class: "b or", onclick: exporterFichier }, ico("disque"), "Télécharger la sauvegarde"), el("button", { class: "b", onclick: () => fichier.click() }, "Charger un fichier de sauvegarde"), fichier)),
    { classe: "sombre", etroite: true });

async function exporterFichier() {
  const donnees = JSON.stringify({ jeu: "reliques-des-fondateurs", v: 2, date: new Date().toISOString(), liste: registre.liste, parties: Object.fromEntries(registre.liste.map((c) => [c.id, { ...partieDe(c.id), pile: [] }])) });

function importerFichier(f) {

  r.onload = () => {
    let d; try { d = JSON.parse(r.result); if (d.jeu !== "reliques-des-fondateurs" || !Array.isArray(d.liste) || !d.liste.length || !d.parties) throw 0; d.liste = d.liste.filter((c) => c && /^[A-Za-z0-9]{1,24}$/.test(c.id) && d.parties[c.id] && d.parties[c.id].v === 1).map((c) => ({ id: c.id, nom: String(c.nom || "Classe").slice(0, 24) })); if (!d.liste.length) throw 0; }
    catch (e) { toast("Ce fichier n'est pas une sauvegarde du jeu."); return; }

      el("p", { style: "margin:0;color:var(--doux)" }, `Fichier du ${new Date(d.date).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" })}. Les classes actuelles seront remplacées par : ${d.liste.map((c) => `${c.nom} (étape ${Math.min(16, (d.parties[c.id].etape || 0) + 1)})`).join(", ")}. Un point de sauvegarde de chaque classe actuelle est créé avant. Tapez REMPLACER pour confirmer.`), champ,
      el("div", { class: "rangee" }, el("button", { class: "b or", onclick: () => {
        if (champ.value.trim().toUpperCase() !== "REMPLACER") { toast("Tapez REMPLACER pour confirmer."); return; }
        registre.liste.forEach((c) => Store.instantane("Avant le chargement d'un fichier", c.id));

        registre.liste = d.liste;
        d.liste.forEach((c) => { const n = completer(d.parties[c.id]); n.pile = []; n.rev = Math.max(n.rev || 0, (anciens[c.id] && anciens[c.id].rev) || 0); noter("Partie chargée depuis un fichier", n); parties[c.id] = n; Store.sauver(c.id); });
        Store.sauverRegistre(); Store.relier(); afficherAccueil(); toast("Sauvegarde chargée.");
      } }, "Remplacer les classes"))), { classe: "sombre", etroite: true });
  };

/* ================= Scènes animées ================= */
const SCENES_ETAPE = { 6: "hippogriffe", 9: "saule", 10: "calmar", 12: "plongee", 13: "vif" };
const NOMS_SCENES = { express: ["L'arrivée en Poudlard Express", 0], hippogriffe: ["Le vol de l'hippogriffe", 6], saule: ["La colère du Saule cogneur", 9], calmar: ["Le monstre du lac", 10], plongee: ["Plongée sous le lac noir", 12], vif: ["La chasse au Vif d'or", 13], feux: ["Les feux de la victoire", 17] };
function jouerScene(id, fin) {
  if (!Scene3D.ok) { if (fin) fin(); return; }
  const cin = $("#cinema"), txt = $("#cinema-texte"), hud = $("#hud");
  hud.hidden = true; cin.hidden = false; txt.textContent = ""; txt.classList.remove("on"); $("#infobulle").hidden = true;
  const touche = (e) => { if (e.key === "Escape" || e.key === "Enter") { e.preventDefault(); Scene3D.passerScene(); } };
  document.addEventListener("keydown", touche);
  $("#btn-passer").onclick = () => Scene3D.passerScene();
  setTimeout(() => $("#btn-passer").focus({ preventScroll: true }), 50);
  Scene3D.jouerScene(id, {
    classe: nomClasse(courante),
    son: (s) => Son.jouer(s),
    texte: (t) => { if (t) { txt.textContent = t; txt.classList.remove("on"); void txt.offsetWidth; txt.classList.add("on"); } else txt.classList.remove("on"); },
    fin: () => { document.removeEventListener("keydown", touche); cin.hidden = true; if (courante && $("#accueil").hidden) hud.hidden = false; if (fin) fin(); },
  });
}
function lancerEtape() {
  if (etat.etape >= 16) return fenetreFinale();
  const n = etat.etape + 1, sc = SCENES_ETAPE[n];
  if (sc && Scene3D.ok && !etat.scenes[n]) { etat.scenes[n] = 1; Store.sauver(); jouerScene(sc, () => ouvrirQuete(n, "jouer")); }
  else ouvrirQuete(n, "jouer");
}
function fenetreScenes() {
  const ouverte = (n) => n === 0 || prefs.prep || etat.etape >= n - 1;
  const c = el("div", { class: "f-corps" }, el("h2", {}, "Revoir une scène"),
    el("div", { class: "menu-grille" }, Object.entries(NOMS_SCENES).map(([id, [nom, n]]) => {
      const ok = ouverte(n);
      return el("button", { class: "menu-item", disabled: !ok, onclick: () => { Fen.tout(); jouerScene(id); } }, ico(ok ? "film" : "oeil"),
        el("span", {}, el("b", {}, ok ? nom : "Scène encore cachée"), el("small", {}, n === 0 ? "Le début de l'aventure" : n === 17 ? "La grande finale" : `Étape ${n} · ${nomVisible(n)}`)));
    })));
  Fen.ouvrir(c, { classe: "sombre", etroite: true });
}

/* ================= Menu de la classe ================= */
function fenetreMenu() {
  const nd = defisEnAttente().length, no = nbObjets(), ns = SORTS.filter((s) => s.freq !== "finale" && s.etape <= etat.etape).length;
  const item = (icone, titre, sous, action, badge) => el("button", { class: "menu-item", onclick: () => { Fen.fermer(); action(); } }, ico(icone), el("span", {}, el("b", {}, titre), sous && el("small", {}, sous)), badge ? el("span", { class: "badge" }, badge) : null);
  const c = el("div", { class: "f-corps" }, el("h2", {}, nomClasse(courante)),
    el("div", { class: "menu-grille" },
      item("coffre", "Défis maison", nd ? "Un coffre attend son mot de passe" : "Coffres et mots de passe", fenetreDefis, nd || null),
      item("sac", "Le sac", `${no} objet${no > 1 ? "s" : ""}, compagnons et reliques`, fenetreSac),
      item("grimoire", "Les sorts", `${ns} sort${ns > 1 ? "s" : ""} connu${ns > 1 ? "s" : ""} sur ${SORTS.length - 1}`, fenetreSorts),
      item("disque", "Sauvegardes", "Revenir en arrière ou recommencer", () => fenetreSauvegardes(courante)),
      Scene3D.ok && item("film", "Revoir une scène", "Le train, le calmar, l'hippogriffe…", fenetreScenes),
      Scene3D.ok && item("cible", "Recentrer la carte", "Sur l'équipe", () => Scene3D.suivreEquipe()),
      item("aide", "Comment jouer", "Le déroulement d'une séance", fenetreAide),
      item("roue", "Réglages", "Préparation, sons, plein écran", fenetreReglages),
      item("maison", "Méfait accompli", "Refermer la carte, changer de classe", afficherAccueil)));
  Fen.ouvrir(c, { classe: "sombre", etroite: true });
}

/* ================= Démarrage ================= */
function ouvrirClasse(id, { train = false } = {}) {
  courante = id; etat = parties[id];
  Fen.tout(); document.querySelectorAll(".popover-menu").forEach((p) => p.remove());
  const acc = $("#accueil"); acc.classList.add("part"); setTimeout(() => { acc.hidden = true; acc.classList.remove("part"); }, 900);
  Scene3D.ok && Scene3D.orbite(false);
  rendreTout(); Son.jouer("magie");
  const montrer = () => { $("#hud").hidden = false; Scene3D.ok && Scene3D.suivreEquipe(true); const e = Store.etat(); if (e.c === "alerte" && !Store.prevenu) { Store.prevenu = true; toast(e.t + "."); } };
  if ((train || !etat.introVue) && Scene3D.ok) jouerScene("express", () => { if (!etat.introVue) { etat.introVue = true; Store.sauver(); } montrer(); });
  else { if (!etat.introVue) { etat.introVue = true; Store.sauver(); } montrer(); }
}
function afficherAccueil() {
  Fen.tout(); courante = null;
  $("#hud").hidden = true; $("#infobulle").hidden = true;
  rendreAccueil(); $("#accueil").hidden = false;
  if (Scene3D.ok) Scene3D.orbite(true);
}
function demarrer() {
  Store.charger();
  etat = parties[registre.liste[0].id];
  const ok = Scene3D.init($("#scene"), { clic: clicLieu, survol: survolLieu });
  if (!ok) $("#scene").hidden = true;
  rendreTout(); rendreAccueil(); majSync();
  if (ok) Scene3D.orbite(true);
  $("#btn-etape").addEventListener("click", lancerEtape);
  $("#btn-menu").addEventListener("click", fenetreMenu);
  $("#btn-accueil").addEventListener("click", afficherAccueil);
  $("#btn-defi-attente").addEventListener("click", fenetreDefis);
  $("#btn-ajouter-classe").addEventListener("click", () => fenetreNomClasse(null));
  $("#btn-aide-accueil").addEventListener("click", fenetreAide);
  $("#hud-sync").addEventListener("click", fenetreEtatSauvegarde);
  Store.brancher();
}
demarrer();
