<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Les Reliques des Fondateurs</title>
<meta name="description" content="Jeu de quêtes Harry Potter pour une classe de 6e : carte 3D du domaine de Poudlard, 4 héros, 16 étapes." />
<meta name="theme-color" content="#0E1124" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Lexend:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root {
  /* Écran de jeu nocturne : carte 3D plein écran, interface en verre d'encre dorée,
     parchemins pour tout ce qui se lit à voix haute (lettres, épreuves, cartes du destin). */
  --nuit: #0E1124; --verre: rgba(14, 17, 36, .80); --verre-fort: rgba(14, 17, 36, .94);
  --filet: rgba(232, 201, 120, .32); --or: #E8C978; --or-fonce: #B8913A;
  --texte: #F3EEDF; --doux: #B9B6C9;
  --parch: #F3E7C9; --parch-2: #EADBB5; --parch-encre: #2B2116; --parch-filet: #CDB37A; --parch-doux: #6E5B3E;
  --gry: #A3262A; --ser: #2A4C9C; --pou: #E2B12C; --sep: #1F7A4A;
  --gry-c: #FF8A7A; --ser-c: #A9C0FF; --pou-c: #FFD45E; --sep-c: #74E3A6;
  --ok: #4FBF7A; --moyen: #E8B04A; --rate: #E0645A;
  --f-titre: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --f-sc: "IM Fell English SC", "IM Fell English", Georgia, serif;
  --f-ui: "Lexend", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--nuit); color: var(--texte); font-family: var(--f-ui); font-size: 16px; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--or); outline-offset: 2px; }
[hidden] { display: none !important; }
.ico { width: 1.2em; height: 1.2em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.22em; }

#app { position: fixed; inset: 0; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#carte2d { position: absolute; inset: 0; display: grid; place-items: center; padding: 90px 16px 120px; background: radial-gradient(ellipse at 50% 40%, #2a3358, #0E1124 70%); }
#carte2d svg { width: min(100%, 900px); height: 100%; }

/* ---------- HUD ---------- */
.hud { position: absolute; pointer-events: none; }
.hud > * { pointer-events: auto; }
.verre { background: var(--verre); border: 1px solid var(--filet); border-radius: 14px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.hud-haut { top: calc(10px + env(safe-area-inset-top, 0px)); left: 12px; right: 12px; display: flex; gap: 10px; align-items: stretch; justify-content: space-between; flex-wrap: wrap; }
.titre-jeu { padding: 8px 16px; display: grid; gap: 0; min-width: 0; }
.titre-jeu h1 { margin: 0; font-family: var(--f-titre); font-weight: 400; font-size: clamp(1.15rem, 2.2vw, 1.6rem); color: var(--or); line-height: 1.1; }
.titre-jeu p { margin: 0; font-size: .85rem; color: var(--doux); }
.reliques-hud { display: flex; gap: 6px; padding: 6px 10px; align-items: center; }
.slot { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; border: 1.5px dashed var(--filet); color: var(--doux); background: rgba(255,255,255,.03); }
.slot svg { width: 30px; height: 30px; opacity: .35; }
.slot.ok { border: 2px solid var(--or); background: radial-gradient(circle, rgba(232,201,120,.35), rgba(232,201,120,.05)); box-shadow: 0 0 14px rgba(232,201,120,.45); }
.slot.ok svg { opacity: 1; }
.annee-hud { padding: 8px 14px; display: grid; gap: 5px; min-width: 210px; }
.annee-hud .l1 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.annee-hud b { font-family: var(--f-titre); font-weight: 400; font-size: 1.35rem; color: var(--or); }
.annee-hud small { color: var(--doux); font-variant-numeric: tabular-nums; }
.barre { height: 9px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
.barre i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--or-fonce), var(--or)); border-radius: 99px; transition: width .9s cubic-bezier(.2,.8,.2,1); }
.btn-rond { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--verre); border: 1px solid var(--filet); }
.btn-rond:hover { border-color: var(--or); }
.droite-haut { display: flex; gap: 8px; align-items: center; }

.hud-heros { left: 12px; top: 96px; display: grid; gap: 8px; width: 236px; }
.heros { display: grid; grid-template-columns: 54px 1fr; gap: 10px; align-items: center; padding: 8px 10px; border-left: 4px solid var(--hc); }
.heros svg.portrait { width: 54px; height: 54px; }
.heros .nom { font-family: var(--f-titre); font-size: 1.1rem; line-height: 1.1; color: var(--hcc); }
.heros .meta { font-size: .78rem; color: var(--doux); }
.heros .rang { font-size: .8rem; color: var(--texte); display: flex; justify-content: space-between; gap: 6px; margin-top: 3px; }
.pips { display: flex; gap: 3px; margin-top: 4px; }
.pips i { width: 100%; height: 5px; border-radius: 2px; background: rgba(255,255,255,.14); }
.pips i.on { background: var(--hcc); }
.heros.lead { box-shadow: 0 0 0 1px var(--hcc), 0 0 18px -4px var(--hcc); }

.hud-droite { right: 12px; top: 96px; display: grid; gap: 8px; width: 214px; }
.sabliers { padding: 10px; display: grid; gap: 6px; }
.sabliers h2, .panneau-t { margin: 0; font-family: var(--f-sc); font-weight: 400; font-size: .95rem; color: var(--or); letter-spacing: .04em; }
.sabliers-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.sablier { display: grid; justify-items: center; gap: 2px; background: none; border: 0; padding: 4px 0; border-radius: 8px; }
.sablier:hover { background: rgba(255,255,255,.06); }
.sablier svg { width: 34px; height: 52px; }
.sablier b { font-size: .95rem; font-variant-numeric: tabular-nums; }
.sablier small { font-size: .62rem; color: var(--doux); }
.actions-droite { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn-carre { display: grid; justify-items: center; gap: 4px; padding: 10px 6px; font-size: .82rem; position: relative; }
.btn-carre .ico { width: 26px; height: 26px; color: var(--or); }
.btn-carre:hover { border-color: var(--or); }
.pastille { position: absolute; top: 6px; right: 10px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 99px; background: var(--or); color: var(--nuit); font-size: .75rem; font-weight: 700; display: grid; place-items: center; }

.hud-bas { left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; align-items: center; max-width: calc(100% - 24px); }
.btn-etape { display: flex; align-items: center; gap: 14px; padding: 12px 22px 12px 14px; border-radius: 999px; border: 2px solid var(--or); background: linear-gradient(180deg, rgba(40,32,12,.92), rgba(18,16,30,.94)); box-shadow: 0 0 30px -6px rgba(232,201,120,.7); text-align: left; min-width: 0; }
.btn-etape .num { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--or); color: var(--nuit); font-weight: 700; font-size: 1.2rem; flex: none; font-variant-numeric: tabular-nums; }
.btn-etape .t1 { display: block; font-size: .78rem; color: var(--doux); text-transform: uppercase; letter-spacing: .06em; }
.btn-etape .t2 { display: block; font-family: var(--f-titre); font-size: clamp(1.1rem, 2.2vw, 1.5rem); color: var(--texte); line-height: 1.15; }
.btn-etape:hover { box-shadow: 0 0 40px -4px rgba(232,201,120,.9); }
@media (prefers-reduced-motion: no-preference) { .btn-etape { animation: halo 2.6s ease-in-out infinite; } @keyframes halo { 50% { box-shadow: 0 0 44px -2px rgba(232,201,120,.85); } } }
.btn-sec { padding: 10px 16px; border-radius: 999px; background: var(--verre); border: 1px solid var(--filet); display: flex; gap: 8px; align-items: center; font-size: .9rem; white-space: nowrap; }
.btn-sec:hover { border-color: var(--or); }
.chapitre-dots { display: flex; gap: 4px; margin-top: 6px; }
.chapitre-dots i { width: 14px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18); }
.chapitre-dots i.ok { background: var(--or); }
.chapitre-dots i.cur { background: var(--texte); }

#infobulle { position: absolute; pointer-events: none; padding: 8px 12px; border-radius: 10px; background: var(--verre-fort); border: 1px solid var(--filet); font-size: .9rem; transform: translate(-50%, calc(-100% - 14px)); white-space: nowrap; z-index: 5; }
#infobulle b { font-family: var(--f-titre); font-weight: 400; font-size: 1.1rem; color: var(--or); display: block; }
.toast-zone { position: absolute; left: 50%; top: 96px; transform: translateX(-50%); display: grid; gap: 8px; z-index: 30; pointer-events: none; width: min(560px, calc(100% - 24px)); }
.toast { padding: 12px 18px; border-radius: 12px; background: var(--verre-fort); border: 1px solid var(--or); text-align: center; font-size: 1rem; animation: toast 4.2s ease forwards; }
@keyframes toast { 0% { opacity: 0; transform: translateY(-8px); } 8%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }

/* ---------- Fenêtres ---------- */
.voile { position: absolute; inset: 0; background: rgba(6, 7, 16, .62); display: grid; place-items: center; padding: 16px; z-index: 20; backdrop-filter: blur(2px); }
.fenetre { width: min(1100px, 100%); max-height: calc(100% - 8px); overflow: auto; border-radius: 16px; position: relative; }
.fenetre.etroite { width: min(640px, 100%); }
.parchemin { background: linear-gradient(180deg, var(--parch), var(--parch-2)); color: var(--parch-encre); border: 1px solid var(--parch-filet); box-shadow: 0 20px 60px rgba(0,0,0,.55), inset 0 0 80px rgba(150,110,40,.18); }
.sombre { background: var(--verre-fort); border: 1px solid var(--filet); box-shadow: 0 20px 60px rgba(0,0,0,.55); }
.fermer { position: sticky; top: 10px; float: right; margin: 10px 10px 0 0; width: 42px; height: 42px; border-radius: 50%; border: 1px solid currentColor; background: transparent; display: grid; place-items: center; opacity: .75; z-index: 2; }
.fermer:hover { opacity: 1; }
.f-corps { padding: 22px clamp(18px, 3vw, 40px) 28px; display: grid; gap: 18px; }
.parchemin h2, .sombre h2 { margin: 0; font-family: var(--f-titre); font-weight: 400; font-size: clamp(1.6rem, 3.2vw, 2.4rem); line-height: 1.1; }
.parchemin h3, .sombre h3 { margin: 0; font-family: var(--f-sc); font-weight: 400; font-size: 1.1rem; letter-spacing: .04em; }
.parchemin h3 { color: #8A5A1A; }
.sombre h3 { color: var(--or); }
.surtitre { font-family: var(--f-sc); letter-spacing: .05em; font-size: 1rem; color: #8A5A1A; }
.sombre .surtitre { color: var(--or); }

/* quête */
.q-tete { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; border-bottom: 1px solid var(--parch-filet); padding-bottom: 14px; }
.q-tete .chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: .85rem; border: 1px solid var(--parch-filet); background: rgba(255,255,255,.35); }
.chip.h { border-color: var(--hc); color: var(--hc); font-weight: 700; }
.onglets { display: flex; gap: 6px; flex-wrap: wrap; }
.onglet { padding: 9px 16px; border-radius: 999px; border: 1px solid var(--parch-filet); background: rgba(255,255,255,.3); font-size: .95rem; color: var(--parch-encre); display: flex; gap: 8px; align-items: center; }
.onglet .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--parch-encre); color: var(--parch); font-size: .8rem; font-weight: 700; }
.onglet[aria-selected="true"] { background: var(--parch-encre); color: var(--parch); }
.onglet[aria-selected="true"] .n { background: var(--or); color: var(--parch-encre); }
.lettre { font-family: var(--f-titre); font-size: clamp(1.25rem, 2.3vw, 1.65rem); line-height: 1.5; white-space: pre-line; }
.lettre .sign { display: block; text-align: right; font-style: italic; margin-top: 6px; }
.ombre { position: relative; padding: 18px 22px 18px 64px; border-radius: 10px; background: #1A1626; color: #E9E2FF; font-family: var(--f-titre); font-style: italic; font-size: clamp(1.15rem, 2vw, 1.45rem); line-height: 1.5; white-space: pre-line; transform: rotate(-.6deg); box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.ombre::before { content: ""; position: absolute; left: 16px; top: 18px; width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 35% 40%, #fff 0 3px, transparent 4px), radial-gradient(circle at 65% 40%, #fff 0 3px, transparent 4px), #3A2F55; box-shadow: 0 0 16px #8D6BFF; }
.ombre small { display: block; font-family: var(--f-ui); font-style: normal; font-size: .8rem; color: #B9A9F0; margin-bottom: 4px; letter-spacing: .05em; text-transform: uppercase; }
.consigne { font-size: clamp(1.1rem, 1.9vw, 1.35rem); line-height: 1.5; }
.ep-grille { display: grid; gap: 16px; }
@media (min-width: 960px) { .ep-grille { grid-template-columns: 1fr 280px; align-items: start; } }
.ep-cote { display: grid; gap: 12px; position: sticky; top: 10px; }
.boite { border: 1px solid var(--parch-filet); border-radius: 12px; padding: 12px 14px; background: rgba(255,255,255,.35); display: grid; gap: 8px; }
.chrono { font-size: 2.6rem; font-variant-numeric: tabular-nums; font-weight: 700; text-align: center; letter-spacing: .02em; }
.chrono.fini { color: #B3261E; animation: clign 1s steps(2) infinite; }
@keyframes clign { 50% { opacity: .35; } }
.rangee { display: flex; gap: 6px; flex-wrap: wrap; }
.b { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--parch-filet); background: rgba(255,255,255,.55); font-size: .92rem; color: var(--parch-encre); display: inline-flex; gap: 6px; align-items: center; }
.b:hover { border-color: var(--parch-encre); }
.b.plein { background: var(--parch-encre); color: var(--parch); border-color: var(--parch-encre); }
.b.or { background: var(--or); color: var(--nuit); border-color: var(--or-fonce); font-weight: 700; }
.b:disabled { opacity: .45; cursor: not-allowed; }
.sombre .b { background: rgba(255,255,255,.06); color: var(--texte); border-color: var(--filet); }
.sombre .b.or { background: var(--or); color: var(--nuit); }
.questions { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; counter-reset: q; }
.question { border-radius: 12px; padding: 14px 16px; background: rgba(255,255,255,.42); border: 1px solid var(--parch-filet); display: grid; gap: 10px; }
.question .qq { font-size: clamp(1.1rem, 1.9vw, 1.35rem); line-height: 1.45; display: flex; gap: 12px; }
.question .qq::before { counter-increment: q; content: counter(q); flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--parch-encre); color: var(--parch); display: grid; place-items: center; font-weight: 700; font-size: .95rem; }
.choix { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); padding-left: 44px; }
.choix span { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--parch-filet); background: rgba(255,255,255,.5); font-size: 1.05rem; }
.choix span b { margin-right: 6px; }
.choix span.juste { background: #CFE8C9; border-color: #3E8A52; font-weight: 700; }
.reponse { padding: 10px 14px 10px 44px; border-radius: 10px; background: #E1EFD9; border: 1px solid #8DBE8F; font-size: 1.05rem; line-height: 1.45; }
.reponse b { color: #255C33; }
.reponse small { display: block; color: #4E5E45; margin-top: 4px; font-size: .9rem; }
.q-actions { padding-left: 44px; }
.assoc { display: grid; gap: 16px; }
@media (min-width: 760px) { .assoc { grid-template-columns: 1fr 1fr; } }
.assoc ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.assoc li { padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,.5); border: 1px solid var(--parch-filet); font-size: 1.08rem; display: flex; gap: 10px; align-items: baseline; }
.assoc li b { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--parch-encre); color: var(--parch); font-size: .9rem; }
.code-msg { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: clamp(1.3rem, 2.6vw, 2rem); letter-spacing: .12em; line-height: 1.6; padding: 18px; border-radius: 12px; background: #2B2116; color: #F3E7C9; text-align: center; word-break: break-word; }
.cle { font-size: 1.1rem; line-height: 1.5; padding: 12px 14px; border-radius: 10px; border: 1px dashed var(--parch-filet); }
.indice { padding: 12px 14px; border-radius: 10px; background: #FFF4C9; border: 1px solid #E0BF55; font-size: 1.08rem; }
.note-prof { font-size: .92rem; color: var(--parch-doux); border-top: 1px dashed var(--parch-filet); padding-top: 10px; }
.deroulement { font-size: .98rem; line-height: 1.5; }
details.prof summary { cursor: pointer; font-family: var(--f-sc); color: #8A5A1A; font-size: 1rem; }
.joker { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; font-size: .88rem; }
.joker svg { width: 32px; height: 32px; }
.joker b { display: block; font-size: .92rem; }
.joker small { color: var(--parch-doux); line-height: 1.3; display: block; }
.joker .b { padding: 6px 10px; font-size: .82rem; }
.resultats { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.res { padding: 16px; border-radius: 14px; border: 2px solid var(--parch-filet); background: rgba(255,255,255,.45); display: grid; gap: 4px; text-align: left; color: var(--parch-encre); }
.res b { font-family: var(--f-titre); font-weight: 400; font-size: 1.5rem; }
.res small { color: var(--parch-doux); }
.res[aria-pressed="true"].reussite { border-color: #2F7D4A; background: #D8EED5; }
.res[aria-pressed="true"].partielle { border-color: #B07A12; background: #F7E7BF; }
.res[aria-pressed="true"].echec { border-color: #A23B33; background: #F3D3CD; }
.maisons-choix { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.m-choix { padding: 12px; border-radius: 12px; border: 2px solid var(--parch-filet); background: rgba(255,255,255,.45); display: flex; gap: 10px; align-items: center; color: var(--parch-encre); font-size: 1rem; }
.m-choix i { width: 18px; height: 18px; border-radius: 50%; background: var(--hc); flex: none; }
.m-choix[aria-pressed="true"] { border-color: var(--hc); background: #fff; box-shadow: 0 0 0 2px var(--hc) inset; font-weight: 700; }
.valider { justify-self: end; padding: 16px 30px; font-size: 1.2rem; border-radius: 999px; }
.bandeau-prep { padding: 8px 14px; border-radius: 10px; background: #2B2116; color: var(--parch); font-size: .9rem; }

/* récompenses, destin, reliques */
.centre { text-align: center; justify-items: center; }
.gain-xp { font-family: var(--f-titre); font-size: clamp(2.6rem, 6vw, 4.2rem); color: var(--or); line-height: 1; }
.gains { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.gain { display: grid; justify-items: center; gap: 6px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--filet); background: rgba(255,255,255,.05); width: 150px; font-size: .9rem; text-align: center; }
.gain svg { width: 54px; height: 54px; }
.gain b { font-size: .95rem; }
.annee-up { padding: 14px 18px; border-radius: 14px; border: 2px solid var(--or); background: radial-gradient(circle at 50% 0, rgba(232,201,120,.25), transparent 70%); }
.carte-destin { width: min(400px, 100%); aspect-ratio: 4 / 5; perspective: 1200px; margin: 0 auto; }
.carte-destin .inner { position: relative; width: 100%; height: 100%; transition: transform .9s cubic-bezier(.3,.7,.2,1); transform-style: preserve-3d; }
.carte-destin.retournee .inner { transform: rotateY(180deg); }
.face, .dos { position: absolute; inset: 0; border-radius: 18px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; padding: 26px; text-align: center; }
.dos { background: repeating-linear-gradient(45deg, #2A2148 0 12px, #241C3E 12px 24px); border: 3px solid var(--or); box-shadow: inset 0 0 0 8px #1A1430, inset 0 0 0 10px var(--or-fonce); }
.dos span { font-family: var(--f-titre); font-size: 2rem; color: var(--or); }
.face { transform: rotateY(180deg); background: linear-gradient(180deg, var(--parch), var(--parch-2)); color: var(--parch-encre); border: 3px solid var(--or-fonce); align-content: center; gap: 14px; }
.face h3 { font-family: var(--f-titre); font-size: 1.8rem; color: var(--parch-encre); letter-spacing: 0; }
.face h3::before { content: "✦"; display: block; font-size: 1.6rem; color: var(--or-fonce); margin-bottom: 6px; }
.face.nefaste h3::before { content: "☾"; color: #7A2E5A; }
.face p { margin: 0; font-size: 1.12rem; line-height: 1.45; }
.face .effet { font-weight: 700; font-size: 1.2rem; }
.face.nefaste { border-color: #7A2E5A; background: linear-gradient(180deg, #EBDCEB, #D9C4D9); }
.relique-scene { width: 220px; height: 220px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle, rgba(232,201,120,.45), rgba(232,201,120,0) 70%); }
.relique-scene svg { width: 150px; height: 150px; filter: drop-shadow(0 0 18px rgba(255,220,140,.8)); }
@media (prefers-reduced-motion: no-preference) { .relique-scene svg { animation: flotte 3s ease-in-out infinite; } @keyframes flotte { 50% { transform: translateY(-8px) rotate(3deg); } } }

/* panneaux sac / grimoire / réglages */
.grille-objets { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.objet { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 12px; border-radius: 12px; border: 1px solid var(--filet); background: rgba(255,255,255,.04); align-items: start; }
.objet svg { width: 52px; height: 52px; }
.objet b { display: block; font-size: 1rem; }
.objet small { display: block; color: var(--doux); line-height: 1.35; font-size: .85rem; }
.objet .qte { color: var(--or); font-weight: 700; margin-left: 4px; }
.objet .rangee { margin-top: 6px; }
.objet.vide { opacity: .4; }
.sort { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--filet); }
.sort .an { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--or); color: var(--or); font-family: var(--f-titre); font-size: 1.1rem; }
.sort b { font-family: var(--f-titre); font-weight: 400; font-size: 1.35rem; color: var(--or); }
.sort small { display: block; color: var(--doux); }
.sort.verrou { opacity: .42; }
.sort .etat { font-size: .8rem; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--filet); color: var(--doux); white-space: nowrap; }
.sort .etat.dispo { color: var(--ok); border-color: var(--ok); }
.liste-defis { display: grid; gap: 12px; }
.defi { border: 1px solid var(--parch-filet); border-radius: 12px; padding: 14px; background: rgba(255,255,255,.4); display: grid; gap: 10px; }
.defi.fait { opacity: .6; }
.champ-mdp { display: flex; gap: 8px; flex-wrap: wrap; }
.champ-mdp input { flex: 1 1 200px; min-width: 0; padding: 12px 14px; font-size: 1.3rem; letter-spacing: .12em; text-transform: uppercase; border-radius: 10px; border: 2px solid var(--parch-filet); background: #fff; color: var(--parch-encre); font-family: "IBM Plex Mono", ui-monospace, monospace; }
.reglages { display: grid; gap: 10px; }
.reglage { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--filet); flex-wrap: wrap; }
.reglage p { margin: 0; color: var(--doux); font-size: .88rem; }
.reglage b { display: block; }
textarea.sauvegarde { width: 100%; min-height: 90px; font-family: ui-monospace, monospace; font-size: .75rem; background: rgba(0,0,0,.3); color: var(--texte); border: 1px solid var(--filet); border-radius: 10px; padding: 10px; }
.journal { max-height: 240px; overflow: auto; font-size: .85rem; color: var(--doux); display: grid; gap: 4px; padding: 0; margin: 0; list-style: none; }
.popover-maison { position: absolute; z-index: 25; padding: 10px; display: grid; gap: 6px; width: 200px; }
.popover-maison .rangee .b { flex: 1; justify-content: center; }

/* intro */
#intro { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at center, rgba(30,24,10,.55), rgba(6,7,16,.92)); transition: opacity 1.2s ease; }
#intro.part { opacity: 0; pointer-events: none; }
.intro-carte { width: min(680px, 100%); padding: clamp(24px, 5vw, 48px); text-align: center; display: grid; gap: 18px; justify-items: center; border-radius: 6px; }
.intro-carte h1 { margin: 0; font-family: var(--f-titre); font-weight: 400; font-size: clamp(2.2rem, 6vw, 3.6rem); line-height: 1.05; }
.intro-carte p { margin: 0; font-size: 1.05rem; color: var(--parch-doux); }
.serment { font-family: var(--f-titre); font-style: italic; font-size: clamp(1.2rem, 2.6vw, 1.6rem); padding: 16px 26px; border-radius: 999px; border: 2px solid var(--parch-encre); background: transparent; color: var(--parch-encre); }
.serment:hover { background: var(--parch-encre); color: var(--parch); }
.sync { font-size: .78rem; color: var(--doux); display: inline-flex; gap: 6px; align-items: center; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--doux); }
.sync.db i { background: var(--ok); }

/* confettis finale */
.etincelles { position: absolute; inset: 0; pointer-events: none; z-index: 35; overflow: hidden; }
.etincelles i { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 2px; opacity: .9; animation: tombe linear forwards; }
@keyframes tombe { to { transform: translateY(110vh) rotate(720deg); opacity: .2; } }

/* ---------- Petits écrans ---------- */
@media (max-width: 980px) {
  .hud-heros { top: auto; bottom: 104px; left: 8px; right: 8px; width: auto; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .heros { grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 6px; border-left: 0; border-top: 3px solid var(--hc); }
  .heros svg.portrait { width: 40px; height: 40px; }
  .heros .meta, .heros .rang span:last-child { display: none; }
  .heros .nom { font-size: .95rem; }
  .hud-droite { top: auto; bottom: 238px; right: 8px; width: 170px; }
  .sabliers { display: none; }
  .annee-hud { min-width: 150px; }
  .reliques-hud { display: none; }
}
@media (max-width: 560px) {
  .hud-droite { bottom: 200px; width: 150px; }
  .btn-etape { padding: 10px 16px 10px 10px; }
  .btn-etape .t1 { display: none; }
  .hud-heros { bottom: 86px; }
  .btn-etape .num { width: 38px; height: 38px; }
  .titre-jeu p { display: none; }
  .hud-heros .rang { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const QUETES = {"1": {"num": 1, "titre": "Le Grand Dégnomage", "lieu": "Le Parc du château", "heros": "capucine", "recit": "Un matin de novembre, le brouillard traîne encore sur le parc du château. Un hibou couleur chocolat au lait traverse le ciel en zigzaguant… et s'écrase tête la première dans le potager de Hagrid, entre deux citrouilles grosses comme des armoires. C'est Moka, le hibou de l'équipe. Il a des feuilles mortes plein les plumes, une lettre dans le bec et l'air très, très vexé.\n\nCapucine Boisjoli le ramasse avec douceur. Léo Flamberge lui gratte la tête. Iris Plumelune déchiffre l'enveloppe : « Aux quatre héros de Poudlard. URGENT. Très urgent. Encore plus urgent que ça. » Silas Vifargent, lui, recule d'un pas : « Il sent le compost. »\n\nCapucine lit à voix haute :\n« Chers héros,\nIl y a plus de mille ans, quatre grands sorciers ont fondé Poudlard : Godric Gryffondor, Rowena Serdaigle, Helga Poufsouffle et Salazar Serpentard. Avant de quitter l'école, chacun a caché dans le domaine une relique pour la protéger : une Coupe, une Épée, un Médaillon et un Diadème. Cette année, les reliques se réveillent… et quelqu'un d'autre les cherche. Vous devez les trouver les premiers. Je vous confie ce vieux parchemin. Il a l'air vide. Il ne l'est pas. Pour savoir par où commencer… »\n\nEt c'est tout. La suite a disparu ! Le bas de la lettre a été grignoté, arraché, déchiqueté en six morceaux. Dans les buissons, on entend de petits rires grinçants : les gnomes de jardin ! Hauts comme trois pommes, une tête en forme de pomme de terre et des pieds durs comme de la corne, ils agitent chacun un bout de parchemin en tirant la langue.\n\nSilas soupire : « Formidable. Des patates qui parlent. »\nCapucine retrousse ses manches : « Ma grand-mère en avait plein son jardin. Les gnomes adorent les devinettes : ils rendent ce qu'ils ont chipé à ceux qui trouvent la réponse. Ensuite, on les fait tournoyer et on les envoie par-dessus la haie. Ils ne se font aucun mal… et ils reviennent la semaine suivante, en boudant. »\nLéo sourit jusqu'aux oreilles : « Opération Grand Dégnomage ! »", "message_ombre": "Quatre petits héros pour quatre vieux trésors ?\nHi hi hi ! J'en fais des loopings, j'en ricane, je m'en tords !\nCachez vos encriers, vos craies et vos chaussettes :\nL'Ombre trouvera tout avant vous… petites mauviettes !", "epreuve": {"type": "enigmes", "titre": "Les six devinettes des gnomes", "consigne": "Six gnomes de jardin ont chacun chipé un morceau de la lettre. Pour le récupérer, trouvez la réponse à leur devinette : UN SEUL MOT, écrit sur l'ardoise de votre maison. Attention, les gnomes adorent les charades : « mon premier » = la première syllabe, « mon second » = la deuxième, « mon tout » = le mot entier. Quand un nombre est indiqué entre parenthèses, c'est le nombre de lettres du mot.", "deroulement": "Avant de commencer (2 min), chaque maison désigne un « gardien de l'ardoise » (celui qui écrit ; on change à chaque gnome pour que tout le monde écrive) et un « lanceur de gnome ».\n\nPour chaque gnome (environ 3 min par devinette) : le prof lit la devinette deux fois, puis les maisons réfléchissent 1 min 30 à voix basse. Dès qu'une maison pense avoir trouvé, elle pose son ardoise FACE CACHÉE sur la table et le prof note l'ordre d'arrivée. Au bout d'1 min 30 : « Ardoises en l'air ! ». Chaque maison qui a la bonne réponse gagne 1 point de maison. Parmi les maisons qui ont juste, celle qui a posé son ardoise EN PREMIER envoie son lanceur « dégnomer » : il fait tournoyer une boulette-gnome au-dessus de sa tête et la lance dans la corbeille-haie placée à 3 mètres. Si elle rentre : +1 point bonus.\n\nAprès le 6e gnome (5 min), le prof lit la fin reconstituée de la lettre : « … Pour savoir par où commencer, prenez votre BAGUETTE, laissez votre BALAI au placard (on y va à pied), éteignez le feu sous votre CHAUDRON et suivez Moka, votre HIBOU, jusqu'à la SERRE n°1 du professeur Chourave. Et regardez où vous mettez les pieds : le parc est plein de TROUS de gnomes ! Bonne chance. Albus Dumbledore. P.-S. : Pour réveiller le parchemin, posez votre baguette dessus et dites : « Je jure solennellement que mes intentions sont mauvaises. » Pour l'endormir : « Méfait accompli. » »\n\nToute la classe se lève, main sur la baguette (un crayon fait l'affaire), et prononce la formule d'une seule voix. La Carte du Maraudeur s'affiche en 3D… puis une tache d'encre y fait apparaître le premier message de l'Ombre.\n\nOnt brillé : les deux maisons qui totalisent le plus de points (bonnes réponses + gnomes lancés dans la haie).", "duree": 30, "questions": [{"q": "Gnome n°1, Radisdur : « Mon premier se porte au doigt. Mon second surveille en cachette : on dit qu'il fait le guet. Mon tout est en bois et lance des sorts. Qui suis-je ? »", "choix": [], "reponse": "BAGUETTE", "explication": "Bague + guet = baguette. Radisdur rend le premier morceau de la lettre en ronchonnant."}, {"q": "Gnome n°2, Patatras : « Mon premier est une grande fête où l'on danse. Mon second est blanc et sort de la vache. Mon tout vole dans le ciel avec un sorcier dessus… mais chez les Moldus, il sert seulement à faire le ménage. Qui suis-je ? »", "choix": [], "reponse": "BALAI", "explication": "Bal + lait = balai. Les Moldus, ce sont les gens sans pouvoirs magiques : eux ne font que balayer avec !"}, {"q": "Gnome n°3, Grosbulbe : « Mon premier est le contraire de froid. Mon second n'a aucun coin. Dans mon tout, Silas fait bouillir ses potions. Qui suis-je ? »", "choix": [], "reponse": "CHAUDRON", "explication": "Chaud + rond = chaudron. Silas approuve : c'est le seul objet du parc qui ne sent pas la boue."}, {"q": "Gnome n°4, Tubercule : « Je dors le jour et je hulule la nuit. Chez les sorciers, je suis facteur. Moka, le messager de votre équipe, en est un. Quel oiseau suis-je ? (5 lettres) »", "choix": [], "reponse": "HIBOU", "explication": "Moka est le hibou de l'équipe. Chez les sorciers, ce sont les hiboux et les chouettes qui portent le courrier."}, {"q": "Gnome n°5, Grignotin : « Au pluriel, les aigles en ont au bout des pattes. Au singulier, je suis une maison de verre où les jardiniers font pousser leurs plantes au chaud. Qui suis-je ? (5 lettres) »", "choix": [], "reponse": "SERRE", "explication": "Les serres d'un aigle sont ses griffes ; une serre, c'est aussi une maison de verre pour les plantes. Voilà la prochaine destination !"}, {"q": "Gnome n°6, le Grand Chef Patate-Douce : « Plus on m'enlève de terre, plus je deviens grand. Mes cousins et moi, on en creuse partout dans le parc. Qui suis-je ? (4 lettres) »", "choix": [], "reponse": "TROU", "explication": "Plus on retire de terre d'un trou, plus il grandit. Le Grand Chef rend le dernier morceau, avec la signature, puis s'envole par-dessus la haie en criant « Je reviendraaaai ! »."}], "paires": [], "ordre": [], "code": {"message": "", "cle": "", "reponse": ""}, "indice": "Pour les charades, découpez le mot en sons : « mon premier » donne la première syllabe, « mon second » la deuxième. Le nombre entre parenthèses, c'est le nombre de lettres du mot. Pour le dernier gnome : pensez à ce que les gnomes creusent partout dans le jardin.", "reussite": "Réussite : 18 bonnes réponses ou plus sur 24 (6 devinettes × 4 maisons) : la lettre est entière et tous les gnomes filent par-dessus la haie. Partielle : 12 à 17 bonnes réponses : la lettre est reconstituée, mais un gnome a gardé un coin en souvenir (et mordillé le mollet de Léo). Échec : 11 bonnes réponses ou moins : Moka doit aller rechercher lui-même les morceaux ; l'aventure commence quand même, mais sans récompense."}, "defi_maison": {"titre": "Le poème du gnome poète", "consigne": "Un gnome vexé a glissé ce poème dans la poche de Léo. Il cache un mot de passe très utile pour la prochaine mission : lis la PREMIÈRE LETTRE de chaque vers, de haut en bas. Tape ce mot dans le jeu au début de la prochaine séance.", "contenu": "Le long des pots, dans l'ombre, une liane se faufile,\nUne plante qui t'enlace comme un câlin de crocodile.\nMais elle a peur d'un rien : d'un rayon, d'une étincelle…\nOse dire le bon mot, baguette pointée vers elle,\nSans demander son reste, elle lâchera tes chevilles !", "mot_de_passe": "LUMOS"}, "note_prof": "Préparez six boulettes de papier avec une tête de gnome dessinée dessus et une corbeille posée à 3 mètres (la « haie ») pour le lancer de gnome. Moment fort : faites lever toute la classe pour prononcer la formule de la Carte avant de révéler la carte 3D, lumière éteinte si possible."}, "2": {"num": 2, "titre": "Le Filet du Diable", "lieu": "La Serre n°1", "heros": "capucine", "recit": "Moka arrive en voletant, un peu de terre sur le bec, avec une lettre qui sent le terreau et la tisane de camomille.\n« Chers héros,\nBravo pour le dégnomage : les potirons de Hagrid vous remercient. Dans la Serre n°1, celle des débutants, se cache le premier indice d'Helga Poufsouffle : une feuille d'or. Je vous ouvre la porte, mais attention : cette nuit, quelqu'un a mis un bazar épouvantable dans mes pots. Ne touchez à rien sans gants, ne mordez rien, et surtout, SURTOUT, gardez votre calme.\nProfesseur Chourave »\n\nDans la serre, il fait chaud et humide comme dans une salle de bains après la douche de Hagrid. Des feuilles géantes, des fleurs qui bâillent, des cactus qui font des bulles. Capucine est aux anges. Silas essuie ses chaussures toutes les dix secondes. Iris prend des notes. Léo renifle une orchidée, qui lui éternue dessus.\n\nSoudain : BLAM ! La porte claque derrière eux. Dehors, un ricanement s'éloigne en sautillant. Les lampes s'éteignent une à une. Dans le noir, quelque chose de mou, de froid et d'un peu gluant s'enroule autour des chevilles de Léo… puis de Silas… puis d'Iris… C'est le Filet du Diable !\n« LÂCHE-MOI, ESPÈCE DE SALADE ! » hurle Léo en gigotant comme un ver de terre.\n« Mes chaussures neuves ! » gémit Silas.\nIris fouille sa mémoire à toute vitesse. Capucine, elle, ferme les yeux, prend une grande inspiration… et sort son petit carnet de Botanique, couvert de notes.\n\nÀ vous de jouer : chaque bonne réponse desserre les lianes. Chaque erreur… les fait serrer un peu plus fort !", "message_ombre": "Sortis du Filet du Diable ? Zut, quelle déception !\nJ'avais soufflé les lampes en chantant ma plus belle chanson…\nRira bien qui rira le dernier, mes petits champignons :\nMes pots de fleurs volants vous attendent au plafond !", "epreuve": {"type": "qcm", "titre": "Ficelés dans la Serre n°1", "consigne": "Prisonniers du Filet du Diable ! Lisez bien chaque question : la réponse se cache souvent dans le carnet de Capucine. Chaque maison écrit sa réponse sur son ardoise. Chaque erreur fait serrer le Filet d'un anneau : à 11 anneaux, l'équipe est ficelée comme un rôti !", "deroulement": "Avant la lecture, le prof dessine au coin du tableau le « Filet-o-mètre » : une liane enroulée autour des quatre héros, découpée en 11 anneaux vides numérotés de 1 à 11 (le 11e en rouge : « ficelés comme un rôti »).\n\nPour chaque question (6 au total, environ 4 min chacune) : le prof lit la question et les choix à voix haute, chaque maison discute 1 min en chuchotant (2 à 3 min pour la question 6, la plus rusée), puis « Ardoises en l'air ! ». Chaque maison qui a juste gagne 1 point de maison. Pour chaque maison qui se trompe, le prof colorie un anneau du Filet, avec un bruit de liane qui serre (au-delà de 11 erreurs, il continue à compter dans la marge).\n\nAprès chaque question, le prof demande à une maison qui a juste d'expliquer son raisonnement en une phrase : une explication claire rapporte 1 point bonus. Pour la question 6, la première maison qui vient expliquer au tableau pourquoi la clé est dans le bon pot gagne 2 points bonus.\n\nQuand la classe trouve « Lumos » (question 2), le prof rallume la lumière d'un coup : les lianes s'enfuient sous les pots ! À la fin, on compte les anneaux coloriés du Filet-o-mètre pour connaître le résultat de l'équipe.\n\nOnt brillé : les maisons qui totalisent le plus de points (bonnes réponses + explications).", "duree": 30, "questions": [{"q": "Des lianes molles et froides s'enroulent autour de vos chevilles ! Le carnet de Capucine dit : « Filet du Diable : plus on se débat, plus il serre. » Que doit faire l'équipe ?", "choix": ["Se débattre de toutes ses forces", "Rester calme et ne plus bouger", "Mordre les lianes", "Appeler Moka pour qu'il tire"], "reponse": "Rester calme et ne plus bouger", "explication": "Le Filet du Diable serre ceux qui gigotent. Si l'on reste détendu et immobile, il relâche sa prise. Léo a eu du mal, mais il a fini par faire la statue."}, {"q": "Les lianes ont desserré, mais elles tiennent encore Silas par les pieds. Le carnet de Capucine dit : « Il aime l'ombre et l'humidité. Il déteste la lumière et la chaleur. » Quel sort Iris doit-elle lancer ? (Indice : en latin, lumen veut dire « lumière ».)", "choix": ["Wingardium Leviosa", "Lumos", "Alohomora", "Expelliarmus"], "reponse": "Lumos", "explication": "Lumos allume le bout de la baguette comme une lampe de poche. Ébloui, le Filet du Diable se recroqueville et file se cacher sous les pots."}, {"q": "Libres ! Pour atteindre l'étagère du fond, il faut déplacer un géranium dentu : une jolie fleur rose… qui claque des dents comme une agrafeuse. Comment le déplacer sans y laisser un doigt ?", "choix": ["À mains nues, il a l'air gentil", "Avec d'épais gants en peau de dragon", "En lui tendant la main pour qu'il la renifle", "En lui chatouillant les pétales"], "reponse": "Avec d'épais gants en peau de dragon", "explication": "Le géranium dentu mord tout ce qui passe à sa portée. Des gants bien épais, et on le tient par le pot, jamais par la tête !"}, {"q": "Sur l'étagère trône une plante qui ressemble à une grosse limace noire couverte de bosses luisantes : un Bubobulb. Son étiquette dit : « Pus de Bubobulb : contre l'acné. Ne jamais toucher pur ! » À quoi sert son pus ?", "choix": ["À faire repousser les cheveux", "À soigner les boutons", "À rendre invisible", "À parfumer la Grande Salle"], "reponse": "À soigner les boutons", "explication": "L'acné, ce sont les boutons. Mais attention : pur, ce pus jaunâtre irrite la peau, d'où les gants. Silas, qui voulait en mettre sur son menton, a vite changé d'avis."}, {"q": "Dans un bocal d'eau salée flotte une touffe d'algues gluantes, grises et vertes : de la Branchiflore. Iris remarque que son nom ressemble à « branchies », l'organe qui permet aux poissons de respirer. Que se passe-t-il quand on en mâche ?", "choix": ["On devient invisible", "On peut respirer sous l'eau", "On peut parler aux plantes", "On devient vert à pois roses"], "reponse": "On peut respirer sous l'eau", "explication": "Pendant environ une heure, des branchies poussent dans le cou et les mains deviennent palmées. Capucine en glisse une poignée dans sa poche : ça pourrait servir, un jour, au bord du lac…"}, {"q": "La porte est verrouillée ! La clé est cachée dans l'un des trois pots du fond. Pot A : « La clé est ici. » Pot B : « La clé n'est pas ici. » Pot C : « La clé n'est pas dans le pot A. » L'Ombre a trafiqué les étiquettes : UNE SEULE dit la vérité. Dans quel pot est la clé ?", "choix": ["Dans le pot A", "Dans le pot B", "Dans le pot C"], "reponse": "Dans le pot B", "explication": "Si la clé était dans le pot A, les étiquettes A et B diraient vrai : deux vérités, impossible. Si elle était dans le pot C, les étiquettes B et C diraient vrai : impossible aussi. Dans le pot B : A ment, B ment, seule C dit vrai. Et sous la clé… la première feuille d'or d'Helga !"}], "paires": [], "ordre": [], "code": {"message": "", "cle": "", "reponse": ""}, "indice": "Relisez la phrase du carnet de Capucine dans chaque question : la réponse y est presque toujours. Pour les pots : imaginez la clé dans le pot A, puis dans le B, puis dans le C, et comptez à chaque fois combien d'étiquettes disent vrai.", "reussite": "Réussite : 0 à 5 anneaux sur le Filet-o-mètre (19 bonnes réponses ou plus sur 24) : l'équipe sort libre et trouve la feuille d'or. Partielle : 6 à 10 anneaux (14 à 18 bonnes réponses) : l'équipe s'en sort, mais ébouriffée et couverte de sève. Échec : 11 anneaux ou plus (13 bonnes réponses ou moins) : l'équipe est ficelée comme un rôti ; le professeur Chourave vient la délivrer en ronchonnant, et la feuille d'or est récupérée quand même."}, "defi_maison": {"titre": "L'étiquette à l'envers", "consigne": "Sous la clé du pot B, Iris a trouvé une étiquette venue de la Serre n°3. Pour vous embrouiller, l'Ombre l'a écrite À L'ENVERS, de droite à gauche ! Lis-la en commençant par la dernière lettre : tu découvriras la règle d'or de la prochaine mission. Tape ce mot dans le jeu au début de la prochaine séance.", "contenu": "Étiquette : « E C N E L I S »\n\nAstuce : recopie les lettres sur ton cahier en partant de la droite.", "mot_de_passe": "SILENCE"}, "note_prof": "Éteignez la lumière (ou fermez les volets) pendant la lecture du récit et rallumez d'un coup quand la classe trouve « Lumos » : effet garanti. La lumière du projecteur suffit pour jouer la question 1 dans la pénombre. Ceux qui ont fait le défi maison LUMOS ont la réponse de la question 2 : félicitez-les en public."}, "3": {"num": 3, "titre": "Silence, ça rempote !", "lieu": "La Serre n°3", "heros": "capucine", "recit": "Cette fois, Moka arrive avec des cache-oreilles roses à pompons sur la tête. Il a l'air parfaitement ridicule, et il le sait. Dans ses serres, une lettre qui sent le terreau :\n« Chers héros,\nLa feuille d'or de la Serre n°1 montre la Serre n°3. Mauvaise nouvelle : c'est la serre des Mandragores. Bonne nouvelle : elles sont encore toutes jeunes. Une Mandragore est une plante dont la racine ressemble à un bébé tout fripé, tout terreux et très grognon. Quand on la sort de terre, elle pousse un cri si perçant que celui qui l'entend s'endort aussitôt, pour plusieurs heures. On se réveille sans aucun mal… mais avec de la terre dans les narines et une drôle de migraine. La deuxième feuille d'or est coincée dans les racines de l'une d'elles. Il faut donc rempoter toutes mes Mandragores, une par une, avant l'hiver. Les cache-oreilles sont sur la table. Je compte sur vous.\nProfesseur Chourave\nP.-S. : Les cache-oreilles roses que porte Moka sont à moi. Il refuse de me les rendre. »\n\nDans la Serre n°3, des dizaines de pots sont alignés. Dans chacun, une petite touffe de feuilles violettes frémit doucement : les Mandragores font la sieste. Léo s'élance déjà, les mains en avant. Capucine l'attrape par la capuche : « Doucement ! Une seule erreur et on dort tous ici jusqu'à Noël. » Silas croise les bras : « Je refuse de tirer les cheveux d'un légume qui hurle. » Mais quand Iris lui rappelle qu'une Mandragore adulte sert à préparer l'une des potions les plus précieuses du monde, il remonte ses manches… du bout des doigts.\n\nSur la table, Iris trouve la fiche de rempotage du professeur Chourave… découpée en huit morceaux et toute mélangée. Au dos d'un morceau : une empreinte de pouce pleine d'encre. L'Ombre est passée par là !\nCapucine pose un doigt sur ses lèvres. À partir de maintenant : plus un mot. Les Mandragores dorment…", "message_ombre": "Vous aviez vos cache-oreilles ? Quelle injustice, quel ennui !\nMoi qui flottais au plafond pour vous voir ronfler jusqu'à minuit…\nPour me venger, j'ai versé de l'encre dans tous vos arrosoirs :\nVos Mandragores auront le nez bleu jusqu'à ce soir !", "epreuve": {"type": "ordre", "titre": "Le rempotage des Mandragores", "consigne": "Les Mandragores dorment. Remettez dans le bon ordre les 8 étapes du rempotage… EN SILENCE ! Interdiction de parler : on communique par gestes et par écrit. Si la Mandragore vous entend, elle crie !", "deroulement": "Phase 1 — Le grand silence (10 min) : les 8 étapes s'affichent dans le désordre. Chaque maison recopie sur son ardoise l'ordre qu'elle propose (en reprenant les numéros ou les lettres affichés). Règle des cache-oreilles : interdiction de parler ! On communique par gestes, par mimes et en écrivant sur un brouillon. Si une maison parle à voix haute, la Mandragore (le prof) pousse un petit cri suraigu et la maison perd 1 point.\n\nPhase 2 — La correction (5 min) : « Ardoises en l'air ! » Le prof dévoile le bon ordre étape par étape. Chaque étape à la bonne place rapporte 1 point à la maison (8 points maximum par maison).\n\nPhase 3 — Le rempotage chronométré (12 min) : chaque maison envoie un « jardinier » devant la classe (1 à 2 min par jardinier). Il mime les 8 gestes dans le bon ordre, en silence et le plus vite possible, avec une Mandragore imaginaire. Le prof chronomètre. Un geste oublié ou inversé ? La Mandragore crie : le jardinier s'évanouit théâtralement sur une chaise, se relève et repart avec 10 secondes de pénalité. Meilleur temps : 3 points ; deuxième : 2 points ; troisième : 1 point.\n\nBonus (facultatif, à l'oral, 1 min) : le prof demande « À quoi sert une Mandragore adulte ? A) À rendre les gens invisibles. B) À préparer une potion qui guérit les personnes pétrifiées, c'est-à-dire changées en statue. C) À faire repousser les cheveux. » Réponse : B. 1 point bonus à la première maison qui lève la main avec la bonne lettre.\n\nOnt brillé : les deux maisons qui totalisent le plus de points (ordre + mime + bonus).", "duree": 30, "questions": [], "paires": [], "ordre": ["Enfiler ses cache-oreilles et bien les serrer sur les deux oreilles", "Lever le pouce pour vérifier que toute l'équipe est protégée", "Empoigner fermement la touffe de feuilles de la Mandragore", "Tirer d'un coup sec pour la sortir de son petit pot", "La déposer aussitôt dans un grand pot rempli de terreau", "L'enfouir sous le terreau en ne laissant dépasser que ses feuilles", "Tasser doucement la terre et arroser d'eau tiède", "Attendre le signal de Capucine, puis retirer ses cache-oreilles"], "code": {"message": "", "cle": "", "reponse": ""}, "indice": "Demandez-vous : qu'est-ce qui doit être fait AVANT que la Mandragore sorte de terre ? Et qu'est-ce qui doit attendre qu'elle soit bien enterrée et calmée ?", "reussite": "Réussite : 26 étapes bien placées ou plus sur 32 (8 étapes × 4 maisons) : toutes les Mandragores sont rempotées et la feuille d'or est trouvée dans les racines de la dernière. Partielle : 18 à 25 étapes bien placées : quelques Mandragores ont crié, deux héros ont fait une petite sieste, mais la feuille d'or est là. Échec : 17 étapes bien placées ou moins : tout le monde s'endort dans la serre et se réveille deux heures plus tard… avec la feuille d'or posée sur le nez de Silas, qui est furieux."}, "defi_maison": {"titre": "Les chiffres de la feuille d'or", "consigne": "Au dos de la deuxième feuille d'or, Capucine a découvert une suite de nombres gravés. Remplace chaque nombre par la lettre qui a ce rang dans l'alphabet (A=1, B=2, C=3…). Tu obtiendras le nom de l'animal qui garde le Jardin d'Helga. Tape-le dans le jeu au début de la prochaine séance.", "contenu": "2 – 12 – 1 – 9 – 18 – 5 – 1 – 21\n\nIndice : cet animal noir et blanc creuse des terriers… et c'est l'emblème de la maison de Capucine.", "mot_de_passe": "BLAIREAU"}, "note_prof": "La phase 1 se joue en silence total : vous êtes la Mandragore et poussez un petit cri suraigu si une maison parle à voix haute (les élèves adorent). Prévoyez un chronomètre pour le relais mimé et une chaise pour les évanouissements théâtraux."}, "4": {"num": 4, "titre": "Le Jardin secret d'Helga", "lieu": "Le Jardin d'Helga", "heros": "capucine", "recit": "Pas de lettre aujourd'hui. Moka se pose sur l'épaule de Capucine et dépose dans sa main les deux feuilles d'or trouvées dans les serres : il les gardait au chaud dans son nid et les a astiquées toute la nuit. Capucine les place côte à côte… Elles s'emboîtent parfaitement, comme deux pièces de puzzle ! Sur la Carte du Maraudeur, un petit chemin apparaît, que personne n'avait jamais vu : il part de la Serre n°3, traverse un mur de lierre… et mène au Jardin d'Helga.\n\nLes quatre héros s'approchent. Le lierre est si épais que Léo n'arrive même pas à y passer le bras. Iris cherche un sort, Silas cherche une excuse pour ne pas se salir. Capucine, elle, pose simplement la main sur les feuilles et murmure : « Bonjour. On vient de la part d'Helga. » Le lierre frissonne… et s'écarte comme un rideau de théâtre.\n\nDerrière, un jardin secret, endormi depuis mille ans. Des citrouilles de toutes les couleurs, des rosiers qui fredonnent une berceuse, des abeilles grosses comme des bouchons qui bourdonnent en rythme. Au centre, un blaireau taillé dans le buis, haut comme Hagrid, monte la garde devant un coffre entièrement fait de racines entrelacées. Sur le couvercle, quatre gros nœuds de racines. Sur chaque nœud, une ligne de lettres incompréhensibles.\n\nLe blaireau de buis ouvre un œil (un œil en feuilles, mais un œil quand même) et parle d'une voix de vieux grand-père enrhumé :\n« Seule une équipe soudée peut ouvrir le coffre d'Helga. Chaque maison dénouera un nœud. Mais d'abord… répondez à ma devinette. »\n\nAu loin, derrière la haie, quelqu'un fredonne faux et se rapproche en ricanant. L'Ombre ! Vite, il faut ouvrir le coffre avant qu'elle n'arrive !", "message_ombre": "Trop tard ?! TROP TARD ?! Je trépigne, je fulmine, je bous !\nJ'en renverse mes encriers, j'en fais des nœuds à mes genoux !\nGardez votre Coupe, petits voleurs de trésors…\nL'Épée sera pour moi, foi de courant d'air qui ricane encore !", "epreuve": {"type": "code", "titre": "Le coffre de racines d'Helga", "consigne": "Ouvrez le coffre de racines d'Helga ! 1) Résolvez la devinette du blaireau de buis pour trouver la clé du code. 2) Chaque maison décode sa ligne. 3) Réunissez les quatre lignes… et faites exactement ce qu'elles disent !", "deroulement": "Maillon 1 — La devinette du blaireau (5 min) : le prof lit : « Nous étions quatre à bâtir ce château. Ne compte pas Helga : compte seulement ses amis Fondateurs. Ce nombre te dira de combien de rangs chaque lettre doit reculer dans l'alphabet. » Chaque maison écrit sa réponse sur l'ardoise (réponse : 3) ; 1 point par maison juste. Le prof écrit alors l'alphabet en grand au tableau et explique la clé avec un exemple (D se lit A, H se lit E).\n\nMaillon 2 — Les quatre nœuds (20 min) : chaque maison reçoit UNE ligne du message chiffré : ligne 1 pour Gryffondor, ligne 2 pour Poufsouffle, ligne 3 pour Serdaigle, ligne 4 pour Serpentard. Elle la décode sur son ardoise en reculant chaque lettre de 3 rangs. Règle d'Helga, la loyauté : une maison qui a fini peut envoyer deux « messagers » aider une autre maison (ils expliquent, mais n'écrivent pas à sa place). Chaque maison qui décode sa ligne sans erreur gagne 2 points ; chaque maison qui en aide une autre gagne 2 points de loyauté. L'indice peut être donné à la demande, mais pour une Réussite, la classe ne doit pas en utiliser plus d'un.\n\nMaillon 3 — Le cri de loyauté (5 min) : chaque maison lit sa ligne à voix haute, dans l'ordre 1-2-3-4. La classe découvre ce qu'il faut faire : le prof compte « 3, 2, 1… » et TOUTE la classe crie d'une seule voix « LOYAUTÉ ! ». Si le cri n'est pas parfaitement ensemble, le blaireau bâille et on recommence (3 essais maximum : au troisième, le blaireau cède toujours). Le coffre de racines s'ouvre : au fond, sur un lit de mousse, brille une petite coupe d'or à deux anses, gravée d'un blaireau. La Coupe de Poufsouffle apparaît sur la Carte du Maraudeur : checkpoint atteint !\n\nFinal (3 min) : derrière la haie, un hurlement de rage : l'Ombre arrive trop tard ! Le prof dévoile son message furieux.\n\nOnt brillé : les maisons qui ont décodé leur ligne sans erreur ET celles qui ont aidé les autres (ici, la loyauté rapporte autant que la vitesse).", "duree": 35, "questions": [], "paires": [], "ordre": [], "code": {"message": "VHXOV OHV DPLV ILGHOHV / RXYUHQW FH FRIIUH / FULHC WRXV HQVHPEOH / OH PRW ORBDXWH", "cle": "Décalage de César de 3 rangs (3 = le nombre d'amis Fondateurs d'Helga, réponse de la devinette du blaireau). Pour chiffrer, chaque lettre a été avancée de 3 rangs dans l'alphabet : A→D, B→E, C→F… W→Z, X→A, Y→B, Z→C. Pour décoder, on recule chaque lettre de 3 rangs : D→A, E→B, F→C, G→D, H→E, I→F… et au début de l'alphabet on repart de la fin : A→X, B→Y, C→Z. Les espaces et les barres « / » (qui séparent les quatre lignes) ne changent pas.", "reponse": "SEULS LES AMIS FIDELES / OUVRENT CE COFFRE / CRIEZ TOUS ENSEMBLE / LE MOT LOYAUTE"}, "indice": "Écrivez l'alphabet en entier sur l'ardoise et reculez de 3 cases : D devient A, E devient B, H devient E. Commencez par les mots les plus courts : la ligne 4 commence par un petit mot de 2 lettres que l'on écrit des centaines de fois par jour.", "reussite": "Réussite : les 4 lignes décodées sans erreur en 25 minutes maximum, avec au plus 1 indice, et un cri « LOYAUTÉ ! » bien synchronisé : la Coupe est à vous avec tous les honneurs du checkpoint. Partielle : message décodé, mais avec 2 indices ou plus, ou en plus de 25 minutes : la Coupe est à vous, mais l'Ombre a eu le temps de l'éclabousser d'encre (récompenses réduites). Échec : message pas décodé au bout de 30 minutes : le prof révèle la phrase, le blaireau de buis a pitié de vous et entrouvre le coffre ; la Coupe est attrapée de justesse sous le nez de l'Ombre, mais sans le bonus du checkpoint."}, "defi_maison": {"titre": "Ta carte de Chocogrenouille", "consigne": "Pour fêter la première relique, dessine la carte de Chocogrenouille d'Helga Poufsouffle ou de Capucine Boisjoli (au choix). Le professeur valide les cartes ; les plus réussies seront affichées dans la classe.", "contenu": "Format : une carte à jouer d'environ 6 cm × 9 cm.\nRecto : le portrait du personnage dans un cadre doré, avec son nom écrit en bas.\nVerso : trois lignes de biographie inventée et drôle (exemple : « Célèbre pour avoir rempoté 400 Mandragores sans jamais perdre un seul cache-oreille »), plus un détail secret que seuls les héros connaissent.", "mot_de_passe": ""}, "note_prof": "Préparez quatre bandelettes de papier portant chacune une ligne du message chiffré (une par maison) et écrivez l'alphabet en grand au tableau. Le cri collectif « LOYAUTÉ ! » est le moment fort du chapitre : recommencez-le jusqu'à ce qu'il soit parfaitement ensemble (3 essais maximum), puis révélez la Coupe sur la carte."}, "5": {"num": 5, "titre": "Le livre qui mord", "lieu": "La Cabane de Hagrid", "heros": "leo", "recit": "Janvier. La neige recouvre le parc du château, et une fumée en tire-bouchon s'échappe de la cheminée de la cabane de Hagrid. Moka se pose sur l'épaule de Léo, une lettre dans le bec : « La deuxième relique, l'Épée de Gryffondor, est cachée au cœur de la Forêt interdite. Pour y entrer, il vous faut un guide… et un bon livre. »\nLéo saute de joie : la forêt, les créatures, les crocs… c'est enfin son chapitre ! À peine a-t-il frappé que la porte s'ouvre sur Hagrid, un plateau de biscuits durs comme des galets à la main. Crockdur, son énorme chien, bondit aussitôt sur Silas pour lui débarbouiller la figure à grands coups de langue.\n— Beurk ! De la bave de molosse sur ma cape neuve !\n— Il t'aime bien, rigole Hagrid. Bon. Si vous voulez entrer dans la forêt, faut connaître ceux qui y vivent. Je vous prête mon Monstrueux Livre des Monstres. Il mord un peu, mais au fond, c'est un tendre.\nLe livre gronde, claque de la couverture et file se cacher sous le buffet. Léo plonge, le coince sous son bras et manque d'y laisser un doigt. Impossible de l'ouvrir ! Iris aperçoit une phrase griffonnée sur la tranche… noyée sous une énorme tache d'encre. Et par les côtés de la couverture dépassent des pages froissées dans tous les sens : quelqu'un les a arrachées et remises n'importe comment ! Crockdur, lui, en mâchouille déjà une avec un air ravi.\nMission : trouvez comment ouvrir ce livre sans y laisser vos doigts, puis rendez à chaque créature sa description. Sans ce livre, impossible de faire un pas de plus dans la forêt !", "message_ombre": "Hi hi ! J'ai mêlé les pages du livre qui mord,\nCrockdur en a mâché trois et il en réclame encore !\nPendant que vous cherchez qui a des plumes ou des crocs,\nJe file vers l'Épée en chantant à tue-tête là-haut !", "epreuve": {"type": "association", "titre": "Les pages arrachées du Monstrueux Livre", "consigne": "Le Monstrueux Livre des Monstres a perdu ses pages ! Retrouvez quelle description va avec quelle créature. Chaque maison écrit ses 8 associations sur son ardoise (exemple : 1-C, 2-F…). Astuce de Hagrid : lisez bien les noms, ils cachent souvent un indice !", "deroulement": "Manche 1 – Ouvrir le livre (3 min) : le livre refuse de s'ouvrir et claque des pages. Chaque maison écrit sur son ardoise COMMENT l'ouvrir sans se faire mordre. Indice de Hagrid (lu par le prof) : « C'est un livre, mais il a un dos… et il adore qu'on soit gentil avec lui. » Toutes les maisons qui écrivent qu'il faut lui caresser le dos (ou la tranche) gagnent 1 point. Manche 2 – Recoller les pages (14 min) : le jeu affiche les 8 créatures (numérotées) et les 8 descriptions (lettres). Chaque maison discute à voix basse et écrit ses 8 associations. Au bout de 7 minutes, le prof peut lire l'astuce de Hagrid sur les noms (l'indice). Au signal « Crockdur ! », toutes les ardoises se lèvent en même temps. Manche 3 – La correction des monstres (13 min) : pour chaque créature, le prof lit la bonne description avec la grosse voix de Hagrid, puis une maison mime la créature pendant 10 secondes, à tour de rôle (2 créatures par maison) : +1 point si la classe applaudit. Chaque paire juste rapporte 1 point (8 au maximum). Ont brillé : les 2 maisons qui ont le plus de points (toutes les maisons à égalité en cas d'ex aequo) ; leur héros gagne de l'expérience.", "duree": 30, "questions": [], "paires": [{"gauche": "Hippogriffe", "droite": "Avant d'aigle, arrière de cheval, et très, très fier : on le salue toujours avant de l'approcher."}, {"gauche": "Niffleur", "droite": "Petite boule de poils noirs au long museau : il renifle et chipe tout ce qui brille."}, {"gauche": "Botruc", "droite": "Minuscule gardien des arbres à baguettes, fait de brindilles et d'écorce, avec deux petits yeux marron. Il raffole des cloportes."}, {"gauche": "Veracrasse", "droite": "Gros ver mou et baveux qui mange de la laitue toute la journée. Champion du monde de l'ennui."}, {"gauche": "Boursouf", "droite": "Boule de poils couleur crème, gonflée comme un soufflé, qui fredonne quand on la câline… et qui chipe les crottes de nez des sorciers endormis avec sa longue langue !"}, {"gauche": "Sombral", "droite": "Cheval tout noir aux ailes de chauve-souris, si maigre qu'on devine ses os. Beaucoup d'élèves ne le voient même pas !"}, {"gauche": "Scroutt à pétard", "droite": "Bestiole bizarre inventée par Hagrid (ne lui dites pas qu'elle est ratée) : une carapace, pas de tête visible, et des étincelles qui jaillissent… par l'arrière."}, {"gauche": "Fléreur", "droite": "On dirait un chat aux grandes oreilles, mais il flaire à des kilomètres les gens louches et malhonnêtes."}], "ordre": [], "code": {"message": "", "cle": "", "reponse": ""}, "indice": "Chaque nom cache un indice : Sombral fait penser à « sombre », Fléreur à « flairer », Niffleur à « renifler », Veracrasse à « ver » et « crasse », Boursouf à « boursouflé », Scroutt à pétard à… un pétard ! Et « hippo » veut dire « cheval » en grec.", "reussite": "Réussite : au moins 3 maisons sur 4 ont 6 paires justes ou plus. Partielle : 1 ou 2 maisons ont 6 paires justes ou plus. Échec : aucune maison n'atteint 6 paires ; Hagrid recolle les pages lui-même en soupirant, et l'équipe avance quand même."}, "defi_maison": {"titre": "La page mâchouillée par Crockdur", "consigne": "Crockdur a bavé sur une page du livre : seuls des nombres sont encore lisibles. Chaque nombre correspond à une lettre de l'alphabet (A=1, B=2, C=3… Z=26). Décode le nom de la créature que l'équipe rencontrera à la prochaine étape, puis tape-le dans le jeu comme mot de passe.", "contenu": "8 – 9 – 16 – 16 – 15 – 7 – 18 – 9 – 6 – 6 – 5", "mot_de_passe": "HIPPOGRIFFE"}, "note_prof": "Si possible, apportez un vieux livre ficelé avec un élastique pour jouer le Monstrueux Livre (faites-le « claquer » sur le bureau). Préparez une feuille par maison avec les numéros 1 à 8, et prenez la grosse voix de Hagrid : effet garanti."}, "6": {"num": 6, "titre": "Le salut de Buck", "lieu": "L'Enclos des hippogriffes", "heros": "leo", "recit": "Le Monstrueux Livre des Monstres ronronne maintenant au fond du sac de Léo. Hagrid conduit l'équipe jusqu'à un enclos, tout au bord de la forêt. Au milieu de la neige se dresse Buck, un hippogriffe magnifique : d'immenses ailes grises, un bec crochu et des yeux orange vif qui ne ratent rien.\n— Buck connaît le chemin du sentier des licornes, explique Hagrid. S'il vous accepte, il vous y conduira. Mais attention : un hippogriffe, c'est plus fier qu'une douzaine de rois. On ne l'approche pas n'importe comment.\nLéo n'a écouté que la moitié de la phrase. Il court déjà vers Buck, les bras grands ouverts :\n— Salut, mon grand !\nBuck se cabre, déploie ses ailes et pousse un cri qui fait dégringoler la neige des sapins. Léo recule… et atterrit sur les fesses dans une flaque de boue gelée. Silas applaudit poliment :\n— Magnifique. Du pur Gryffondor.\n— Je l'avais pourtant affiché, le Protocole du salut ! grogne Hagrid en montrant la pancarte de l'entrée.\nMais la pancarte est couverte d'encre, et quelqu'un l'a découpée en lamelles que le vent fait tourbillonner au-dessus de l'enclos. Capucine en rattrape huit au vol. Iris fronce les sourcils : elles sont dans le désordre, évidemment.\nMission : remettez le Protocole du salut dans l'ordre, puis prouvez à Buck que vous savez saluer comme de vrais sorciers. S'il s'incline devant vous, il vous ouvrira le chemin de la forêt !", "message_ombre": "Courbez l'échine, petits sorciers tremblants !\nMoi, j'ai vidé mon encrier sur votre règlement.\nSi la bête à plumes vous picore une oreille,\nJe ferai des loopings de joie jusqu'au soleil !", "epreuve": {"type": "ordre", "titre": "Le Protocole du salut", "consigne": "Le vent a mélangé les 8 lamelles du Protocole du salut. Remettez-les dans le bon ordre, de l'entrée dans l'enclos jusqu'au remerciement final. Chaque maison écrit sur son ardoise l'ordre des lettres (exemple : C-A-H-…). Ensuite, place à la pratique devant Buck !", "deroulement": "Manche 1 – Le protocole (10 min) : le jeu affiche les 8 lamelles mélangées. Chaque maison écrit l'ordre sur son ardoise ; au signal « Buck ! », toutes les ardoises se lèvent. 1 point par lamelle à la bonne place (8 au maximum). Manche 2 – Le duel du regard (8 min) : chaque maison envoie un champion. Les 4 champions se placent face au prof, qui joue Buck avec son regard le plus perçant. Tout le monde s'incline en même temps en gardant les yeux grands ouverts : le premier qui cligne retourne s'asseoir. Les autres élèves ont le droit de faire des grimaces… en silence et sans quitter leur place ! Le dernier champion debout rapporte 3 points à sa maison, le deuxième 2, le troisième 1. Une manche dure 1 minute au maximum : au bout d'1 minute, c'est Buck qui cligne le premier, et tous les champions encore debout gagnent 3 points. S'il reste du temps, on refait une manche avec de nouveaux champions. Manche 3 – Le grand salut (12 min) : chaque maison, au complet, vient devant le tableau et applique le protocole : approche lente, regard fixe, révérence synchronisée, immobilité. Buck (le prof) juge : salut parfait → il s'incline à son tour (+3 points) ; un rire, un geste brusque ou un regard qui se détourne → « Kriii ! » vexé, salut raté (0 point). Ont brillé : les 2 maisons qui totalisent le plus de points sur les 3 manches ; leur héros gagne de l'expérience.", "duree": 30, "questions": [], "paires": [], "ordre": ["Attendre que Hagrid donne le feu vert avant d'entrer dans l'enclos.", "S'approcher lentement, sans courir ni crier.", "S'arrêter à quelques pas et regarder l'hippogriffe droit dans les yeux.", "S'incliner bien bas, toujours sans cligner des yeux.", "Rester incliné, immobile, et attendre sa réponse.", "S'il s'incline à son tour, avancer doucement et lui caresser le bec.", "Grimper sur son dos, juste derrière les ailes, sans arracher une seule plume.", "Après l'atterrissage, descendre et le remercier d'une dernière révérence."], "code": {"message": "", "cle": "", "reponse": ""}, "indice": "Pensez aux règles de politesse : on n'entre pas chez quelqu'un sans y être invité, on dit bonjour avant de serrer la main, et on dit merci à la fin. Et surtout : un hippogriffe déteste qu'on cligne des yeux !", "reussite": "Réussite : au moins 2 maisons ont 8/8 au protocole ET au moins 3 grands saluts sont réussis → Buck s'incline devant toute l'équipe. Partielle : au moins 2 maisons ont 6/8 ou plus, OU au moins 2 grands saluts sont réussis → Buck accepte de guider l'équipe, mais en boudant un peu. Échec : moins que ça → Buck guide quand même l'équipe… en lui tournant le dos tout le long du chemin."}, "defi_maison": {"titre": "Ma créature hybride", "consigne": "L'hippogriffe, c'est moitié aigle, moitié cheval. À toi d'inventer ta propre créature magique en mélangeant deux animaux ! Dessine-la, donne-lui un nom rigolo (par exemple un « Crapautruche » ou un « Lapingouin ») et écris 3 lignes : où elle vit, ce qu'elle mange, et comment il faut la saluer pour ne pas se faire mordre.", "contenu": "Une feuille, un dessin en couleur, 3 lignes de texte. Les créatures validées par le professeur rejoindront le Bestiaire de l'équipe affiché en classe, et chaque création rapporte des points à sa maison.", "mot_de_passe": ""}, "note_prof": "Pour la manche 3, délimitez un « enclos » devant le tableau avec quatre chaises. Jouez Buck à fond (regard perçant, petit cri vexé) et rappelez que le duel du regard se fait sans aucun contact. Gardez un chronomètre visible pour la minute du duel."}, "7": {"num": 7, "titre": "Les traces dans la neige", "lieu": "Le Sentier des licornes", "heros": "leo", "recit": "Buck a conduit l'équipe jusqu'à l'entrée du sentier des licornes, puis il est reparti vers son enclos en secouant fièrement ses plumes. Ici, les arbres sont si serrés que la lumière passe à peine. Iris lève sa baguette : « Lumos ! » Une petite lumière blanche éclaire la neige… couverte d'empreintes dans tous les sens.\nHagrid leur a confié son vieux carnet de traces, plein de taches de thé et de miettes de biscuits. « Avec ça, vous saurez qui est passé avant vous », a-t-il promis.\nEt quelqu'un est bel et bien passé avant eux. Les panneaux du sentier ont été arrachés et replantés n'importe comment. Dans les branches, on entend un ricanement aigu, puis un petit air chantonné, puis plus rien. Silas frissonne… surtout parce qu'il vient de marcher dans une flaque de boue.\n— Par là ! s'écrie Léo en s'élançant derrière la première trace venue.\nCapucine l'attrape par la manche :\n— Dans une forêt, d'abord on lit les traces. Ensuite on fonce.\nPour une fois, Léo s'arrête. Il ouvre le carnet de Hagrid, croque une Chocogrenouille pour se donner du courage, et se penche sur la neige comme un vrai pisteur.\nTout au bout du sentier se dresse un vieil arbre tordu. Ses branches s'agitent toutes seules… et une toute petite voix grince là-haut, comme un appel au secours.\nMission : déchiffrez les traces grâce au carnet de Hagrid, retrouvez le chemin des licornes et découvrez qui se cache dans l'arbre tordu.", "message_ombre": "Des traces par-ci, des traces par-là,\nJ'ai fait valser vos panneaux, cherchez-les donc, ha ha !\nPas un seul ne dit vrai : ce sont tous des farceurs…\nTiens, ça me rappelle quelqu'un… Quel honneur !", "epreuve": {"type": "enigmes", "titre": "Le carnet de traces de Hagrid", "consigne": "Résolvez les 6 énigmes de la forêt grâce au carnet de traces de Hagrid. Chaque maison écrit sa réponse sur son ardoise.\nCARNET DE TRACES DE HAGRID\n– Licorne : sabots légers, crins accrochés aux branches. Les poulains naissent dorés, deviennent argentés vers 2 ans, puis tout blancs vers 7 ans.\n– Hippogriffe : serres d'aigle à l'avant, sabots de cheval à l'arrière, plumes grises.\n– Centaure : gros sabots, branches cassées très haut (il est grand !).\n– Niffleur : petites pattes griffues, trous creusés partout, objets brillants disparus.\n– Scroutt à pétard : longue traînée sur le sol, petites brûlures, odeur de pétard.\n– Botruc : aucune trace au sol ; vit dans les arbres à baguettes, raffole des cloportes.", "deroulement": "Les 6 énigmes s'affichent une par une, et le carnet de traces reste visible au tableau pendant toute l'épreuve. Temps de réflexion par maison (chuchotements autorisés) : 2 minutes pour les énigmes 1, 2 et 6, 4 minutes pour les énigmes de logique 3, 4 et 5. Au signal « Lumos ! », les 4 ardoises se lèvent en même temps, puis le prof lit l'explication. Chaque bonne réponse rapporte 2 points. Pour les énigmes de logique (3, 4 et 5), une maison tirée au sort parmi celles qui ont juste explique son raisonnement à voix haute : explication claire = +1 point bonus. Léo, le pisteur de l'équipe, permet une seule fois dans la séance de demander au prof un indice pour toute la classe. Ont brillé : les 2 maisons qui ont le plus de points ; leur héros gagne de l'expérience. Clôture : la dernière réponse révèle Brindille le Botruc, collé à sa branche par une boule de chewing-gum. Léo le décolle avec une délicatesse incroyable (oui, Léo !) et Brindille, reconnaissant, grimpe sur son épaule : il rejoint l'équipe !", "duree": 30, "questions": [{"q": "Énigme 1 – Dans la neige, à l'entrée du sentier : à l'avant, des empreintes à quatre doigts pointus, comme celles d'un oiseau géant ; à l'arrière, des sabots. Une grande plume grise est restée accrochée à une ronce. Quelle créature est passée ?", "choix": [], "reponse": "Un hippogriffe", "explication": "Serres d'aigle devant, sabots derrière, plume grise : c'est un hippogriffe. Sûrement un cousin de Buck !"}, {"q": "Énigme 2 – Au pied d'un vieux chêne : trois trous fraîchement creusés et de toutes petites empreintes griffues. Léo baisse les yeux… la boucle dorée de sa ceinture a disparu, et son pantalon commence à glisser ! Quelle créature est passée ?", "choix": [], "reponse": "Un Niffleur", "explication": "Des trous partout et un objet brillant envolé : c'est la signature du Niffleur, le pickpocket le plus mignon de la forêt. Retenez-le, on risque de le recroiser…"}, {"q": "Énigme 3 – Au carrefour, trois chemins partent : à gauche, tout droit et à droite. Ils mènent aux licornes, aux centaures et au lac… mais l'Ombre a échangé les panneaux : AUCUN n'indique la bonne direction ! Le panneau de gauche dit « Licornes », celui du milieu dit « Centaures », celui de droite dit « Lac ». Et sur le chemin de gauche, Léo remarque des branches cassées très haut (regardez le carnet de Hagrid !). Où sont les licornes ?", "choix": [], "reponse": "À droite", "explication": "Les branches cassées très haut, c'est la signature des centaures (carnet de Hagrid) : le chemin de gauche mène donc aux centaures. Le panneau de droite dit « Lac » et il ment : la droite n'est donc pas le lac… il ne reste que les licornes ! Et tout droit, c'est le lac : le panneau « Centaures » mentait bien, lui aussi."}, {"q": "Énigme 4 – Sur le sentier, trois séries de traces se chevauchent : celles d'une licorne, d'un centaure et d'un Scroutt à pétard. Les traces du Scroutt écrasent celles de la licorne. Les traces du centaure sont recouvertes par toutes les autres. Qui est passé en DERNIER ?", "choix": [], "reponse": "Le Scroutt à pétard", "explication": "Une trace qui en recouvre une autre a été faite après elle. Le centaure est passé en premier (tout le monde lui a marché dessus), puis la licorne, puis le Scroutt, qui a laissé derrière lui une délicieuse odeur de pétard brûlé."}, {"q": "Énigme 5 – Au bord du ruisseau, trois licornes boivent : Perle, Comète et Nuage. Elles ont chacune une couleur différente. Perle est plus âgée que Comète. Nuage n'est ni la plus jeune ni la plus âgée. Comète est encore toute dorée. De quelle couleur est Perle ?", "choix": [], "reponse": "Blanche", "explication": "Nuage est au milieu. Comme Perle est plus âgée que Comète, Perle est la plus âgée et Comète la plus jeune (dorée). Nuage est donc argentée, et Perle, la plus vieille, est blanche."}, {"q": "Énigme 6 – Les traces s'arrêtent net au pied de l'arbre tordu, un arbre à baguettes. Aucune empreinte au sol. Sur une souche, tous les cloportes ont disparu. Et là-haut, une petite brindille avec deux yeux marron vous fait de grands signes : elle est coincée dans une boule de chewing-gum ! Qui est-ce ?", "choix": [], "reponse": "Un Botruc", "explication": "Pas de trace au sol, un arbre à baguettes et des cloportes dévorés : c'est un Botruc ! Il s'appelle Brindille… et quelqu'un de très farceur l'a collé à sa branche avec du chewing-gum."}], "paires": [], "ordre": [], "code": {"message": "", "cle": "", "reponse": ""}, "indice": "Pour les énigmes de logique, testez chaque possibilité une par une en vous demandant : « Et si c'était ça, est-ce que tout marche ? » Et rappelez-vous : une trace qui en écrase une autre a été faite APRÈS elle.", "reussite": "Une énigme compte pour l'équipe si au moins 2 maisons ont trouvé la bonne réponse. Réussite : 5 ou 6 énigmes. Partielle : 3 ou 4 énigmes. Échec : 0 à 2 énigmes ; Brindille rejoint quand même l'équipe, trop content d'être débarrassé de son chewing-gum."}, "defi_maison": {"titre": "La feuille de Brindille", "consigne": "Brindille ne parle pas comme nous, mais il a gravé un message sur une feuille avec la pointe de son bras-brindille. Pour que l'Ombre ne puisse pas le lire, il a glissé une lettre-piège après chaque vraie lettre. Lis seulement une lettre sur deux, en commençant par la première (1re, 3e, 5e…) : tu sauras qui l'équipe rencontrera à la prochaine étape. Tape ce mot dans le jeu comme mot de passe.", "contenu": "Message de Brindille : C C E L N O T P A O U R R T E E\n\nAttention : si tu lis les autres lettres, tu tomberas sur le plat préféré de Brindille… qui pense un peu trop à son goûter !", "mot_de_passe": "CENTAURE"}, "note_prof": "Recopiez ou projetez le carnet de traces pendant toute l'épreuve. Bonus d'ambiance : dessinez à la craie quelques empreintes (sabots, serres) devant la porte de la salle avant l'arrivée des élèves."}, "8": {"num": 8, "titre": "L'Épée sous la glace", "lieu": "La Clairière des centaures", "heros": "leo", "recit": "La nuit tombe sur la Forêt interdite. Perché sur l'épaule de Léo, Brindille tend un bras-brindille vers une clairière baignée de lune. Au centre, une mare gelée brille comme un miroir. Et tout autour, d'immenses silhouettes : des centaures, la tête levée vers le ciel, qui observent les étoiles sans un mot.\nFirenze, au pelage doré et aux cheveux presque blancs, s'avance. Derrière lui, Bane, le centaure au pelage noir, croise les bras et souffle par les naseaux.\n— Des petits humains dans notre clairière, grogne Bane. Les étoiles ne nous avaient pas annoncé une invasion de bavards.\n— Les étoiles annoncent bien des choses, répond Firenze, très calme. Ce soir, elles disent qu'une épée dort sous cette glace. Et qu'elle n'apparaîtra qu'à ceux qui ont un vrai courage.\nLéo bombe le torse :\n— Du courage ? J'en ai à revendre !\nIl pose un pied sur la mare… qui craque de partout. Iris le rattrape par la capuche juste à temps.\n— Le vrai courage, ce n'est pas foncer tête baissée, dit Firenze. Regardez plutôt cette pierre.\nAu bord de la mare, une grosse pierre plate porte une inscription gravée… qui ne veut absolument rien dire. Firenze lève les yeux vers le ciel :\n— Ce message est écrit dans la langue du ciel. Lisez d'abord les étoiles : elles vous donneront la clé.\nSoudain, une boule de neige s'écrase sur la nuque de Silas. Un ricanement file entre les arbres. L'Ombre est là, toute proche… et elle aussi veut l'Épée !\nMission : résolvez les quatre énigmes des étoiles, trouvez la clé, déchiffrez la pierre… et prouvez que l'équipe a du courage. C'est l'heure de vérité pour Léo !", "message_ombr
