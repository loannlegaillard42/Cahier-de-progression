<div id="app">
  <canvas id="scene" aria-label="Carte 3D du domaine de Poudlard"></canvas>
  <div id="carte2d" hidden></div>

  <div id="hud" hidden>
    <header class="hud hud-haut">
      <div class="bloc-titre verre">
        <span class="classe-chip" id="hud-classe">6e A</span>
        <div><p class="h-chap" id="hud-chapitre">Chapitre 1 · Les Serres</p><p class="h-sous" id="hud-sous">Étape 1 sur 16</p></div>
      </div>
      <div class="piste verre" id="hud-piste" aria-label="Progression"></div>
      <div class="droite-haut">
        <button class="btn-rond" id="btn-accueil" aria-label="Changer de classe" title="Changer de classe"><svg class="ico"><use href="#i-maison"/></svg></button>
        <button class="btn-rond" id="btn-menu" aria-label="Menu" title="Menu"><svg class="ico"><use href="#i-menu"/></svg><span class="pastille" id="pastille-menu" hidden></span></button>
      </div>
    </header>
    <div class="hud hud-bas">
      <div class="equipe verre" id="hud-heros" aria-label="L'équipe"></div>
      <div class="centre-bas">
        <button class="pilule" id="btn-defi-attente" hidden><svg class="ico"><use href="#i-coffre"/></svg><span>Défi maison : ouvrir le coffre</span></button>
        <button class="btn-etape" id="btn-etape"><span class="num" id="be-num">1</span><span><span class="t1" id="be-t1">Prochaine étape</span><span class="t2" id="be-t2">Le Parc du château</span></span></button>
      </div>
      <div class="sabliers verre" id="hud-sabliers" aria-label="Points des maisons"></div>
    </div>
  </div>

  <div id="cinema" hidden>
    <div class="bande haut"></div><div class="bande bas"></div>
    <p id="cinema-texte" aria-live="polite"></p>
    <button id="btn-passer">Passer la scène ▸</button>
  </div>

  <div id="infobulle" hidden></div>
  <div class="toast-zone" id="toasts" aria-live="polite"></div>
  <div id="fenetres"></div>
  <div class="etincelles" id="etincelles"></div>

  <div id="accueil">
    <div class="accueil-contenu">
      <p class="surtitre">Domaine de Poudlard</p>
      <h1>Les Reliques des Fondateurs</h1>
      <p class="accroche">Quelle classe joue aujourd'hui ?</p>
      <div class="classes" id="liste-classes"></div>
      <div class="accueil-pied">
        <button class="lien" id="btn-ajouter-classe"><svg class="ico"><use href="#i-plus"/></svg>Ajouter une classe</button>
        <button class="lien" id="btn-aide-accueil"><svg class="ico"><use href="#i-aide"/></svg>Comment jouer</button>
        <span class="sync" id="hud-sync"><i></i><span>Sauvegarde sur cet appareil</span></span>
      </div>
    </div>
  </div>
</div>
