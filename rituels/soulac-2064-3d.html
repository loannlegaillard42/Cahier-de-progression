<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Soulac 2064 en 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Jeu de rôle sur une maquette 3D : maire de Soulac-sur-Mer de 1964 à 2064, faut-il défendre le littoral ou reculer face à la mer ? (2de, géographie, thème 1, chapitre 3)" />
<meta name="theme-color" content="#1F4E5F" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,700;1,400&display=swap" />
<style>
  /* Même charte que « Vézelay, 31 mars 1146 » : bleu canard, vermillon, crème, Arimo.
     Mise en page : la maquette 3D occupe l'écran, les jauges dessous, l'étape en cours à droite,
     la frise 1964 → 2064 en bas. Sur téléphone, tout s'empile. */
  :root {
    --ground: #FBFAF6; --surface: #FFFEFB; --ink: #22313A; --muted: #4F5E66; --caption: #5E6A72;
    --teal: #1F4E5F; --teal-ink: #FBF7EF; --teal-soft: #E6EEF0;
    --vermilion: #C0492B; --on-vermilion: #FBF7EF; --cream: #FBF4E9; --cream-line: #E8DCC6;
    --line: #E3DCCD; --dot: #D6CDBA; --shadow: 0 2px 12px rgb(31 78 95 / .14);
    --ok: #2F7A45; --ok-soft: #E5F1E7; --ko: #B03A2A; --ko-soft: #F8E6E2; --gold-soft: #FBF1DC;
    --bar: #1F4E5F; --bar-ink: #FBF7EF;
    /* Scène : le littoral médocain. La coupe, le plan et les cartes sont des illustrations :
       leurs couleurs restent les mêmes en mode sombre, comme une image. */
    --ciel-haut: #C9DFEA; --ciel-bas: #EEF4F1; --orage-haut: #56646C; --orage-bas: #8D989C;
    --mer: #2E7DA0; --mer-fond: #1D5A77; --ecume: #EAF5F8;
    --sable: #E6D09C; --sable-mouille: #CDB37C; --sable-apport: #F4E5BD; --dune: #D9C089; --oyat: #6E8D45;
    --terre: #ECE4CC; --pin: #3D6844; --tronc: #7A5B3E; --roche: #77746D; --roche-clair: #9A968D; --beton: #A7A59E;
    --route: #4B5154; --immeuble: #F1EBDF; --trait: #5F574B; --vitre: #8FBBD0; --vitre-vide: #3A3E41;
    --ville: #D6C9AE; --foret: #CFE0C4; --zone: #C0492B;
    --sc-ink: #22313A; --sc-muted: #4F5E66; --sc-surface: #FFFEFB; --sc-on-zone: #FBF7EF; --sc-titre: #1F4E5F;
    --font: 'Arimo', Arial, 'Helvetica Neue', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0F242B; --surface: #15313A; --ink: #EDF3F4; --muted: #AFC3C8; --caption: #9DB2B8;
      --teal: #8CC4D4; --teal-ink: #0F242B; --teal-soft: #1C3B45;
      --vermilion: #F08D72; --on-vermilion: #0F242B; --cream: #1C3B45; --cream-line: #2E5360;
      --line: #2B4C57; --dot: #3C5F6B; --shadow: 0 2px 12px rgb(0 0 0 / .4);
      --ok: #7CC98F; --ok-soft: #1B3A2A; --ko: #F08D72; --ko-soft: #3A2320; --gold-soft: #2C3A33;
      --bar: #123640; --bar-ink: #EDF3F4;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0F242B; --surface: #15313A; --ink: #EDF3F4; --muted: #AFC3C8; --caption: #9DB2B8;
    --teal: #8CC4D4; --teal-ink: #0F242B; --teal-soft: #1C3B45;
    --vermilion: #F08D72; --on-vermilion: #0F242B; --cream: #1C3B45; --cream-line: #2E5360;
    --line: #2B4C57; --dot: #3C5F6B; --shadow: 0 2px 12px rgb(0 0 0 / .4);
    --ok: #7CC98F; --ok-soft: #1B3A2A; --ko: #F08D72; --ko-soft: #3A2320; --gold-soft: #2C3A33;
    --bar: #123640; --bar-ink: #EDF3F4;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--vermilion); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }

  /* ---------- Bandeau ---------- */
  .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 18px; background: var(--bar); color: var(--bar-ink); padding-block: 9px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .eyebrow { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
  .bar h1 { margin: 2px 0 0; font-size: clamp(19px, 1.6vw, 26px); line-height: 1.15; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; text-wrap: balance; }
  .bar h1 small { font-size: .64em; font-weight: 400; font-style: italic; opacity: .92; }
  .outils { display: flex; flex-wrap: wrap; gap: 8px; }
  .tbtn { font-size: 14px; font-weight: 700; min-height: 36px; padding: 6px 14px; border-radius: 8px; border: 1.5px solid currentColor; background: transparent; color: var(--bar-ink); }
  .tbtn:hover { background: rgb(255 255 255 / .12); }
  a.tbtn { display: inline-flex; align-items: center; text-decoration: none; }
  .tbtn .compte { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 99px; background: rgb(255 255 255 / .2); font-size: 12px; font-variant-numeric: tabular-nums; }

  /* ---------- Plateau : maquette 3D, jauges, étape ---------- */
  .stage { min-height: 0; display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr) minmax(340px, 420px); grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "vue panneau" "jauges panneau"; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .carte { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); min-width: 0; }
  .vtitre { margin: 0; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  .vue { grid-area: vue; position: relative; overflow: hidden; min-height: 320px; background: #CFE2EC; }
  .vue3d { position: absolute; inset: 0; }
  .vue3d canvas { display: block; touch-action: none; cursor: grab; outline: none; }
  .vue3d canvas:active { cursor: grabbing; }
  .vue3d canvas:focus-visible { box-shadow: inset 0 0 0 3px var(--vermilion); }
  .etiquettes { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .etq { position: absolute; left: 0; top: 0; padding: 3px 9px; border-radius: 99px; background: rgb(255 254 251 / .92); color: #22313A; font-size: 12px; font-weight: 700; line-height: 1.35; white-space: nowrap; box-shadow: 0 1px 4px rgb(0 0 0 / .2); will-change: transform; }
  .etq.mer { background: none; box-shadow: none; color: #F4FAFC; letter-spacing: .12em; text-transform: uppercase; text-shadow: 0 1px 3px rgb(0 0 0 / .45); }
  .etq.rouge { background: #C0492B; color: #FBF7EF; }
  .etq.mesure { background: #22313A; color: #FBF7EF; font-size: 13px; }
  .vue-tete { position: absolute; top: 10px; left: 14px; pointer-events: none; }
  .annee { margin: 0; font-size: clamp(28px, 3.4vw, 46px); font-weight: 700; line-height: 1; color: #FBF7EF; font-variant-numeric: tabular-nums; text-shadow: 0 2px 10px rgb(15 36 43 / .6); }
  .vue-boutons { position: absolute; top: 10px; right: 10px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; max-width: calc(100% - 130px); }
  .vbtn { font-size: 13px; font-weight: 700; min-height: 34px; padding: 6px 12px; border-radius: 9px; border: 0; background: rgb(15 36 43 / .82); color: #FBF7EF; box-shadow: 0 2px 8px rgb(0 0 0 / .2); }
  .vbtn:hover { background: rgb(15 36 43 / .95); }
  .vbtn[aria-pressed="true"] { background: #C0492B; }
  .vue-bas { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; pointer-events: none; }
  .boussole { flex: none; width: 36px; height: 36px; border-radius: 50%; background: rgb(15 36 43 / .82); color: #FBF7EF; display: grid; place-items: center; font-size: 11px; font-weight: 700; position: relative; }
  .boussole::before { content: ""; position: absolute; top: 3px; left: 50%; margin-left: -5px; border: 5px solid transparent; border-bottom: 8px solid #F08D72; border-top: 0; }
  .boussole b { margin-top: 8px; }
  .pastille-vue { padding: 5px 10px; border-radius: 99px; background: rgb(15 36 43 / .74); color: #FBF7EF; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
  .pastille-vue i { display: inline-block; width: 18px; border-top: 2.5px dashed #FFFFFF; }
  .pastille-vue i.rouge { border-top-color: #F08D72; }
  .chargement, .secours { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; }
  .chargement { background: radial-gradient(ellipse at 50% 85%, #2F6B7D 0%, #16333D 75%); color: #FBF7EF; }
  .chargement p { margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #E3B67A; }
  .chargement b { font-size: clamp(20px, 2.2vw, 30px); }
  .secours { background: var(--ground); }
  .secours-carte { max-width: 460px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .secours-carte p { margin: 0; color: var(--muted); }
  .secours-carte .btn { text-decoration: none; }

  .jauges { grid-area: jauges; padding: 10px 14px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px 18px; align-items: start; }
  .jauges > .vtitre { display: none; }
  .jauge { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; grid-template-areas: "ico nom delta" "ico barre barre"; column-gap: 7px; row-gap: 4px; align-items: center; }
  .j-ico { grid-area: ico; width: 24px; height: 24px; color: var(--teal); }
  .j-nom { grid-area: nom; font-size: 12.5px; font-weight: 700; line-height: 1.2; }
  .j-delta { grid-area: delta; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; padding: 1px 6px; border-radius: 99px; }
  .j-delta.plus { color: var(--ok); background: var(--ok-soft); }
  .j-delta.moins { color: var(--ko); background: var(--ko-soft); }
  .j-barre { grid-area: barre; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 2px; }
  .j-barre i { height: 8px; border-radius: 2px; background: var(--line); }
  .j-barre i.on { background: var(--teal); }
  .jauge.bas .j-barre i.on { background: var(--vermilion); }
  .jauge.bas .j-ico { color: var(--vermilion); }
  .jauge.expo { grid-template-areas: "ico nom delta" "ico chiffre chiffre"; }
  .j-chiffre { grid-area: chiffre; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; font-size: 11.5px; color: var(--caption); line-height: 1.2; }
  .j-chiffre b { font-size: 19px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
  .jauge.expo.bas .j-chiffre b { color: var(--vermilion); }

  /* ---------- Panneau de l'étape ---------- */
  .panneau { grid-area: panneau; min-height: 0; overflow: auto; display: flex; flex-direction: column; }
  .p-corps { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 14px; }
  .p-tag { margin: 0; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--vermilion); }
  .p-tag .rappel { padding: 2px 8px; border-radius: 99px; background: var(--gold-soft); color: var(--ink); letter-spacing: .04em; }
  .panneau h2 { margin: 0; font-size: 22px; line-height: 1.2; color: var(--teal); text-wrap: balance; }
  .situation { display: flex; flex-direction: column; gap: 8px; font-size: 15.5px; line-height: 1.5; }
  .situation p { margin: 0; }
  .chez { margin: 0; display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-radius: 10px; background: var(--teal-soft); font-size: 14.5px; }
  .chez svg { flex: none; width: 20px; height: 20px; color: var(--teal); margin-top: 1px; }
  .chez b { color: var(--teal); }
  .mot { border: 0; background: none; padding: 0 1px; font: inherit; font-weight: 700; color: var(--teal); text-decoration: underline dotted 2px; text-underline-offset: 3px; cursor: help; }
  .mot:hover { background: var(--teal-soft); border-radius: 4px; }

  .equation { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-weight: 700; }
  .equation .terme { display: flex; flex-direction: column; padding: 6px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); line-height: 1.2; }
  .equation .terme small { font-weight: 400; font-size: 12px; color: var(--caption); }
  .equation .terme.risque { border-color: var(--vermilion); color: var(--vermilion); }
  .equation .op { color: var(--caption); font-size: 18px; }

  .docs { display: grid; gap: 10px; }
  .doc { margin: 0; padding: 10px 12px 12px; border-radius: 12px; background: var(--cream); border: 1.5px solid var(--cream-line); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .doc-type { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--vermilion); }
  .doc h3 { margin: 0; font-size: 15px; color: var(--ink); }
  .doc blockquote { margin: 0; padding: 2px 0 2px 12px; border-left: 4px solid var(--vermilion); font-style: italic; font-size: 14.5px; line-height: 1.5; }
  .doc blockquote p { margin: 0; }
  .doc-visuel svg { display: block; width: 100%; height: auto; }
  .doc figcaption { font-size: 12.5px; color: var(--caption); line-height: 1.45; display: flex; flex-direction: column; gap: 3px; }
  .doc figcaption .leg { color: var(--ink); font-size: 13.5px; }
  .doc a { color: var(--teal); font-weight: 700; }
  .photo-cadre { position: relative; border-radius: 8px; overflow: hidden; background: var(--ciel-bas); }
  .photo-cadre img { display: block; width: 100%; height: auto; }
  .photo-cadre .croquis-tag { position: absolute; left: 8px; top: 8px; padding: 2px 8px; border-radius: 99px; background: var(--surface); color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }

  .choix { display: grid; gap: 8px; }
  .choix-titre { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .opt { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 2px 10px; align-items: center; text-align: left; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--teal); background: var(--surface); color: var(--ink); min-height: 56px; }
  .opt:hover:not(:disabled) { background: var(--teal-soft); }
  .opt svg { grid-row: 1 / span 2; width: 34px; height: 34px; color: var(--teal); }
  .opt b { font-size: 15px; line-height: 1.25; }
  .opt small { font-size: 12.5px; color: var(--caption); line-height: 1.3; }
  .opt:disabled { cursor: default; opacity: .45; border-color: var(--line); }
  .opt.choisi, .opt.choisi:disabled { opacity: 1; border-color: var(--vermilion); background: var(--cream); }
  .opt.choisi svg { color: var(--vermilion); }

  .consequence { padding: 12px 14px; border-radius: 12px; border: 2px solid var(--vermilion); background: var(--surface); display: flex; flex-direction: column; gap: 8px; animation: monte .3s ease; }
  .consequence .q-tag { margin: 0; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--vermilion); }
  .consequence p { margin: 0; font-size: 15px; line-height: 1.5; }
  .bilan-deltas { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .bilan-deltas li { font-size: 12.5px; font-weight: 700; padding: 2px 9px; border-radius: 99px; }
  .bilan-deltas li.plus { color: var(--ok); background: var(--ok-soft); }
  .bilan-deltas li.moins { color: var(--ko); background: var(--ko-soft); }
  .fiche-note { margin: 0; display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; color: var(--muted); padding-top: 8px; border-top: 1px dashed var(--line); }
  .fiche-note svg { flex: none; width: 18px; height: 18px; color: var(--vermilion); margin-top: 1px; }
  @keyframes monte { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 18px; border-radius: 10px; border: 2px solid var(--teal); background: var(--teal); color: var(--teal-ink); font-weight: 700; font-size: 15.5px; }
  .btn:hover { filter: brightness(1.08); }
  .btn.or { background: var(--vermilion); border-color: var(--vermilion); color: var(--on-vermilion); }
  .btn.second { background: transparent; color: var(--teal); }
  .btn.grand { width: 100%; }

  /* ---------- Frise ---------- */
  .frise { background: var(--surface); border-top: 1px solid var(--line); padding-block: 4px calc(6px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .frise-piste { position: relative; height: 50px; margin-inline: 12px; }
  .f-axe { position: absolute; left: 0; right: 0; top: 28px; height: 4px; border-radius: 2px; background: var(--dot); }
  .f-futur { position: absolute; right: 0; top: 28px; height: 4px; background: repeating-linear-gradient(90deg, var(--surface) 0 5px, transparent 5px 9px); }
  .f-bande { position: absolute; top: 27px; height: 6px; border-radius: 3px; background: var(--caption); }
  .f-bande.fait { background: var(--teal); }
  .f-bande.cours { top: 25px; height: 10px; border-radius: 5px; background: var(--vermilion); }
  .f-pt { position: absolute; top: 0; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%; border: 2px solid var(--dot); background: var(--surface); color: var(--muted); font-size: 11.5px; font-weight: 700; line-height: 18px; text-align: center; font-variant-numeric: tabular-nums; }
  .f-pt.fait { border-color: var(--teal); color: var(--teal); }
  .f-pt.cours { background: var(--vermilion); border-color: var(--vermilion); color: var(--on-vermilion); }
  .f-tick { position: absolute; top: 36px; transform: translateX(-50%); font-size: 11px; color: var(--caption); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .f-tick.auj { color: var(--vermilion); font-weight: 700; }
  .f-tick:first-of-type { transform: none; }

  /* ---------- Bulle de notion ---------- */
  .pop { position: fixed; z-index: 40; width: min(330px, calc(100vw - 32px)); padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 2px solid var(--teal); box-shadow: 0 10px 30px rgb(0 0 0 / .22); display: flex; flex-direction: column; gap: 6px; }
  .pop-mot { margin: 0; font-weight: 700; font-size: 16px; color: var(--teal); }
  .pop p { margin: 0; font-size: 14.5px; line-height: 1.5; }
  .pop small { color: var(--caption); font-size: 12px; }
  .toast { position: fixed; z-index: 45; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: calc(100vw - 32px); padding: 9px 16px; border-radius: 10px; background: var(--bar); color: var(--bar-ink); font-size: 14px; font-weight: 700; box-shadow: var(--shadow); }

  /* ---------- Fenêtres ---------- */
  .voile { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgb(10 22 27 / .6); }
  .boite { width: min(620px, 100%); max-height: calc(100% - 24px); overflow-y: auto; padding: 22px 24px; border-radius: 16px; background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgb(0 0 0 / .3); display: flex; flex-direction: column; gap: 12px; }
  .boite.large { width: min(860px, 100%); }
  .boite h2 { margin: 0; font-size: 22px; line-height: 1.2; color: var(--teal); text-wrap: balance; }
  .boite h3 { margin: 6px 0 0; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--vermilion); }
  .boite p, .boite li { margin: 0; font-size: 14.5px; line-height: 1.55; }
  .boite ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
  .boite a { color: var(--teal); font-weight: 700; }
  .boite-tete { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .x { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); font-size: 22px; line-height: 1; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r0 = v => Math.round(v);
const protege = s => !!(s.digue || (s.mur && s.mur.etat !== "casse"));

/* Le temps passe : la côte recule (plus vite si le climat se réchauffe, un peu moins si on recharge). */
function evoluer(s, an) {
  const dt = an - s.annee;
  if (dt > 0) {
    const taux = an > 2024 ? TAUX_FUTUR * (s.terrain === "dune" ? 0.9 : 1) : (s.recharge ? TAUX_RECHARGE : TAUX);
    s.Fb += taux * dt;
    if (!protege(s)) s.F = Math.min(s.Fb, s.F + Math.max(taux, 5) * dt); // sans protection, la dune rattrape son retard
  }

  majPlage(s);
}
function majPlage(s) {
  if (protege(s)) s.plage = Math.max(0, PLAGE0 - (s.Fb - s.F)); // devant un ouvrage, la plage maigrit
  else s.plage = s.recharge && !s.tempete ? PLAGE0 + 15 : PLAGE0;
}
function tempete2014(s) {
  s.tempete = true;
  s.Fb += TEMPETE_2014;
  if (s.mur) s.mur.etat = "abime"; else s.F += TEMPETE_2014;
  majPlage(s);
}
function appliquer(s, d) {
  s.deltas = {};
  for (const k of ["secu", "recettes", "budget", "nature"]) {
    if (!d[k]) continue;
    const avant = s.j[k];
    s.j[k] = clamp(s.j[k] + d[k], 0, 10);
    if (s.j[k] !== avant) s.deltas[k] = s.j[k] - avant;
  }
}

/* Enjeux visibles sur la coupe, du plus proche de la mer au plus loin */
function enjeux(s) {
  const L = [];
  if (s.front === "signal" && s.frontEtat !== "demoli") L.push({ x: X_FRONT, nom: "l'immeuble" });
  if (s.front === "parking" && s.frontEtat !== "demoli") L.push({ x: X_FRONT, nom: "le poste de secours" });
  if (s.terrain === "parking") L.push({ x: X_FRONT + 4, nom: "le parking" });
  if (!s.routeDeplacee) L.push({ x: X_BOULEVARD, nom: "le boulevard" });
  if (s.lotissement) L.push({ x: X_LOTISSEMENT, nom: "le lotissement" });
  if (s.signalTerres || s.reconstruit) L.push({ x: X_TERRES, nom: s.reconstruit ? "le nouvel immeuble" : "l'immeuble" });
  return L.filter(e => e.x > s.F + 0.5).sort((a, b) => a.x - b.x);
}
const premier = s => enjeux(s)[0] || null;
const dist = s => { const e = premier(s); return e ? Math.max(0, r0(e.x - s.F)) : null; };
const nomFront = s => (premier(s) || { nom: "le front de mer" }).nom;
const Maj = t => t.charAt(0).toUpperCase() + t.slice(1);
const menace = s => { const d = dist(s); return d !== null && d <= 40; };
const debout = s => s.frontEtat === "occupe";

/* Logements que la mer pourrait atteindre d'ici 2064 si la côte reculait sans protection */
function limite2064(s) { return s.Fb + TAUX_FUTUR * Math.max(0, 2064 - s.annee); }
function logementsExposes(s) {
  const lim = limite2064(s) + 20;
  let n = 0;
  if (s.front === "signal" && s.frontEtat !== "demoli" && X_FRONT < lim) n += 78;
  if (s.lotissement && X_LOTISSEMENT < lim) n += 30;
  if ((s.signalTerres || s.reconstruit) && X_TERRES < lim) n += 78;
  return n;
}
/* Année où la côte (sans protection) atteindrait le point x */
const anneeAtteint = (s, x) => Math.max(r0(s.annee) + 1, r0(s.annee + (x - s.Fb) / TAUX_FUTUR));

const $ = id => document.getElementById(id);
let VIS = null;      // état dessiné (interpolé pendant les animations)
let anim = 0;

function phys(s) {
  return JSON.parse(JSON.stringify({
    F: s.F, Fb: s.Fb, plage: s.plage, annee: s.annee, mur: s.mur, murUrgence: s.murUrgence, digue: s.digue,
    recharge: s.recharge, tempete: s.tempete, front: s.front, frontEtat: s.frontEtat, signalTerres: s.signalTerres,
    lotissement: s.lotissement, terrain: s.terrain, reconstruit: s.reconstruit, routeDeplacee: s.routeDeplacee,
    campingDeplace: s.campingDeplace, interdit: s.interdit, etape: s.etape, phase: s.phase,
    projection: s.projection !== undefined ? s.projection : s.etape === 7 && s.phase === "situation",
    final: !!s.final,
  }));
}
function interp(a, b, e) {
  const r = phys(e < .5 ? a : b);
  for (const k of ["F", "Fb", "plage", "annee"]) r[k] = a[k] + (b[k] - a[k]) * e;
  if (a.mur && b.mur) r.mur.x = a.mur.x + (b.mur.x - a.mur.x) * e;
  return r;
}
function animer(de, vers, duree = 1500) {
  cancelAnimationFrame(anim);
  if (reduit) { VIS = vers; dessinerScenes(); return; }
  const t0 = performance.now();
  const pas = now => {
    const k = Math.min(1, (now - t0) / duree), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    VIS = interp(de, vers, e);
    dessinerScenes();
    if (k < 1) anim = requestAnimationFrame(pas);
  };
  anim = requestAnimationFrame(pas);
}

let R3 = null;      // la maquette 3D (null si la 3D est indisponible)
const VUE_ETAPE = { 1: "ensemble", 2: "signal", 3: "ensemble", 4: "signal", 5: "signal", 6: "signal", 7: "ensemble" };
function preparerScenes() {
  try { R3 = creerMoteur3D($("vue3d"), $("etiquettes")); } catch (e) { R3 = null; }
  $("chargement").hidden = true;

}
function montrerSecours() {

}

  $("annee").textContent = Math.round(VIS.annee);

}

const JAUGES = [
  { k: "secu", nom: "Sécurité des habitants", ico: "bouclier" },
  { k: "recettes", nom: "Recettes touristiques", ico: "parasol" },
  { k: "budget", nom: "Budget de la commune", ico: "euro" },
  { k: "nature", nom: "Nature : dune et plage", ico: "oyat" },
];
function htmlJauges(s, avecDeltas) {
  let o = `<p class="vtitre">Jauges de la commune</p>`;
  for (const j of JAUGES) {
    const v = s.j[j.k], d = avecDeltas && s.deltas ? s.deltas[j.k] : 0;
    o += `<div class="jauge ${v <= 3 ? "bas" : ""}" role="meter" aria-label="${j.nom}" aria-valuemin="0" aria-valuemax="10" aria-valuenow="${v}">
      <span class="j-ico">${I[j.ico]}</span><span class="j-nom">${j.nom}</span>
      <span class="j-delta ${d > 0 ? "plus" : d < 0 ? "moins" : ""}">${d ? (d > 0 ? "+" : "−") + Math.abs(d) : ""}</span>
      <span class="j-barre">${Array.from({ length: 10 }, (_, i) => `<i class="${i < v ? "on" : ""}"></i>`).join("")}</span></div>`;
  }
  const n = logementsExposes(s), d = avecDeltas ? s.dexpo : 0;
  o += `<div class="jauge expo ${n >= 30 ? "bas" : ""}"><span class="j-ico">${I.expo}</span><span class="j-nom">Logements exposés</span>
    <span class="j-delta ${d < 0 ? "plus" : d > 0 ? "moins" : ""}">${d ? (d > 0 ? "+" : "−") + Math.abs(d) : ""}</span>
    <span class="j-chiffre"><b>${n}</b>que la mer peut atteindre d'ici 2064</span></div>`;
  return o;
}
function dessinerJauges() { $("jauges").innerHTML = htmlJauges(S, S.phase === "consequence"); }

/* Frise à l'échelle : les périodes des étapes sont des bandes ; les numéros sont posés
   au-dessus, écartés quand ils se chevauchent (2010-2023 est serré). */
function dessinerFrise() {
  const piste = $("frise"), W = piste.clientWidth || 600;
  const X = an => (an - 1964) / 100 * W;
  let o = `<div class="f-axe"></div><div class="f-futur" style="left:${X(2026).toFixed(1)}px"></div>`;
  for (const a of [1964, 1980, 2000, 2040, 2064]) o += `<span class="f-tick ${a === 1980 || a === 2040 ? "option" : ""}" style="left:${X(a).toFixed(1)}px">${a}</span>`;
  o += `<span class="f-tick auj" style="left:${X(2026).toFixed(1)}px">aujourd'hui</span>`;
  const etats = ETAPES.map((e, i) => { const n = i + 1; return n < S.etape || (n === S.etape && S.phase !== "situation") ? "fait" : n === S.etape ? "cours" : ""; });
  ETAPES.forEach((e, i) => { o += `<span class="f-bande ${etats[i]}" style="left:${X(e.debut).toFixed(1)}px;width:${Math.max(4, X(e.fin) - X(e.debut)).toFixed(1)}px"></span>`; });
  const c = ETAPES.map(e => X((e.debut + e.fin) / 2));
  for (let i = 1; i < c.length; i++) c[i] = Math.max(c[i], c[i - 1] + 24);
  c[c.length - 1] = Math.min(c[c.length - 1], W - 11);
  for (let i = c.length - 2; i >= 0; i--) c[i] = Math.min(c[i], c[i + 1] - 24);
  ETAPES.forEach((e, i) => { o += `<span class="f-pt ${etats[i]}" style="left:${c[i].toFixed(1)}px" title="Étape ${i + 1} · ${e.an} · ${e.titre}">${i + 1}</span>`; });
  piste.innerHTML = o;
}
window.addEventListener("resize", () => dessinerFrise());

function htmlDoc(cleDoc, i) {
  const d = DOCS[cleDoc]();
  let corps = "";
  if (d.citation) corps = `<blockquote><p>« ${d.citation} »</p></blockquote>`;
  if (d.visuel) corps = `<div class="doc-visuel">${d.visuel}</div>`;
  if (d.photo) {
    const p = PHOTOS[d.photo];
    return `<figure class="doc"><p class="doc-type">Document ${i + 1} · ${d.type}</p><h3>${p.titre}</h3>
      <div class="photo-cadre" data-photo="${d.photo}">${d.croquis}<span class="croquis-tag">croquis</span></div>
      <figcaption><span>${p.credit}.</span><span><a href="${p.url}" target="_blank" rel="noopener">Voir la photo sur Wikimedia Commons ↗</a></span></figcaption></figure>`;
  }
  return `<figure class="doc"><p class="doc-type">Document ${i + 1} · ${d.type}</p>${d.titre ? `<h3>${d.titre}</h3>` : ""}${corps}
    <figcaption>${d.leg ? `<span class="leg">${d.leg}</span>` : ""}<span>Source : ${d.source}</span></figcaption></figure>`;
}
function chargerPhotos(racine) {
  racine.querySelectorAll(".photo-cadre[data-photo]").forEach(cadre => {
    const p = PHOTOS[cadre.dataset.photo];
    if (!p.fichier) return;
    const img = new Image();
    img.alt = p.titre;
    img.onload = () => { cadre.innerHTML = ""; cadre.appendChild(img); };
    img.src = p.fichier;
  });
}

function dessinerPanneau() {
  const e = ETAPES[S.etape - 1];
  if (!e) { $("panneau").innerHTML = ""; return; }
  const choix = e.choix(S);
  let o = `<div class="p-corps">
    <p class="p-tag">Étape ${S.etape}/7 · ${e.an}${e.rappel ? `<span class="rappel">rappel</span>` : ""}</p>
    <h2>${e.titre}</h2>
    <div class="situation">${S.situationFigee || e.situation(S)}</div>`;
  const chez = S.chezFige !== undefined ? S.chezFige : (e.chez ? e.chez(S) : "");
  if (chez) o += `<p class="chez">${I.loupe}<span><b>Chez vous :</b> ${chez}</span></p>`;
  o += `<div class="docs">${e.docs.map(htmlDoc).join("")}</div>`;
  o += `<div class="choix" role="group" aria-label="Votre décision"><p class="choix-titre">Votre décision, madame ou monsieur le maire</p>`;
  for (const c of choix) {

    o += `<button type="button" class="opt ${choisi ? "choisi" : ""}" data-choix="${c.id}" ${S.phase === "consequence" ? "disabled" : ""}>${I[c.icone]}<b>${c.label}</b><small>${c.aide}</small></button>`;
  }

    const lis = [];
    for (const j of JAUGES) { const d = S.deltas && S.deltas[j.k]; if (d) lis.push(`<li class="${d > 0 ? "plus" : "moins"}">${j.nom} ${d > 0 ? "+" : "−"}${Math.abs(d)}</li>`); }
    if (S.dexpo) lis.push(`<li class="${S.dexpo < 0 ? "plus" : "moins"}">Logements exposés ${S.dexpo > 0 ? "+" : "−"}${Math.abs(S.dexpo)}</li>`);
    o += `<div class="consequence" id="consequence"><p class="q-tag">Conséquence${S.etape < 7 ? ` · ${S.annee >= 2064 ? 2064 : r0(S.annee)}` : " · 2064"}</p><p>${S.textes[e.cle]}</p>
      ${lis.length ? `<ul class="bilan-deltas">${lis.join("")}</ul>` : ""}
      <p class="fiche-note">${I.crayon}<span>Sur votre fiche, ligne ${S.etape} : notez votre choix et sa conséquence.</span></p></div>`;
    o += S.etape < 7
      ? `<button type="button" class="btn or grand" id="b-suivant">Étape suivante : ${ETAPES[S.etape].an} →</button>`

  $("panneau").innerHTML = o;

  const bs = $("b-suivant"); if (bs) bs.addEventListener("click", suivant);

}

function dessinerCompteur() { $("lex-compte").textContent = `${S.notions.length}/12`; }
function toutDessiner() { dessinerJauges(); dessinerFrise(); dessinerPanneau(); dessinerCompteur(); }

/* =====================================================================
   Déroulé
   ===================================================================== */
function sauver() { try { localStorage.setItem(CLE, JSON.stringify(S)); } catch (e) { /* stockage indisponible : on continue sans */ } }
function charger() { try { const t = localStorage.getItem(CLE); return t ? Object.assign(etatInitial(), JSON.parse(t)) : null; } catch (e) { return null; } }

function entrerEtape(n) {
  const avant = phys(S);
  S.etape = n; S.phase = "situation"; S.deltas = null; S.dexpo = 0;
  delete S.situationFigee; delete S.chezFige;
  const e = ETAPES[n - 1];
  e.entrer(S);
  const nouvelles = e.notions.filter(id => !S.notions.includes(id));
  S.notions.push(...nouvelles);
  toutDessiner();
  animer(avant, phys(S), n === 4 ? 2200 : 1500);
  $("annonce").textContent = `Étape ${n} sur 7, ${e.an} : ${e.titre}`;
  if (nouvelles.length) toast(`Nouvelle${nouvelles.length > 1 ? "s" : ""} notion${nouvelles.length > 1 ? "s" : ""} dans le lexique : ${nouvelles.map(id => NOTIONS[id].mot).join(", ")}`);
  $("panneau").scrollTop = 0;
  if (R3) R3.allerVue(VUE_ETAPE[n]);
  // sur téléphone, on remonte voir la maquette changer
  if (window.innerWidth <= 980 && n > 1) document.querySelector(".vue").scrollIntoView({ behavior: reduit ? "auto" : "smooth", block: "start" });
  sauver();
}
function choisir(id) {
  if (S.phase !== "situation") return;
  const e = ETAPES[S.etape - 1];
  const c = e.choix(S).find(x => x.id === id);
  // on fige le texte de la situation tel qu'il était au moment du choix
  S.situationFigee = e.situation(S);
  S.chezFige = e.chez ? e.chez(S) : "";
  const avant = phys(S), exp0 = logementsExposes(S);
  S.textes[e.cle] = e.effet(S, id);
  S.choix[e.cle] = id; S.labels[e.cle] = c.label;
  S.deltasEtape[e.cle] = Object.assign({}, S.deltas);
  S.phase = "consequence";
  S.dexpo = logementsExposes(S) - exp0;
  toutDessiner();
  $("annonce").textContent = "Conséquence : " + $("consequence").textContent.replace(/\s+/g, " ").trim();
  animer(Object.assign(avant, { projection: false }), phys(S), S.etape === 7 ? 2600 : 1500);
  const q = $("consequence"); if (q) q.scrollIntoView({ behavior: reduit ? "auto" : "smooth", block: "nearest" });
  sauver();
}
function suivant() { if (S.etape < 7) entrerEtape(S.etape + 1); }

function commencer() {
  S = etatInitial();

    <li>${SRC_AFP}</li><li>${SRC_OCA}</li><li>${SRC_CEREMA}</li>
    <li>Sénat, compte rendu de la séance du 16 mai 2018 (indemnisation des propriétaires du Signal).</li>
    <li>Photos du Signal sur Wikimedia Commons : ${Object.values(PHOTOS).map(p => `<a href="${p.url}" target="_blank" rel="noopener">${p.credit}</a>`).join(" ; ")}.</li>
    <li>Fonds de carte : Natural Earth (domaine public). Maquette 3D (bibliothèque three.js, licence MIT) : reconstitution schématique, relief et bâtiments exagérés × 2, distances en ordres de grandeur. Croquis : dessins schématiques.</li>
  </ul></details>`;
}

/* ---------- Lexique, notions, fenêtres ---------- */
function ouvrirModal(html, large) {
  const b = $("modal-boite");
  b.className = "boite" + (large ? " large" : "");
  b.innerHTML = html;
  $("modal").hidden = false;
  const x = b.querySelector(".x"); if (x) { x.addEventListener("click", fermerModal); x.focus(); }
}
function fermerModal() { $("modal").hidden = true; }
function ouvrirLexique() {
  const cartes = ORDRE_NOTIONS.map(id => S.notions.includes(id)
    ? `<div class="lex"><b>${NOTIONS[id].mot}</b><p>${NOTIONS[id].def}</p></div>`
    : `<div class="lex cache"><b>?</b><p>Notion à découvrir dans une prochaine étape.</p></div>`).join("");
  ouvrirModal(`<div class="boite-tete"><h2>Lexique : ${S.notions.length} notions sur 12</h2><button type="button" class="x" aria-label="Fermer">×</button></div>
    <p>Les notions s'ajoutent au fil des étapes. Recopiez-les sur votre fiche.</p><div class="lexique">${cartes}</div>`, true);
}
function ouvrirFicheProf() {
  ouvrirModal(`<div class="boite-tete"><h2>Fiche prof · Soulac 2064 en 3D</h2><button type="button" class="x" aria-label="Fermer">×</button></div>
    <h3>Place dans la séquence</h3>
    <p>2de · Géographie · Thème 1, chapitre 3 « La France : des milieux métropolitains et ultramarins entre valorisation et protection ». Couvre II-A « Des milieux soumis aux risques » et II-B « Une gestion plus durable ». Prolonge ou remplace la p. 2 de l'Act. 2 (Le Signal) et prépare l'Act. 3. Xynthia n'apparaît qu'en rappel : aucune classe n'a besoin de l'avoir étudiée.</p>
    <h3>Notions</h3>
    <div class="chips">${ORDRE_NOTIONS.map(id => `<span>${NOTIONS[id].mot}</span>`).join("")}</div>
    <h3>Déroulé possible (1 h, en binôme)</h3>
    <div class="tab-wrap"><table class="t"><thead><tr><th>Temps</th><th>Les élèves…</th></tr></thead><tbody>
      <tr><td>5 min</td><td>lisent l'accueil, localisent Soulac, découvrent la fiche (carnet de bord)</td></tr>
      <tr><td>20 min</td><td>étapes 1 à 3 : construire, se défendre ou non, prévenir (rappel Xynthia)</td></tr>
      <tr><td>20 min</td><td>étapes 4 à 6 : la crise de 2014, qui paie, que faire du terrain libéré</td></tr>
      <tr><td>10 min</td><td>étape 7 et bilan : comparaison avec la réalité, schéma « aléa + enjeux = risque »</td></tr>
      <tr><td>5 min</td><td>question de synthèse, rédigée sur la fiche</td></tr>
    </tbody></table></div>
    <h3>Ce qui est réel, ce qui est simulé</h3>
    <ul>
      <li>Réel : le lieu, les dates, les chiffres et les citations (AFP, OCA, Cerema). Aucun maire, préfet ou propriétaire réel n'est nommé ni ne parle.</li>
      <li>Permis de construire : 1964 (fiche Act. 2) ; construction : 1967 (AFP). Les deux dates sont données.</li>
      <li>Simulé : les conséquences des choix. Les distances de la maquette sont des ordres de grandeur : ≈ 200 m du rivage en 1967 et ≈ 20 m de la dune début 2014 sont sourcés ; entre les deux, le recul est lissé à ≈ 2 m par an, plus ≈ 18 m pendant l'hiver 2013-2014 (l'OCA indique jusqu'à 25 m en un hiver).</li>
      <li>Coûts fictifs, signalés comme tels : 3 M€ pour les rochers, 2 M€ pour le parking. Les ≈ 10 M€ pour racheter les 78 logements se déduisent des 7 M€ votés pour 70 % de la valeur.</li>
      <li>Après 2024, la coupe prolonge le recul à ≈ 2 m par an (≈ 50 m d'ici 2050 selon l'OCA). Les chiffres du Cerema sont nationaux : à présenter comme des ordres de grandeur, pas à l'échelle de Soulac.</li>
      <li>Pas de note ni de « bonne réponse » : l'outil montre des conséquences plausibles, sans fin heureuse magique. L'érosion continue quels que soient les choix.</li>
    </ul>
    <h3>La maquette 3D</h3>
    <ul>
      <li>C'est un bloc-diagramme : la face avant est une coupe qui passe au sud du Signal (sable, sable ocre, alios, argile). Relief et bâtiments sont exagérés × 2. Les positions du centre-ville, du camping et du lotissement sont schématiques.</li>
      <li>Quatre points de vue : vue d'ensemble, le Signal, coupe (la face avant, comme un profil de plage) et vu du ciel (comme un plan). La caméra se place seule à chaque étape ; les élèves peuvent ensuite tourner (glisser), zoomer (molette ou pincer) et se déplacer (clic droit ou deux doigts).</li>
      <li>Les parasols suivent la jauge « recettes touristiques » ; le drapeau de baignade passe au rouge pendant la tempête de 2014.</li>
      <li>Sur un ordinateur lent, les ombres se coupent toutes seules. Si la 3D ne s'affiche pas (WebGL absent), le jeu reste jouable sans maquette, et le lien « Version 2D » ouvre la version avec coupe et plan dessinés.</li>
    </ul>
    <h3>Photos</h3>
    <p>Trois photos libres du Signal sont sur Wikimedia Commons (liens dans les documents). Pour les afficher dans la version du Cahier de progression (<code>rituels/soulac-2064-3d.html</code> et <code>soulac-2064.html</code>), déposez-les dans <code>rituels/docs/2de-g1-c3/</code> sous les noms <code>signal-2015.jpg</code>, <code>signal-2017.jpg</code> et <code>signal-2021.jpg</code> : elles remplacent alors les croquis, avec leur crédit. Les photos Sud Ouest de l'Act. 2 restent sur la fiche papier.</p>
    <h3>Éléments de réponse (synthèse)</h3>
    <p>Défendre (enrochement, digue) protège à court terme mais coûte cher, fait disparaître la plage et ne supprime pas l'aléa : l'érosion continue à côté, et une digue peut céder. Reculer (recomposition spatiale) coûte cher une fois, réduit les enjeux et garde la plage. La prévention empêche d'ajouter des enjeux. Au Signal, faute d'anticipation, ce sont l'évacuation (2014), des années de procès, puis la solidarité nationale (7 M€) et la démolition (2023) qui ont tranché.</p>
    ${htmlCredits()}`, true);
}
function demanderRecommencer() {
  ouvrirModal(`<div class="boite-tete"><h2>Recommencer une partie ?</h2><button type="button" class="x" aria-label="Fermer">×</button></div>
    <p>Vos choix actuels seront effacés. Pensez à les avoir notés sur votre fiche.</p>
    <div class="actions"><button type="button" class="btn or" id="b-ok-recommencer">Recommencer</button><button type="button" class="btn second" id="b-annuler">Annuler</button></div>`);
  $("b-ok-recommencer").addEventListener("click", () => { fermerModal(); try { localStorage.removeItem(CLE); } catch (e) { /* rien */ } commencer(); });
  $("b-annuler").addEventListener("click", fermerModal);
}

let toastT = 0;
function toast(t) {
  const el = $("toast"); el.textContent = t; el.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 3800);
}
function ouvrirNotion(btn) {
  const id = btn.dataset.n, n = NOTIONS[id], pop = $("pop");
  pop.innerHTML = `<p class="pop-mot">${n.mot}</p><p>${n.def}</p><small>${S.notions.includes(id) ? "Dans votre lexique." : ""}</small>`;
  pop.hidden = false;
  const r = btn.getBoundingClientRect(), w = pop.offsetWidth, hgt = pop.offsetHeight;
  let x = Math.min(Math.max(16, r.left), window.innerWidth - w - 16);
  let y = r.bottom + 8; if (y + hgt > window.innerHeight - 16) y = Math.max(16, r.top - hgt - 8);
  pop.style.left = x + "px"; pop.style.top = y + "px";
  if (!S.lues.includes(id)) { S.lues.push(id); sauver(); }
}

document.addEventListener("click", ev => {
  const mot = ev.target.closest(".mot");
  if (mot) { ev.stopPropagation(); ouvrirNotion(mot); return; }
  if (!ev.target.closest("#pop")) $("pop").hidden = true;
  if (ev.target === $("modal")) fermerModal();
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") { $("pop").hidden = true; fermerModal(); }
});
window.addEventListener("scroll", () => { $("pop").hidden = true; }, true);
$("b-lexique").addEventListener("click", ouvrirLexique);
document.querySelectorAll("[data-vue]").forEach(b => b.addEventListener("click", () => { if (R3) R3.allerVue(b.dataset.vue); }));
$("b-etiq").addEventListener("click", ev => {
  const on = ev.currentTarget.getAttribute("aria-pressed") !== "true";
  ev.currentTarget.setAttribute("aria-pressed", on ? "true" : "false");
  if (R3) R3.etiquettes(on);
});
$("b-prof").addEventListener("click", ouvrirFicheProf);
$("b-recommencer").addEventListener("click", demanderRecommencer);

/* ---------- Démarrage ---------- */
preparerScenes();
VIS = phys(S);
dessinerScenes();
toutDessiner();
ouvrirAccueil();
</script>
</body>
</html>
