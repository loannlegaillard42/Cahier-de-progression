        panneau.appendChild(bouton);
        panneau.appendChild(modele);
        zone.appendChild(panneau);
      }

      zone.appendChild(el("div", { class: "etiq noprint", text: "S'entraîner sur ce point de passage" }));
      var liens = el("div", { class: "liens-ppo noprint" });
      [["cartes", "Cartes mémoire"], ["quiz", "Quiz"], ["classer", "Classer"], ["trous", "Texte à trous"], ["frise", "Frise"], ["carte", "Carte"], ["documents", "Documents"]].forEach(function (o) {
        var outil = OUTILS.filter(function (x) { return x.id === o[0]; })[0];
        if (!outil.dispo(ch)) return;
        if (o[0] === "classer" && !p.schema) return;
        if (o[0] === "carte" && nbLieuxPlaces(ch, p.id) < 3) return;
        if (o[0] === "documents" && !imagesChapitre(ch, p.id).length) return;
        liens.appendChild(el("a", { class: "btn", href: lienChapitre(ch, o[0]) + "/" + p.id }, avecIcone(outil.icone, o[1])));
      });
      zone.appendChild(liens);
    }
    dessinerOnglets();
    dessiner();
  }

  // ---------- Classer : le schéma bilan d'un point de passage ----------
  function vueClasser(ch, cible) {
    var lesPPO = liste(ch, "ppo").filter(function (p) { return p.schema; });
    var idx = Math.max(0, lesPPO.map(function (p) { return p.id; }).indexOf(routeActuelle().sous));
    var onglets = el("div", { class: "onglets", role: "group", "aria-label": "Schémas" });
    var zone = el("div");
    cible.appendChild(el("p", { class: "consigne-outil", text: "Touche une étiquette, puis la case où elle va. Touche une étiquette déjà placée pour la reprendre." }));
    cible.appendChild(onglets);
    cible.appendChild(zone);

    var etiquettes, place, choisie, verifie;
    function dessinerOnglets() {
      onglets.innerHTML = "";
      if (lesPPO.length < 2) return;
      lesPPO.forEach(function (p, i) {
        onglets.appendChild(el("button", { class: "opt", type: "button", text: p.court || p.titre, "aria-pressed": String(i === idx), onclick: function () { idx = i; dessinerOnglets(); demarrer(); } }));
      });
    }
    function demarrer() {
      etiquettes = [];
      lesPPO[idx].schema.cases.forEach(function (c, i) { liste(c, "etiquettes").forEach(function (t) { etiquettes.push({ txt: t, bonne: i }); }); });
      etiquettes = melanger(etiquettes);
      place = {}; choisie = null; verifie = false;
      dessiner();
    }
    function bouton(e, n) {
      var classes = "etiquette" + (choisie === n ? " choisie" : "");
      if (verifie) classes += place[n] === e.bonne ? " juste" : " faux";
      var b = el("button", { class: classes, type: "button", disabled: verifie, "aria-pressed": String(choisie === n) }, e.txt);
      if (verifie && place[n] !== e.bonne) b.appendChild(el("span", { class: "corr", text: "→ " + lesPPO[idx].schema.cases[e.bonne].titre }));
      b.addEventListener("click", function () {
        if (place[n] !== undefined) { delete place[n]; choisie = n; }
        else choisie = choisie === n ? null : n;
        dessiner();
      });
      return b;
    }
    function dessiner() {
      var schema = lesPPO[idx].schema;
      zone.innerHTML = "";
      zone.appendChild(el("h2", { text: schema.titre, style: "margin-bottom:10px" }));
      var grilleCases = el("div", { class: "cases" });
      schema.cases.forEach(function (c, i) {
        var contenu = el("div", { class: "case-contenu" });
        etiquettes.forEach(function (e, n) { if (place[n] === i) contenu.appendChild(bouton(e, n)); });
        var cibleCase = el("button", { class: "case-cible" + (choisie !== null && !verifie ? " prete" : ""), type: "button", disabled: verifie, "aria-label": "Placer dans : " + c.titre },
          [el("strong", { text: c.titre }), el("span", { text: choisie !== null && !verifie ? "Toucher pour placer ici" : c.aide })]);
        cibleCase.addEventListener("click", function () {
          if (choisie === null) return;
          place[choisie] = i;
          choisie = null;
          dessiner();
        });
        grilleCases.appendChild(el("div", { class: "case" }, [cibleCase, contenu]));
      });
      zone.appendChild(grilleCases);

      var restantes = etiquettes.map(function (e, n) { return n; }).filter(function (n) { return place[n] === undefined; });
      if (!verifie && restantes.length) {
        zone.appendChild(el("div", { class: "etiq", text: "Étiquettes à placer (" + restantes.length + ")" }));
        var reserve = el("div", { class: "reserve-etiquettes" });
        restantes.forEach(function (n) { reserve.appendChild(bouton(etiquettes[n], n)); });
        zone.appendChild(reserve);
      }
      if (!verifie && !restantes.length) {
        zone.appendChild(el("div", { class: "btns" }, [
          el("button", { class: "btn plein", type: "button", text: "Vérifier", onclick: function () { verifie = true; dessiner(); } }),
          el("button", { class: "btn", type: "button", text: "Tout reprendre", onclick: demarrer })
        ]));
      }
      if (verifie) {
        var justes = etiquettes.filter(function (e, n) { return place[n] === e.bonne; }).length;
        zone.appendChild(el("div", { class: "bilan carte-panneau", style: "margin-top:14px;padding:18px" }, [
          el("div", { class: "gros", text: justes + " / " + etiquettes.length }),
          el("p", { text: justes === etiquettes.length ? "Tout est bien classé, bravo !" : "Les étiquettes en rouge indiquent la bonne case." }),
          el("div", { class: "btns" }, [
            el("button", { class: "btn plein", type: "button", text: "Recommencer", onclick: demarrer }),
            el("a", { class: "btn", href: lienChapitre(ch, "ppo") + "/" + lesPPO[idx].id, text: "Revoir le point de passage" })
          ])
        ]));
        annoncer(justes + " étiquettes bien classées sur " + etiquettes.length + ".");
      }
    }
    dessinerOnglets();
    demarrer();
  }

  // ---------- Carte à compléter ----------
  // Le fond vient de cartes.js (côtes déjà projetées) ; les lieux gardent leurs coordonnées (lon, lat) dans cours.js
  // et sont placés avec la même projection. Les points et les noms gardent la même taille à l'écran quel que soit
  // le zoom ; quand plusieurs points sont trop proches pour être touchés au doigt, la carte zoome sur la zone.
  var ZOOM_MAX = 8;
  var ZOOM_FLEUVES = 2.5; // les noms des fleuves n'apparaissent qu'à partir de ce zoom
  var cartesVivantes = [];
  var numeroCarte = 0;
  window.addEventListener("resize", function () {
    cartesVivantes = cartesVivantes.filter(function (c) { return c.boite.isConnected; });
    cartesVivantes.forEach(function (c) { c.echelle(); });
  });

  // ch.carte : un fond (identifiant dans cartes.js) ou plusieurs, du plus détaillé au plus large
  function fondsChapitre(ch) {
    if (typeof FONDS === "undefined" || !ch.carte) return [];
    return (Array.isArray(ch.carte) ? ch.carte : [ch.carte]).map(function (id) { return FONDS[id]; }).filter(Boolean);
  }
  function dansFond(f, p) {
    var x = (p.lon - f.lon0) * f.kx, y = (f.lat0 - p.lat) * f.ky;
    return x >= 0 && x <= f.l && y >= 0 && y <= f.h;
  }
  // chaque lieu va sur le premier fond qui le contient (ou sur celui qu'il demande : un pays sur le planisphère
  // plutôt que sur la carte de sa région) ; on ne garde que les fonds qui ont au moins « min » lieux
  function rangFond(fonds, p) {
    for (var j = 0; j < fonds.length; j++) if (p.fond && fonds[j].id === p.fond && dansFond(fonds[j], p)) return j;
    for (var k = 0; k < fonds.length; k++) if (dansFond(fonds[k], p)) return k;
    return -1;
  }
  function cartesDuChapitre(ch, filtre, min) {
    var fonds = fondsChapitre(ch);
    var res = fonds.map(function (f) { return { fond: f, lieux: [] }; });
    lieuxCarte(ch, filtre).forEach(function (p) {
      var k = rangFond(fonds, p);
      if (k >= 0) res[k].lieux.push(p);
    });
    return res.filter(function (r) { return r.lieux.length >= (min || 1); });
  }
  function nbLieuxPlaces(ch, filtre) {
    return cartesDuChapitre(ch, filtre, 3).reduce(function (n, r) { return n + r.lieux.length; }, 0);
  }
  // un même lieu cité dans le cours et dans un point de passage n'apparaît qu'une fois
  // (même nom, ou mêmes coordonnées : « Rome » et « Rome (Vatican) »)
  function lieuxCarte(ch, filtre) {
    var vus = {}, res = [];
    blocsChoisis(ch, filtre).forEach(function (b) {
      liste(b.data, "lieux").forEach(function (x) {
        if (typeof x.lon !== "number" || typeof x.lat !== "number") return;
        var k = normaliser(x.nom);
        if (vus[k] || res.some(function (r) { return Math.abs(r.lon - x.lon) < .05 && Math.abs(r.lat - x.lat) < .05; })) return;
        vus[k] = true;
        res.push({ nom: x.nom, txt: x.txt, lon: x.lon, lat: x.lat, fond: x.fond, src: b.id === "cours" ? "" : b.nom, carte: b.prefixe + "|l|" + x.nom });
      });
    });
    return res;
  }

  // opts : surLieu(i) quand un point est choisi au clavier ou d'un doigt sûr,
  //        surTouche(pt, proches) pour un toucher sur la carte (proches : les points à portée de doigt, du plus près au plus loin)
  function creerCarte(fond, lieux, opts) {
    var L = fond.l, H = fond.h;
    var vb = { x: 0, y: 0, w: L, h: H };
    var anim = null;
    var pts = lieux.map(function (p) { return { x: (p.lon - fond.lon0) * fond.kx, y: (fond.lat0 - p.lat) * fond.ky }; });
    var voulu = lieux.map(function () { return 0; }); // priorité du nom : 0 caché, 1 si la place le permet, 3 toujours

    var idTerre = "k-terre-" + (++numeroCarte);
    var svg = svgEl("svg", { viewBox: "0 0 " + L + " " + H, class: "k-svg", role: "group", "aria-label": opts.titre || fond.nom });
    svg.appendChild(svgEl("rect", { class: "k-mer", x: -20, y: -20, width: L + 40, height: H + 40 }));
    svg.appendChild(svgEl("path", { id: idTerre, class: "k-terre", d: fond.terre, "fill-rule": "evenodd" }));
    if (fond.fleuves) svg.appendChild(svgEl("path", { class: "k-fleuve", d: fond.fleuves }));
    if (fond.frontieres) svg.appendChild(svgEl("path", { class: "k-frontiere", d: fond.frontieres }));
    // noms des mers et des fleuves : ils s'effacent devant les lieux, et quand ils ne tiennent pas
    var gMers = svgEl("g", { class: "k-mers", "aria-hidden": "true" });
    function nomDecor(m, cls) {
      var x = (m.lon - fond.lon0) * fond.kx, y = (fond.lat0 - m.lat) * fond.ky;
      var t = svgEl("text", { class: cls, x: x, y: y, transform: m.rot ? "rotate(" + m.rot + " " + x + " " + y + ")" : "" });
      m.nom.split("\n").forEach(function (ligne, k) { t.appendChild(svgEl("tspan", { x: x, dy: k ? "1.1em" : "0" }, ligne)); });
      gMers.appendChild(t);
      return { t: t, taille: m.grand ? 13.5 : cls === "k-fleuve-txt" ? 10.5 : 11.5, max: m.max, fleuve: cls === "k-fleuve-txt" };
    }
    var decors = liste(fond, "mers").map(function (m) { return nomDecor(m, "k-mer-txt"); })
      .concat(liste(fond, "nomsFleuves").map(function (m) { return nomDecor(m, "k-fleuve-txt"); }));
    svg.appendChild(gMers);
    var gMarques = svgEl("g", { "aria-hidden": "true" });
    var gPts = svgEl("g", {});
    var gEtq = svgEl("g", { class: "k-etiquettes", "aria-hidden": "true" });
    svg.appendChild(gMarques);
    svg.appendChild(gPts);
    svg.appendChild(gEtq);

    var noeuds = lieux.map(function (p, i) {
      var g = svgEl("g", { class: "k-lieu", tabindex: "0", role: "button", "aria-label": opts.nomAccessible ? opts.nomAccessible(i) : p.nom });
      var anneau = svgEl("circle", { class: "k-anneau", cx: pts[i].x, cy: pts[i].y, r: 6 });

    var dezoom = el("button", { class: "k-dezoom noprint", type: "button", hidden: true, onclick: function () { toutVoir(); } }, "Toute la carte");

    function largeurEcran() { return svg.getBoundingClientRect().width || 360; }

        if (!r.width) return;

      });
      var ordre = voulu.map(function (v, i) { return i; }).filter(function (i) { return voulu[i] > 0; })
        .sort(function (a, b) { return voulu[b] - voulu[a]; });
      function libre(r, soi) {
        if (r.x < vb.x + 2 * u || r.y < vb.y + 2 * u || r.x + r.w > vb.x + vb.w - 2 * u || r.y + r.h > vb.y + vb.h - 2 * u) return false;
        return prises.every(function (o) {
          return o.i === soi || r.x >= o.x + o.w || o.x >= r.x + r.w || r.y >= o.y + o.h || o.y >= r.y + r.h;
        });
      }
      ordre.forEach(function (i) {
        var n = noeuds[i], p = pts[i];
        n.t.removeAttribute("display");
        var w = n.t.getComputedTextLength();
        var places = [
          { x: p.x + ecart, y: p.y + h * .35, a: "start", r: { x: p.x + ecart, y: p.y - h * .6, w: w, h: h * 1.1 } },
          { x: p.x - ecart, y: p.y + h * .35, a: "end", r: { x: p.x - ecart - w, y: p.y - h * .6, w: w, h: h * 1.1 } },
          { x: p.x, y: p.y - ecart, a: "middle", r: { x: p.x - w / 2, y: p.y - ecart - h * .85, w: w, h: h * 1.05 } },
          { x: p.x, y: p.y + ecart + h * .8, a: "middle", r: { x: p.x - w / 2, y: p.y + ecart - h * .1, w: w, h: h * 1.05 } }
        ];
        var choix = places.filter(function (pl) { return libre(pl.r, i); })[0];
        if (!choix && voulu[i] >= 3) {

        n.t.setAttribute("y", choix.y);
        n.t.setAttribute("text-anchor", choix.a);
        prises.push({ x: choix.r.x, y: choix.r.y, w: choix.r.w, h: choix.r.h, i: -1 });

    }

    function appliquerVue() {
      svg.setAttribute("viewBox", [vb.x, vb.y, vb.w, vb.h].map(function (v) { return Math.round(v * 10) / 10; }).join(" "));
      cadreApercu.setAttribute("x", vb.x); cadreApercu.setAttribute("y", vb.y);
      cadreApercu.setAttribute("width", vb.w); cadreApercu.setAttribute("height", vb.h);

    function cadrer(c) {

        var k = duree ? Math.min(1, (t - t0) / duree) : 1;
        var e = 1 - Math.pow(1 - k, 3);
        ["x", "y", "w", "h"].forEach(function (c) { vb[c] = depart[c] + (cible[c] - depart[c]) * e; });
        appliquerVue();
        if (k < 1) { echelle(true); anim = requestAnimationFrame(pas); return; }

    function toutVoir(fin) { if (vb.w >= L - .5) { if (fin) fin(); return; } zoomer({ x: 0, y: 0, w: L, h: H }, fin); }

    }
    function dansLaVue(i) {
      var p = pts[i];

    function versCarte(e) {
      var m = svg.getScreenCTM();

    }
    // Au doigt, on vise à une dizaine de pixels près : si deux points sont à portée et que le toucher
    // ne penche pas nettement vers l'un d'eux, on zoome plutôt que de deviner. À la souris, on est plus précis.
    function toucher(e) {

      var pt = versCarte(e);
      var u = unite();
      var souris = e.pointerType === "mouse" || (!e.pointerType && window.matchMedia && window.matchMedia("(pointer: fine)").matches);
      var portee = (souris ? 12 : 22) * u, marge = (souris ? 5 : 9) * u;

      var tous = pts.map(function (p, i) { return { i: i, d: Math.sqrt(Math.pow(p.x - pt.x, 2) + Math.pow(p.y - pt.y, 2)) }; })
        .sort(function (a, b) { return a.d - b.d; });

      etat: function (i, cls) {

        noeuds[i].t.setAttribute("class", "k-etq" + (cls ? " " + cls : ""));

  // La carte « à observer » : tous les noms, un toucher affiche ce qu'il faut savoir du lieu

      carte.nom(i, 3);

  // dans l'essentiel et les points de passage : la carte au-dessus de la liste des lieux
  function blocCarteLieux(ch, filtre, conteneur) {
    var cartes = cartesDuChapitre(ch, filtre);
    if (!cartes.length) return;
    var zone = el("div", { class: "k-bloc" });
    conteneur.appendChild(zone);
    cartes.forEach(function (r) {
      if (cartes.length > 1) zone.appendChild(el("div", { class: "k-legende", text: r.fond.nom }));
      carteObservee(zone, r.fond, r.lieux, false);
    });
    if (nbLieuxPlaces(ch, filtre) >= 3) {
      zone.appendChild(el("div", { class: "btns noprint", style: "margin-top:10px" },
        el("a", { class: "btn", href: lienChapitre(ch, "carte") + (filtre ? "/" + filtre : "") }, avecIcone("carte", "S'entraîner sur la carte"))));
    }
  }

  function vueCarte(ch, cible) {
    var assez = function (b) { return nbLieuxPlaces(ch, b.id) >= 3; };
    var filtre = blocDemande(ch, assez);
    var mode = "observer";
    var idFond = null; // fond choisi, quand le chapitre en a plusieurs
    var choixBloc = el("div"), choixFond = el("div"), choixMode = el("div"), zone = el("div");
    cible.appendChild(choixBloc);
    cible.appendChild(choixFond);
    cible.appendChild(choixMode);
    cible.appendChild(zone);
    function cartes() { return cartesDuChapitre(ch, filtre, 3); }
    function carteActuelle() {
      var c = cartes();
      return c.filter(function (r) { return r.fond.id === idFond; })[0] || c[0];
    }
    var MODES = [
      { id: "observer", nom: "Observer" },
      { id: "points", nom: "Me tester" },
      { id: "expert", nom: "Expert : sans les points" }
    ];

    function dessinerChoix() {
      choixBloc.innerHTML = "";
      var g = selecteurBlocs(ch, filtre, true, assez, function (id) { filtre = id; dessinerChoix(); demarrer(); });
      if (g) choixBloc.appendChild(g);
      choixFond.innerHTML = "";
      var c = cartes();
      if (c.length > 1) {
        var actuelle = carteActuelle().fond.id;
        var f = el("div", { class: "segments", role: "group", "aria-label": "Carte" });
        c.forEach(function (r) {
          f.appendChild(el("button", { class: "opt", type: "button", text: r.fond.nom, "aria-pressed": String(r.fond.id === actuelle), onclick: function () { idFond = r.fond.id; dessinerChoix(); demarrer(); } }));
        });
        choixFond.appendChild(f);
      }
      choixMode.innerHTML = "";
      var m = el("div", { class: "segments", role: "group", "aria-label": "Mode" });
      MODES.forEach(function (o) {
        m.appendChild(el("button", { class: "opt", type: "button", text: o.nom, "aria-pressed": String(o.id === mode), onclick: function () { mode = o.id; dessinerChoix(); demarrer(); } }));
      });
      choixMode.appendChild(m);
    }

    function demarrer() {

      surToucheVue = null;
      var r = carteActuelle();
      var fond = r.fond, lieux = r.lieux;
      if (mode === "observer") {
        zone.appendChild(el("p", { class: "consigne-outil", text: "Repère les lieux du chapitre : touche un point pour lire ce qu'il faut en savoir. Quand plusieurs points sont serrés, la carte zoome." }));
        carteObservee(zone, fond, lieux, true);
        zone.appendChild(el("div", { class: "btns" }, el("button", { class: "btn plein", type: "button", text: "Je me teste", onclick: function () { mode = "points"; dessinerChoix(); demarrer(); } })));
        return;
      }
      jouer(fond, lieux, mode === "expert");
    }

    function jouer(fond, lieux, expert) {
      var serie = melanger(lieux.map(function (p, i) { return i; }));
      if (serie.length > 12) serie = serie.slice(0, 10);
      var pos = 0, score = 0, rates = [], repondu = false, faux = -1;
      var etats = lieux.map(function () { return expert ? "cache" : ""; });

      var compteur = el("div", { class: "compteur" });
      var question = el("div", { class: "k-question" });
      var bas = el("div");
      var carte = creerCarte(fond, lieux, {
        titre: "Carte muette",
        nomAccessible: function (i) { return "Point " + (i + 1); },
        surLieu: function (i) { if (!repondu) repondre(i, null); },
        surTouche: function (pt, proches) {
          if (repondu) return;
          if (!expert && !proches.length) { statut("Touche l'un des points de la carte."); return; }

        },
        surZoom: function () { statut("Zoom sur la zone : touche à nouveau le bon endroit."); }
      });
      lieux.forEach(function (p, i) { carte.etat(i, etats[i]); });
      zone.appendChild(compteur);
      zone.appendChild(question);
      zone.appendChild(carte.boite);
      zone.appendChild(bas);
      carte.echelle();

      function statut(t) {
        var s = bas.querySelector(".k-statut");
        if (s) s.textContent = t;
        annoncer(t);
      }
      function dessinerQuestion() {
        repondu = false;
        var c = serie[pos];
        var barre = el("div", { class: "barre" }, el("span"));
        barre.firstChild.style.width = Math.round(pos / serie.length * 100) + "%";
        compteur.innerHTML = "";
        compteur.appendChild(el("span", { text: "Lieu " + (pos + 1) + " sur " + serie.length + " · " + score + " trouvé" + (score > 1 ? "s" : "") }));
        compteur.appendChild(barre);
        question.innerHTML = "";
        question.appendChild(el("span", { class: "q-consigne", text: expert ? "Touche l'endroit exact :" : "Touche le point de…" }));
        question.appendChild(el("span", { class: "k-nom", text: lieux[c].nom }));
        bas.innerHTML = "";
        bas.appendChild(el("p", { class: "k-statut", text: expert ? "Pas de points : à toi de situer le lieu." : "Plusieurs points serrés ? Touche la zone : la carte zoome." }));
        annoncer("Où se trouve " + lieux[c].nom + " ?");
      }
      function repondre(i, pt) {
        repondu = true;
        var c = serie[pos];
        var juste = i === c;
        if (juste) { score++; etats[c] = "trouve"; carte.etat(c, "trouve"); carte.nom(c, 3); }
        else {
          rates.push(c);
          oublierCarte(lieux[c].carte);
          etats[c] = "rate";
          carte.etat(c, "vise");
          carte.nom(c, 3);
          if (i >= 0) { faux = i; carte.etat(i, "faux"); carte.nom(i, 3); }
          if (pt) carte.croix(pt);
        }
        var p = lieux[c];
        var titre = juste ? "Bien vu !" : i >= 0 ? "Non : là, c'est " + lieux[i].nom + "." : "Raté : ce n'est pas là.";
        var aide = juste ? "" : p.nom + " est le point orange qui clignote. ";
        bas.innerHTML = "";
        bas.appendChild(el("div", { class: "retour-q " + (juste ? "bien" : "mal") }, [el("strong", { text: titre }), el("span", { text: aide + p.txt })]));
        var suivant = el("button", { class: "btn plein", type: "button", text: pos === serie.length - 1 ? "Voir mon score" : "Lieu suivant", onclick: suite });
        bas.appendChild(el("div", { class: "btns" }, suivant));
        annoncer(titre + " " + aide + p.txt);
        // le bon point doit se voir : on dézoome s'il est hors du cadre
        if (!juste && !carte.dansLaVue(c)) carte.toutVoir(); else carte.echelle();

      }
      function suite() {
        var c = serie[pos];
        carte.effacerMarques();
        if (faux >= 0) {
          carte.etat(faux, etats[faux]);
          carte.nom(faux, etats[faux] === "trouve" || etats[faux] === "rate" ? 1 : 0);
          faux = -1;
        }
        carte.etat(c, etats[c]);
        carte.nom(c, 1);
        pos++;
        carte.toutVoir(function () { carte.echelle(); });
        if (pos >= serie.length) { bilan(); return; }
        dessinerQuestion();
      }
      function bilan() {
        var cle = ch.id + (filtre ? "|" + filtre : "") + (fond.id !== cartes()[0].fond.id ? "|" + fond.id : "") + (expert ? "|expert" : "");
        var ancien = prog.carte[cle];
        if (!ancien || score / serie.length > ancien.score / ancien.sur) { prog.carte[cle] = { score: score, sur: serie.length, t: Date.now() }; sauver(); }
        compteur.innerHTML = "";
        question.innerHTML = "";
        question.appendChild(el("span", { class: "q-consigne", text: "Ta carte complétée" }));
        var msg = score === serie.length ? "Parfait : tu sais situer tous ces lieux !" : score >= serie.length * .7 ? "Très bien !" : score >= serie.length * .5 ? "C'est en bonne voie." : "Observe encore la carte, puis recommence.";
        var b = el("div", { class: "bilan carte-panneau", style: "margin-top:12px" }, [
          el("div", { class: "gros", text: score + " / " + serie.length }),
          el("p", { text: msg })
        ]);
        if (rates.length) {
          b.appendChild(el("p", { class: "petit", text: "À revoir — en orange sur la carte, et en premier dans les cartes mémoire :" }));
          var ul = el("div", { class: "mots", style: "justify-content:center" });
          rates.forEach(function (i) { ul.appendChild(el("span", { class: "mot-cle", text: lieux[i].nom })); });
          b.appendChild(ul);
        }
        b.appendChild(el("div", { class: "btns" }, [
          el("button", { class: "btn plein", type: "button", text: "Rejouer", onclick: demarrer }),
          !expert && score >= serie.length * .7 ? el("button", { class: "btn", type: "button", text: "Passer au mode expert", onclick: function () { mode = "expert"; dessinerChoix(); demarrer(); } }) : null,
          el("button", { class: "btn", type: "button", text: "Observer la carte", onclick: function () { mode = "observer"; dessinerChoix(); demarrer(); } }),
          el("a", { class: "btn", href: lienChapitre(ch), text: "Retour au chapitre" })
        ]));
        bas.innerHTML = "";
        bas.appendChild(b);
        b.querySelector(".btn").focus({ preventScroll: true });
      }
      dessinerQuestion();
    }

    dessinerChoix();
    demarrer();
  }

  // ---------- Les documents : les sources des fiches d'activités, à présenter et à analyser ----------
  // Un document est un texte (extrait) ou une image (image, avec ses détails à repérer : x, y en % de l'image).
  // Il appartient au cours (champ documents du chapitre) ou à un point de passage.
  function documentsChapitre(ch, filtre) {
    var res = [];
    blocsChoisis(ch, filtre).forEach(function (b) {
      liste(b.data, "documents").forEach(function (d, i) {
        res.push({ d: d, bloc: b, id: d.id || b.id + "-" + (i + 1) });
      });
    });
    return res;
  }
  function imagesChapitre(ch, filtre) { return documentsChapitre(ch, filtre).filter(function (x) { return !!x.d.image; }); }
  function documentParId(ch, id) { return documentsChapitre(ch).filter(function (x) { return x.id === id; })[0] || null; }

  var CHIFFRES_ROMAINS = [[1000, "M"], [900, "CM"], [500, "D"], [400, "CD"], [100, "C"], [90, "XC"], [50, "L"], [40, "XL"], [10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]];
  function romain(n) {
    var s = "";
    CHIFFRES_ROMAINS.forEach(function (p) { while (n >= p[0]) { s += p[1]; n -= p[0]; } });
    return s;
  }
  function nomSiecle(n) { return romain(n) + (n === 1 ? "ᵉʳ" : "ᵉ") + " siècle"; }
  // le siècle d'un document : champ annee (nombre), sinon la première année écrite dans sa date
  function siecleDocument(d) {
    var a = typeof d.annee === "number" ? d.annee : parseInt((String(d.date || "").match(/\d{3,4}/) || [])[0], 10);
    return a ? Math.floor((a - 1) / 100) + 1 : null;
  }

  // l'image et ses détails numérotés ; surDetail(i) quand on touche une pastille
  function cadreImage(d, opts) {
    opts = opts || {};
    var cadre = el("div", { class: "doc-cadre" });
    var img = el("img", { src: d.image, alt: d.titre + (d.nature ? " — " + d.nature : ""), loading: "lazy", decoding: "async" });
    cadre.appendChild(img);
    var pastilles = liste(d, "details").map(function (dt, i) {
      var b = el("button", { class: "pastille-detail", type: "button", text: String(i + 1), "aria-label": "Détail " + (i + 1) + " : " + dt.nom });
      b.style.left = dt.x + "%";
      b.style.top = dt.y + "%";
      b.addEventListener("click", function (e) { e.stopPropagation(); if (opts.surDetail) opts.surDetail(i); });
      if (opts.sansPastilles) b.hidden = true;
      cadre.appendChild(b);
      return b;
    });
    return { cadre: cadre, img: img, pastilles: pastilles };
  }
  function creditImage(d) {
    return el("figcaption", { class: "doc-credit" }, [d.source || "", d.credit ? (d.source ? " · " : "") + d.credit : ""].join(""));
  }

  // image en plein écran (pour lire les détails sur un petit écran)
  function agrandir(d) {
    var precedent = document.activeElement;
    var fermer = el("button", { class: "btn-icone fermer", type: "button", "aria-label": "Fermer", icone: "fermer" });
    var c = cadreImage(d, { sansPastilles: false });
    c.cadre.classList.add("plein");
    var voile = el("div", { class: "voile voile-image", role: "dialog", "aria-modal": "true", "aria-label": d.titre }, [fermer, c.cadre, el("p", { class: "petit", text: d.titre })]);
    function close() { document.removeEventListener("keydown", touche, true); voile.remove(); if (precedent && precedent.focus) precedent.focus(); }
    function touche(e) { if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); close(); } }
    fermer.addEventListener("click", close);
    voile.addEventListener("click", function (e) { if (e.target === voile) close(); });
    document.addEventListener("keydown", touche, true);
    document.body.appendChild(voile);
    fermer.focus();
  }

  function vueDocuments(ch, cible) {
    var garder = function (b) { return imagesChapitre(ch, b.id).length > 0; };
    var sous = routeActuelle().sous;
    var demande = sous ? documentParId(ch, sous) : null;
    var filtre = demande ? null : blocDemande(ch, garder);
    var choix = el("div"), zone = el("div");
    cible.appendChild(choix);
    cible.appendChild(zone);

    function dessinerChoix() {
      choix.innerHTML = "";
      var g = selecteurBlocs(ch, filtre, true, garder, function (id) { filtre = id; dessinerChoix(); galerie(); });
      if (g) choix.appendChild(g);
    }
    function adresse(x) { return lienChapitre(ch, "documents") + (x ? "/" + encodeURIComponent(x.id) : ""); }

    function galerie() {
      surToucheVue = null;
      history.replaceState(null, "", adresse(null) + (filtre ? "/" + filtre : ""));
      zone.innerHTML = "";
      choix.hidden = false;
      zone.appendChild(el("p", { class: "consigne-outil", text: "Les documents de tes fiches d'activités. Ouvre-en un pour le présenter, repérer ses détails, puis t'entraîner." }));
      var g = el("div", { class: "docs-galerie" });
      var tous = documentsChapitre(ch, filtre);
      tous.filter(function (x) { return x.d.image; }).concat(tous.filter(function (x) { return !x.d.image; })).forEach(function (x) {
        var d = x.d;
        var meilleur = prog.docs[ch.id + "|" + x.id];
        var carte = el("button", { class: "doc-vignette", type: "button", onclick: function () { ouvrir(x); } }, [
          d.image ? el("img", { src: d.image, alt: "", loading: "lazy", decoding: "async", style: d.vignette ? "object-position:" + d.vignette : null }) : el("span", { class: "doc-texte-icone", "aria-hidden": "true", text: "« »" }),
          el("strong", { text: d.titre }),
          el("span", { class: "petit", text: [d.nature || "Texte", d.date].filter(Boolean).join(" · ") + (x.bloc.id !== "cours" ? " · " + x.bloc.nom : "") }),
          meilleur ? el("span", { class: "doc-score", text: "Meilleur score : " + meilleur.score + " / " + meilleur.sur }) : null
        ]);
        g.appendChild(carte);
      });
      zone.appendChild(g);
    }

    function enTete(x, texte, action) {
      zone.appendChild(el("button", { class: "retour", type: "button", onclick: action || galerie }, [avecIcone("retour", texte || "Tous les documents")]));
      zone.appendChild(el("h2", { class: "titre-ppo", text: x.d.titre }));
      if (x.bloc.id !== "cours") zone.appendChild(el("p", { class: "petit", style: "margin:2px 0 0", text: x.bloc.nom }));
    }

    function ouvrir(x) {
      surToucheVue = null;
      history.replaceState(null, "", adresse(x));
      var d = x.d;
      zone.innerHTML = "";
      choix.hidden = true;
      enTete(x);
      var info = el("div", { class: "detail-info", "aria-live": "polite" });
      var choisi = -1, c = null, lignes = [];
      function montrer(i) {
        if (choisi >= 0) { c.pastilles[choisi].classList.remove("actif"); if (lignes[choisi]) lignes[choisi].classList.remove("actif"); }
        choisi = i;
        c.pastilles[i].classList.add("actif");
        if (lignes[i]) lignes[i].classList.add("actif");
        var dt = d.details[i];
        info.innerHTML = "";
        info.appendChild(el("strong", null, [el("span", { class: "num-rond", text: String(i + 1) }), dt.nom]));
        info.appendChild(el("p", { text: dt.txt }));
      }
      if (d.image) {
        c = cadreImage(d, { surDetail: montrer });
        var fig = el("figure", { class: "doc-figure" }, [c.cadre, creditImage(d)]);
        zone.appendChild(fig);
        var btnNumeros = el("button", { class: "btn", type: "button", "aria-pressed": "false" }, "Masquer les numéros");
        btnNumeros.addEventListener("click", function () {
          var cache = c.cadre.classList.toggle("sans-numeros");
          btnNumeros.textContent = cache ? "Afficher les numéros" : "Masquer les numéros";
          btnNumeros.setAttribute("aria-pressed", String(cache));
        });
        zone.appendChild(el("div", { class: "btns noprint", style: "margin-top:8px" }, [
          el("button", { class: "btn", type: "button", onclick: function () { agrandir(d); } }, "Agrandir l'image"),
          liste(d, "details").length ? btnNumeros : null
        ]));
        if (liste(d, "details").length) {
          info.appendChild(el("p", { class: "k-statut", style: "margin:0", text: "Touche une pastille numérotée pour lire le détail." }));
          zone.appendChild(info);
        }
      } else {
        zone.appendChild(el("figure", { class: "doc" }, [el("blockquote", { text: d.extrait }), el("figcaption", { text: d.source })]));
      }

      zone.appendChild(el("div", { class: "etiq", text: "Présenter le document" }));
      var tab = el("dl", { class: "presentation" });
      [["Nature", d.nature], ["Auteur", d.auteur], ["Date", d.date], ["Source", d.image ? d.source : null]].forEach(function (l) {
        if (!l[1]) return;
        tab.appendChild(el("dt", { text: l[0] }));
        tab.appendChild(el("dd", { text: l[1] }));
      });
      if (d.contexte) { tab.appendChild(el("dt", { text: "Contexte" })); tab.appendChild(el("dd", { text: d.contexte })); }
      zone.appendChild(tab);

      if (d.montre) {
        zone.appendChild(el("div", { class: "etiq", text: "Ce qu'il montre" }));
        zone.appendChild(el("p", { class: "doc-montre carte-panneau", style: "margin:0", text: d.montre }));
      }
      if (d.image && liste(d, "details").length) {
        zone.appendChild(el("div", { class: "etiq", text: "Les détails à repérer" }));
        var ol = el("ol", { class: "reperes details-liste" });
        d.details.forEach(function (dt, i) {
          var li = el("li", { tabindex: "0" }, [el("span", { class: "num-rond", text: String(i + 1) }), el("div", null, [el("strong", { text: dt.nom }), el("br"), dt.txt])]);
          li.addEventListener("click", function () { montrer(i); zone.querySelector(".doc-cadre").scrollIntoView({ block: "nearest", behavior: "smooth" }); });
          li.addEventListener("keydown", function (e) { if (e.key === "Enter") li.click(); });
          ol.appendChild(li);
          lignes.push(li);
        });
        zone.appendChild(ol);
      }
      var questions = questionsDocument(ch, x);
      if (questions.length || (d.image && liste(d, "details").length)) {
        zone.appendChild(el("div", { class: "btns noprint" }, [
          el("button", { class: "btn plein", type: "button", text: "Je m'entraîne sur ce document", onclick: function () { entrainer(x); } }),
          el("button", { class: "btn", type: "button", text: "Tous les documents", onclick: galerie })
        ]));
      }
      window.scrollTo(0, 0);
    }

    // 1. présenter le document (nature, auteur, siècle), puis 2. retrouver ses détails sur l'image
    function entrainer(x) {
      var d = x.d;
      var etapes = questionsDocument(ch, x).map(function (q) { return { type: "q", q: q }; });
      if (d.image) melanger(liste(d, "details").map(function (dt, i) { return i; })).slice(0, 5).forEach(function (i) { etapes.push({ type: "detail", i: i }); });
      var pos = 0, score = 0, repondu = false;
      zone.innerHTML = "";
      enTete(x, "Retour au document", function () { ouvrir(x); });
      var compteur = el("div", { class: "compteur" });
      var corps = el("div");
      zone.appendChild(compteur);
      zone.appendChild(corps);
      window.scrollTo(0, 0);

      function suivant() { pos++; repondu = false; dessiner(); }
      function boutonSuivant() {
        return el("button", { class: "btn plein", type: "button", text: pos === etapes.length - 1 ? "Voir mon score" : "Question suivante", onclick: suivant });
      }
      function dessiner() {
        corps.innerHTML = "";
        if (pos >= etapes.length) { bilan(); return; }
        var barre = el("div", { class: "barre" }, el("span"));
        barre.firstChild.style.width = Math.round(pos / etapes.length * 100) + "%";
        compteur.innerHTML = "";
        compteur.appendChild(el("span", { text: "Question " + (pos + 1) + " sur " + etapes.length + " · " + score + " juste" + (score > 1 ? "s" : "") }));
        compteur.appendChild(barre);
        var e = etapes[pos];
        if (e.type === "q") dessinerQuestion(e.q); else dessinerDetail(e.i);
      }
      function dessinerQuestion(q) {
        if (d.image) {
          var c = cadreImage(d, { sansPastilles: true });
          c.cadre.classList.add("petit-cadre");
          corps.appendChild(c.cadre);
        }
        var panneau = el("div", { class: "carte-panneau", style: "margin-top:12px" });
        panneau.appendChild(el("div", { class: "q-consigne", text: "Présenter le document" }));
        panneau.appendChild(el("div", { class: "q-enonce", text: q.enonce }));
        var opts = el("div", { class: "options", role: "group", "aria-label": "Propositions" });
        q.options.forEach(function (o, i) {
          var b = el("button", { class: "option", type: "button" }, [el("span", { class: "lettre", text: "ABCD"[i] }), el("span", { text: o })]);
          b.addEventListener("click", function () {
            if (repondu) return;
            repondu = true;
            var juste = o === q.bonne;
            if (juste) score++;
            opts.querySelectorAll(".option").forEach(function (x) { x.disabled = true; if (x.lastChild.textContent === q.bonne) x.classList.add("juste"); });
            if (!juste) b.classList.add("faux");
            panneau.appendChild(el("div", { class: "retour-q " + (juste ? "bien" : "mal") }, [el("strong", { text: juste ? "Bonne réponse !" : "Pas tout à fait." }), el("span", { text: q.expl })]));
            var s = boutonSuivant();
            panneau.appendChild(el("div", { class: "btns" }, s));
            annoncer((juste ? "Bonne réponse. " : "Pas tout à fait. ") + q.expl);
            s.focus({ preventScroll: true });
          });
          opts.appendChild(b);
        });
        panneau.appendChild(opts);
        corps.appendChild(panneau);
      }
      function dessinerDetail(i) {
        var dt = d.details[i];
        corps.appendChild(el("div", { class: "k-question" }, [el("span", { class: "q-consigne", text: "Touche sur l'image :" }), el("span", { class: "k-nom", text: dt.nom })]));
        var c = cadreImage(d, { sansPastilles: true });
        corps.appendChild(c.cadre);
        var bas = el("div");
        bas.appendChild(el("p", { class: "k-statut", text: "Touche l'endroit de l'image où se trouve ce détail." }));
        corps.appendChild(bas);
        c.cadre.classList.add("visable");
        c.cadre.addEventListener("click", function (e) {
          if (repondu) return;
          var r = c.img.getBoundingClientRect();
          if (!r.width) return;
          var px = (e.clientX - r.left) / r.width * 100, py = (e.clientY - r.top) / r.height * 100;
          // distance mesurée en % de la largeur, la hauteur ramenée à la même échelle
          var dx = px - dt.x, dy = (py - dt.y) * r.height / r.width;
          var juste = Math.sqrt(dx * dx + dy * dy) <= (dt.r || 9);
          repondu = true;
          if (juste) score++;
          var marque = el("span", { class: "marque-touche" + (juste ? " juste" : "") });
          marque.style.left = px + "%"; marque.style.top = py + "%";
          c.cadre.appendChild(marque);
          var p = c.pastilles[i];
          p.hidden = false;
          p.classList.add(juste ? "trouve" : "vise");
          bas.innerHTML = "";
          bas.appendChild(el("div", { class: "retour-q " + (juste ? "bien" : "mal") }, [el("strong", { text: juste ? "Bien vu !" : "Pas là : le détail est à la pastille orange." }), el("span", { text: dt.txt })]));
          var s = boutonSuivant();
          bas.appendChild(el("div", { class: "btns" }, s));
          annoncer((juste ? "Bien vu ! " : "Pas là. ") + dt.txt);
          s.focus({ preventScroll: true });
        });
      }
      function bilan() {
        compteur.innerHTML = "";
        var cle = ch.id + "|" + x.id;
        var ancien = prog.docs[cle];
        if (!ancien || score / etapes.length > ancien.score / ancien.sur) { prog.docs[cle] = { score: score, sur: etapes.length, t: Date.now() }; sauver(); }
        var msg = score === etapes.length ? "Parfait : tu sais présenter et lire ce document !" : score >= etapes.length * .7 ? "Très bien !" : "Relis la présentation du document et ses détails, puis recommence.";
        var autres = documentsChapitre(ch, null).filter(function (y) { return y.id !== x.id && y.d.image; });
        corps.appendChild(el("div", { class: "bilan carte-panneau" }, [
          el("div", { class: "gros", text: score + " / " + etapes.length }),
          el("p", { text: msg }),
          el("div", { class: "btns" }, [
            el("button", { class: "btn plein", type: "button", text: "Recommencer", onclick: function () { entrainer(x); } }),
            el("button", { class: "btn", type: "button", text: "Revoir le document", onclick: function () { ouvrir(x); } }),
            autres.length ? el("button", { class: "btn", type: "button", text: "Document suivant", onclick: function () {
              var tous = documentsChapitre(ch, null).filter(function (y) { return y.d.image; });
              ouvrir(tous[(tous.map(function (y) { return y.id; }).indexOf(x.id) + 1) % tous.length]);
            } }) : null
          ])
        ]));
        corps.querySelector(".btn").focus({ preventScroll: true });
      }
      dessiner();
    }

    dessinerChoix();
    if (demande) ouvrir(demande); else galerie();
  }

  // Questions de présentation : nature, auteur, siècle — les mauvaises réponses viennent des autres documents
  var NATURES_PIEGES = ["Enluminure (miniature d'un manuscrit)", "Gravure", "Peinture sur bois", "Monnaie", "Sculpture", "Carte", "Mosaïque", "Texte (chronique)"];
  function questionsDocument(ch, x) {
    var d = x.d, qs = [];
    var autres = documentsChapitre(ch, null).filter(function (y) { return y.id !== x.id; }).map(function (y) { return y.d; });
    function quatre(bonne, pieges) {
      var vus = {}; vus[normaliser(bonne)] = true;
      var p = melanger(pieges).filter(function (v) { var k = normaliser(v); if (!v || vus[k]) return false; vus[k] = true; return true; }).slice(0, 3);
      return p.length >= 2 ? melanger([bonne].concat(p)) : null;
    }
    if (d.nature) {
      var o = quatre(d.nature, autres.map(function (a) { return a.nature; }).concat(NATURES_PIEGES));
      if (o) qs.push({ enonce: "Quelle est la nature de ce document ?", options: o, bonne: d.nature, expl: "C'est : " + d.nature.charAt(0).toLowerCase() + d.nature.slice(1) + (d.source ? " (" + d.source + ")." : ".") });
    }
    if (d.auteur) {
      var oa = quatre(d.auteur, autres.map(function (a) { return a.auteur; }));
      if (oa) qs.push({ enonce: "Qui en est l'auteur ?", options: oa, bonne: d.auteur, expl: d.auteur + (d.date ? ", " + d.date : "") + "." });
    }
    // le siècle a du sens pour un document d'histoire, pas pour une photographie récente de géographie
    var s = (x.bloc.data.d || ch.d) === "geo" ? null : siecleDocument(d);
    if (s) {
      var bonneS = nomSiecle(s);
      var os = quatre(bonneS, [s - 2, s - 1, s + 1, s + 2].filter(function (n) { return n > 0 && n <= 21; }).map(nomSiecle));
      if (os) qs.push({ enonce: "De quel siècle date ce document ?", options: os, bonne: bonneS, expl: "Il date de " + d.date + " : " + bonneS + "." });
    }
    return qs;
  }

  // ---------- Graphiques, croquis et intrus (questions de géographie) ----------
  // Champs d'un chapitre ou d'un point de passage, dans cours.js :
  //   graphiques : [{ id, type, titre, source, unite, questions: [{ q, r, faux, expl }] }], selon le type :
  //     "courbes"  : x (années), series [{ nom, valeurs }], ecart (nom de l'écart entre les deux premières courbes)
  //     "barres"   : x (étiquettes), valeurs, projection (rangs des barres qui sont des projections)
  //     "barres-h" : x, valeurs, moyenne (rang de la barre de référence), quoi (« le taux… »), ou (« l'État »), ouPluriel
  //     "pyramide" : pays, ages, hommes, femmes (en % de la population), max, profil ("jeune" | "transition" | "vieillissante")
  //   croquis : [{ id, titre, fond, elements }] ; un élément a un nom et un figuré : zone (polygone en lon, lat, ou liste de
  //     polygones), ellipse ([lon, lat, demi-largeur, demi-hauteur, rotation], ou liste), ligne, points, fleches, fleuves
  //     (les fleuves du fond) ; couleur, motif ("hachures"), forme des points ("rond" | "carre" | "triangle" | "etoile")

  // des questions toutes faites (champ questions : { q, r, faux, expl }) ; les siècles sont calculés

  // ---------- La méthode : fiches méthode et ateliers (développement construit, composition, analyse de document, figurés) ----------

  // ----- les fiches -----

  // ----- le moteur des ateliers : des étapes, chacune une suite d'exercices -----
  function atelier(n, cfg) {
    app.appendChild(lienRetour("#/methode/" + n, titreMethode()));
    app.appendChild(el("div", { class: "chap-entete" }, [el("p", { class: "q-consigne", text: cfg.genre }), el("h1", { text: cfg.titre })]));

      zone.appendChild(el("h2", { class: "met-titre-etape", text: (k + 1) + ". " + e.nom }));
      if (e.aide) zone.appendChild(el("p", { class: "petit", text: e.aide }));

        ])

  function boutonSuite(texte, f) { return el("button", { class: "btn plein met-suite", type: "button", text: texte || "Continuer", onclick: f }); }

  // une suite de QCM : { q, r, faux, expl }
  function suiteQcm(zone, liste, fini) {
    var i = 0, justes = 0;
    var cadre = el("div");
    zone.appendChild(cadre);
    function poser() {
      cadre.innerHTML = "";
      if (i >= liste.length) return fini(justes, liste.length);
      var q = liste[i];
      cadre.appendChild(el("p", { class: "petit", text: "Question " + (i + 1) + " / " + liste.length }));
      cadre.appendChild(el("p", { class: "q-enonce", text: q.q }));
      var opts = el("div", { class: "options" });
      var choix = melanger([q.r].concat(q.faux));
      var boutons = choix.map(function (o, k) {
        var b = el("button", { class: "option", type: "button" }, [el("span", { class: "lettre", text: "ABCDE"[k] }), el("span", { text: o })]);
        b.addEventListener("click", function () {
          boutons.forEach(function (x, m) { x.disabled = true; if (choix[m] === q.r) x.classList.add("juste"); });
          if (o === q.r) justes++; else b.classList.add("faux");
          if (q.expl) cadre.appendChild(el("p", { class: "met-expl " + (o === q.r ? "ok" : "ko") }, [el("strong", { text: o === q.r ? "Oui. " : "Non. " }), q.expl]));
          cadre.appendChild(boutonSuite(i + 1 < liste.length ? "Question suivante" : "Étape suivante", function () { i++; poser(); }));
        });
        return b;
      });
      boutons.forEach(function (b) { opts.appendChild(b); });
      cadre.appendChild(opts);
    }
    poser();
  }

  // vrai ou faux : { a (affirmation), vrai, expl }
  function suiteVraiFaux(zone, liste, fini) {
    var i = 0, justes = 0;
    var cadre = el("div");
    zone.appendChild(cadre);
    function poser() {
      cadre.innerHTML = "";
      if (i >= liste.length) return fini(justes, liste.length);
      var q = liste[i];
      cadre.appendChild(el("p", { class: "petit", text: "Affirmation " + (i + 1) + " / " + liste.length }));
      cadre.appendChild(el("p", { class: "q-enonce", text: q.a }));
      var opts = el("div", { class: "met-vf" });
      var bv = el("button", { class: "option", type: "button", text: "Vrai" }), bf = el("button", { class: "option", type: "button", text: "Faux" });
      [[bv, true], [bf, false]].forEach(function (x) {
        x[0].addEventListener("click", function () {
          bv.disabled = bf.disabled = true;

  // ranger des éléments dans des parties : items [{ t, i (rang de la bonne partie), expl? }], parties [titres]

  // ---------- Le duo : réviser à deux sur le même téléphone, chacun son tour ----------
  // Les questions sont celles du mode aventure (chapitres ouverts de la classe) ; rien n'est enregistré dans la progression.
  var CLE_DUO = "reviser-duo-v1";
  var COULEURS_DUO = ["#3B82F6", "#EF4444"];
  var duo = null; // la partie en cours : { niveau, ids, nb, joueurs, questions, pos, tour, enCours }
  function chapitresDuo(n) {
    return (estProf() ? tousChapitresNiveau(n) : chapitresDansLOrdre(n)).filter(function (c) { return poolChapitre(c).length >= 4; });
  }
  function questionsDuo(n, ids, nb) {
    var diff = DIFFICULTES[n] || DIFFICULTES["2nde"];
    var pool = [];
    ids.map(chapitre).filter(Boolean).forEach(function (c) { pool = pool.concat(poolChapitre(c)); });
    pool = pool.filter(function (q) { return q.type !== "paires"; });
    var qs = [];
    // assez de questions pour la partie, même si un tirage en donne moins que demandé
    for (var essai = 0; essai < 4 && qs.length < nb; essai++) qs = qs.concat(composer(pool, nb - qs.length, diff));
    return qs.slice(0, nb);
  }
  function vueDuo(n) {
    document.title = "Duo — " + nomNiveau(n);
    if (duo && duo.niveau === n && duo.enCours) { vueDuoJeu(); return; }
    vueDuoReglages(n);
  }
  function nouvellePartieDuo(n, ids, noms, nb, premier) {
    var qs = questionsDuo(n, ids, nb * 2);
    if (qs.length < nb * 2) return null;
    return { niveau: n, ids: ids, nb: nb, questions: qs, pos: 0, tour: premier || 0, premier: premier || 0, enCours: true,
      joueurs: noms.map(function (nom, j) { return { nom: nom, c: COULEURS_DUO[j], score: 0, resultats: [] }; }) };
  }
  function vueDuoReglages(n) {
    duo = null;
    var r = lire(CLE_DUO, {}) || {};
    var noms = Array.isArray(r.noms) && r.noms.length === 2 ? r.noms.slice() : ["Joueur 1", "Joueur 2"];
    var nb = [5, 8, 10].indexOf(r.nb) >= 0 ? r.nb : 5;
    var chaps = chapitresDuo(n);
    var choisis = (r.niveau === n && Array.isArray(r.chapitres) ? r.chapitres : chaps.map(function (c) { return c.id; }))
      .filter(function (id) { return chaps.some(function (c) { return c.id === id; }); });
    if (!choisis.length) choisis = chaps.map(function (c) { return c.id; });
    var ecran = ecranAventure("av-nuit duo");
    var lien = el("a", { class: "av-btn-rond", href: "#/niveau/" + n, "aria-label": "Retour" });
    lien.innerHTML = icone("retour");
    ecran.appendChild(el("div", { class: "av-haut" }, [lien, el("strong", { class: "av-haut-titre", text: "Duo" }), boutonSon()]));
    var corps = el("div", { class: "av-page dc-reglages" });
    ecran.appendChild(corps);
    corps.appendChild(guideBulle({ d: "histoire" }, [el("p", { text: "Révisez à deux sur le même téléphone : chacun son tour, le téléphone passe de main en main. Celui ou celle qui a le plus de bonnes réponses gagne !" })]));
    var zone = el("div");
    corps.appendChild(zone);
    function dessiner() {
      zone.innerHTML = "";

      chaps.forEach(function (c) {
        var b = el("button", { class: "av-chap-choix", type: "button", "aria-pressed": String(choisis.indexOf(c.id) >= 0) }, [el("small", { text: c.num + " · " + DISC[c.d] }), el("span", { text: c.titre })]);
        b.addEventListener("click", function () { var i = choisis.indexOf(c.id); if (i >= 0) choisis.splice(i, 1); else choisis.push(c.id); dessiner(); });
        lc.appendChild(b);
      });
      var champs = el("div", { class: "dc-noms" });
      [0, 1].forEach(function (j) {
        var champ = el("input", { class: "dc-nom-champ", type: "text", maxlength: "16", value: noms[j], "aria-label": "Prénom du joueur " + (j + 1) });
        champ.style.setProperty("--c", COULEURS_DUO[j]);

        champ.addEventListener("input", function () { noms[j] = champ.value.trim() || "Joueur " + (j + 1); });

      else if (e.key === "ArrowRight" && revele) suivante();
      else if (k === "m") lancerMinuteur();
      else if (k === "i") indiceSuivant();
      else if (k === "f") pleinEcran();
    };
    afficher();
  }
  function vueDefiFin() {
    var d = defiClasse;
    app.innerHTML = "";
    surToucheVue = null;
    var ecran = ecranAventure("av-nuit defi-classe dc-jeu");
    var lien = el("a", { class: "av-btn-rond", href: estProf() ? "#/prof" : "#/niveau/" + d.niveau, "aria-label": "Retour" });
    lien.innerHTML = icone("retour");
    ecran.appendChild(el("div", { class: "av-haut" }, [lien, el("strong", { class: "av-haut-titre", text: "Classement" }), boutonPleinEcran()]));
    var tri = d.equipes.slice().sort(function (a, b) { return b.score - a.score; });
    var podium = el("div", { class: "dc-podium" });
    var rang = 0;
    tri.forEach(function (e, i) {
      if (i === 0 || e.score < tri[i - 1].score) rang = i + 1;
      var marche = el("div", { class: "dc-marche r" + rang }, [el("span", { class: "dc-rang", text: rang === 1 ? "1er" : rang + "e" }), el("strong", { text: e.nom }), el("span", { class: "dc-points", text: pluriel(e.score, "point") })]);
      marche.style.setProperty("--c", e.c);
      podium.appendChild(marche);
    });
    var premiers = tri.filter(function (e) { return e.score === tri[0].score; });
    var rejouer = el("button", { class: "jeu-valider", type: "button", text: "Rejouer avec d'autres questions" });
    rejouer.addEventListener("click", function () {
      d.questions = questionsDefi(d.niveau, d.ids, d.questions.length);
      d.pos = 0; d.enCours = true;
      d.equipes.forEach(function (e) { e.score = 0; });
      vueDefiJeu();
    });
    var regler = el("a", { class: "jeu-secondaire", href: "#/defi/" + d.niveau + "/" + d.ids.join(","), text: "Changer les réglages" });
    ajouter(ecran, [el("div", { class: "dc-fin" }, [
      el("h2", { class: "dc-consigne", text: premiers.length > 1 ? "Égalité : " + premiers.map(function (e) { return e.nom; }).join(" et ") + " !" : "Victoire de " + premiers[0].nom + " !" }),
      podium, el("div", { class: "dc-boutons fin" }, [rejouer, regler])
    ])]);
    son("fin");
    confettis(ecran);
  }

  // ---------- Espace professeur : choisir les chapitres que voient les élèves ----------
  // Le réglage est publié dans rituels/activation.json, sur GitHub, avec un jeton personnel
  // que le professeur colle une fois sur son appareil. Sans jeton, on ne peut rien publier.
  var FICHIER_VISIBLES = "rituels/activation.json";
  var DEPOT = (function () {
    var m = /^([^.]+)\.github\.io$/.exec(location.hostname);
    var racine = location.pathname.split("/").filter(Boolean)[0];
    return m && racine ? { owner: m[1], repo: racine } : { owner: "loannlegaillard42", repo: "Cahier-de-progression" };
  })();
  var brouillon = null;   // chapitres visibles en cours de réglage, pas encore publiés
  var brouillonAventure = null; // classes où le mode aventure est ouvert, en cours de réglage
  var classeProf = null;
  var messageProf = null; // { ok: true|false, texte }

  function jeton() { var p = lire(CLE_PROF, null); return p && p.token ? p.token : null; }
  function estProf() { return !!jeton(); }
  function estPublie(id) { return !Array.isArray(visibles) || visibles.indexOf(id) >= 0; }
  function enTetesGitHub(t) {
    return { "Authorization": "Bearer " + t, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
  }
  function urlDepot() { return "https://api.github.com/repos/" + DEPOT.owner + "/" + DEPOT.repo; }
  function messageErreurGitHub(statut, detail) {
    if (statut === 0) return "GitHub est injoignable : vérifiez la connexion, puis recommencez.";
    if (statut === 401) return "GitHub refuse ce jeton : il est peut-être expiré ou mal copié.";
    if (statut === 403) return "Ce jeton n'a pas le droit de modifier le site : donnez-lui la permission « Contents » en lecture et écriture.";
    if (statut === 404) return "Ce jeton n'a pas accès au dépôt " + DEPOT.repo + " : sélectionnez-le dans « Repository access ».";
    if (statut === 409 || statut === 422) return "Le réglage a été publié entre-temps depuis un autre appareil : rechargez la page, puis recommencez.";
    return "GitHub a répondu : " + (detail || "erreur " + statut) + ".";
  }
  function appelGitHub(url, options) {
    return fetch(url, options).then(function (r) {
      if (r.ok) return r.json();
      return r.json().catch(function () { return {}; }).then(function (j) {
        var e = new Error(messageErreurGitHub(r.status, j.message));
        e.statut = r.status;
        throw e;
      });
    }, function () {
      var e = new Error(messageErreurGitHub(0));
      e.statut = 0;
      throw e;
    });
  }
  function publierVisibles(t, ids, aventure) {
    var url = urlDepot() + "/contents/" + FICHIER_VISIBLES;
    var h = enTetesGitHub(t);
    return appelGitHub(url + "?ref=main", { headers: h, cache: "no-store" }).catch(function (e) {
      if (e.statut === 404) return null; // le fichier n'existe pas encore : on le crée
      throw e;
    }).then(function (actuel) {
      var contenu = JSON.stringify({ visibles: ids, aventure: aventure, modifie: new Date().toISOString() }, null, 2) + "\n";
      var corps = {
        message: "Espace professeur : chapitres visibles et mode aventure",
        content: btoa(unescape(encodeURIComponent(contenu))),
        branch: "main"
      };
      if (actuel && actuel.sha) corps.sha = actuel.sha;
      return appelGitHub(url, { method: "PUT", headers: h, body: JSON.stringify(corps) });
    });
  }

  function vueProf() {
    document.title = "Espace professeur — Réviser";
    if (!brouillon) brouillon = CHAPITRES.filter(function (c) { return estPublie(c.id); }).map(function (c) { return c.id; });
    if (!brouillonAventure) brouillonAventure = (classesAventure || []).slice();
    if (!classeProf) classeProf = prog.niveau && NIVEAUX.some(function (n) { return n.id === prog.niveau; }) ? prog.niveau : NIVEAUX[0].id;

    app.appendChild(lienRetour("#/", "Retour à la boîte à outils"));
    if (!estProf()) {
      // un élève qui tombe sur cette adresse ne voit que la connexion, réservée au compte GitHub du site
      app.appendChild(el("div", { class: "chap-entete" }, [
        el("h1", { text: "Espace professeur" }),
        el("p", { class: "consigne-outil", text: "Cet espace est réservé au professeur. Élève ? Retourne à la boîte à outils pour réviser." })
      ]));
      if (messageProf) app.appendChild(el("div", { class: "alerte" + (messageProf.ok ? " ok" : ""), role: "status" }, messageProf.texte));
      app.appendChild(blocConnexion());
      return;
    }
    app.appendChild(el("div", { class: "chap-entete" }, [
      el("h1", { text: "Espace professeur" }),
      el("p", { class: "consigne-outil", text: "Choisissez les chapitres que les élèves voient. Un chapitre masqué s'affiche « à venir » : il peut être préparé à l'avance et ouvert le moment venu." })
    ]));
    if (messageProf) app.appendChild(el("div", { class: "alerte" + (messageProf.ok ? " ok" : ""), role: "status" }, messageProf.texte));
    app.appendChild(blocConnexion());

    app.appendChild(el("a", { class: "lien-defi", href: "#/defi/" + classeProf }, [el("strong", { text: "Défi de classe à projeter" }), " : questions des chapitres, par équipes, avec minuteur et classement"]));
    app.appendChild(blocCartesProf());
    app.appendChild(el("div", { class: "etiq", text: "Classe" }));
    var choix = el("div", { class: "choix", role: "group", "aria-label": "Classe" });
    NIVEAUX.forEach(function (n) {
      choix.appendChild(el("button", { class: "opt", type: "button", text: n.nom, "aria-pressed": String(n.id === classeProf), onclick: function () {
        classeProf = n.id; messageProf = null; rendre();
      } }));
    });
    app.appendChild(choix);
    app.appendChild(ligneAventureProf(classeProf));

    var classe = PLAN.filter(function (c) { return c.id === classeProf; })[0];
    var annee = classe && Array.isArray(classe.annee) ? classe.annee : [];
    ["histoire", "geo"].forEach(function (d) {
      var themes = annee.filter(function (t) { return t.d === d; });
      var fiches = tousChapitresNiveau(classeProf).filter(function (c) { return c.d === d; });
      if (!themes.length && !fiches.length) return;
      app.appendChild(el("div", { class: "etiq", text: DISC[d] }));
      var placees = {};
      themes.forEach(function (t) {
        app.appendChild(el("div", { class: "theme-titre", text: t.theme }));
        liste(t, "chapitres").forEach(function (c) {
          var ch = c.fiche ? chapitre(c.fiche) : null;
          if (ch && ch.n === classeProf) { placees[ch.id] = true; app.appendChild(ligneProf(ch)); }
          else app.appendChild(el("div", { class: "ligne-prof sans-fiche" }, el("div", { class: "lp-txt" }, [
            el("span", { class: "chap-num", text: c.num + " · fiche à préparer" }),
            el("span", { class: "lp-titre", text: c.titre })
          ])));
        });
      });
      var horsPlan = fiches.filter(function (c) { return !placees[c.id]; });
      if (horsPlan.length && themes.length) app.appendChild(el("div", { class: "theme-titre", text: "Autres fiches" }));
      horsPlan.forEach(function (ch) { app.appendChild(ligneProf(ch)); });
    });

    var changements = CHAPITRES.filter(function (c) { return (brouillon.indexOf(c.id) >= 0) !== estPublie(c.id); }).length +
      NIVEAUX.filter(function (n) { return (brouillonAventure.indexOf(n.id) >= 0) !== aventureOuvertePour(n.id); }).length;
    var btnPublier = el("button", { class: "btn plein", type: "button", text: "Publier", disabled: !changements || !estProf() });
    btnPublier.addEventListener("click", function () {
      btnPublier.disabled = true;
      btnPublier.textContent = "Publication…";
      var ids = CHAPITRES.map(function (c) { return c.id; }).filter(function (id) { return brouillon.indexOf(id) >= 0; });
      var classes = NIVEAUX.map(function (n) { return n.id; }).filter(function (id) { return brouillonAventure.indexOf(id) >= 0; });
      publierVisibles(jeton(), ids, classes).then(function () {
        visibles = ids.slice();
        classesAventure = classes.slice();
        ecrire(CLE_VISIBLES, visibles);
        ecrire(CLE_AV_CLASSES, classesAventure);
        brouillon = null;
        brouillonAventure = null;
        var h = new Date();
        messageProf = { ok: true, texte: "Publié à " + h.getHours() + " h " + String(h.getMinutes()).padStart(2, "0") + ". Les élèves verront le changement d'ici une à deux minutes, en rechargeant la page." };
        rendre();
        window.scrollTo(0, 0);
      }, function (e) {
        messageProf = { ok: false, texte: e.message };
        rendre();
        window.scrollTo(0, 0);
      });
    });
    app.appendChild(el("div", { class: "barre-publier" }, [
      el("span", { text: !estProf() ? "Connectez GitHub pour publier" : changements ? pluriel(changements, "changement") + " à publier" : "Tout est publié" }),
      el("div", { class: "btns" }, [
        changements ? el("button", { class: "btn", type: "button", text: "Annuler", onclick: function () { brouillon = null; brouillonAventure = null; messageProf = null; rendre(); } }) : null,
        btnPublier
      ])
    ]));
  }

  function aventureOuvertePour(n) { return Array.isArray(classesAventure) && classesAventure.indexOf(n) >= 0; }
  // le mode aventure de la classe : ouvert ou non aux élèves (chapitres ouverts, parcours de l'année, repères fondamentaux)
  function ligneAventureProf(n) {
    var ouvert = brouillonAventure.indexOf(n) >= 0;
    var modifie = ouvert !== aventureOuvertePour(n);
    var inter = el("button", {
      class: "interrupteur", type: "button", role: "switch", "aria-checked": String(ouvert),
      "aria-label": "Mode aventure ouvert aux élèves de " + nomNiveau(n), "data-id": "aventure-" + n
    }, [el("span", { class: "piste" }, el("span", { class: "curseur" })), el("span", { class: "etat", text: ouvert ? "Ouvert" : "Fermé" })]);
    inter.addEventListener("click", function () {
      if (ouvert) brouillonAventure = brouillonAventure.filter(function (x) { return x !== n; });
      else brouillonAventure.push(n);
      messageProf = null;
      var y = window.scrollY;
      rendre();
      window.scrollTo(0, y);
      var meme = app.querySelector('.interrupteur[data-id="aventure-' + n + '"]');
      if (meme) meme.focus();
    });
    var fig = el("span", { class: "lp-ile", "aria-hidden": "true" });
    fig.innerHTML = svgIle(0, ["temple", "arbre"]);
    return el("div", { class: "ligne-prof ligne-aventure" + (ouvert ? "" : " masquee") }, [
      fig,
      el("div", { class: "lp-txt" }, [
        el("span", { class: "chap-num" + (modifie ? " modifie" : ""), text: "Mode aventure · " + nomNiveau(n) + (modifie ? " · pas encore publié" : "") }),
        el("span", { class: "lp-titre", text: ouvert ? "Ouvert aux élèves de la classe" : "Fermé aux élèves (vous seul le voyez)" }),
        el("span", { class: "lp-aide", text: "Sur chaque chapitre ouvert, plus le parcours de l'année et les repères fondamentaux. La progression reste sur le téléphone de l'élève." }),
        el("a", { class: "lien-discret", href: "#/niveau/" + n, text: "Voir l'accueil de la classe" })
      ]),
      inter
    ]);
  }

  function ligneProf(ch) {
    var visible = brouillon.indexOf(ch.id) >= 0;
    var modifie = visible !== estPublie(ch.id);
    var inter = el("button", {
      class: "interrupteur", type: "button", role: "switch", "aria-checked": String(visible),
      "aria-label": "Visible par les élèves : " + ch.titre, "data-id": ch.id
    }, [el("span", { class: "piste" }, el("span", { class: "curseur" })), el("span", { class: "etat", text: visible ? "Visible" : "Masqué" })]);
    inter.addEventListener("click", function () {
      if (visible) brouillon = brouillon.filter(function (id) { return id !== ch.id; });
      else brouillon.push(ch.id);
      messageProf = null;
      var y = window.scrollY;
      rendre();
      window.scrollTo(0, y);
      var meme = app.querySelector('.interrupteur[data-id="' + ch.id + '"]');
      if (meme) meme.focus();
    });
    return el("div", { class: "ligne-prof" + (visible ? "" : " masquee") }, [
      el("div", { class: "lp-txt" }, [
        el("span", { class: "chap-num" + (modifie ? " modifie" : ""), text: ch.num + (modifie ? " · pas encore publié" : "") }),
        el("span", { class: "lp-titre", text: ch.titre }),
        el("a", { class: "lien-discret", href: lienChapitre(ch), text: "Aperçu de la fiche" })
      ]),
      inter
    ]);
  }

  function blocConnexion() {
    var bloc = el("div", { class: "carte-panneau", style: "margin-top:14px" });
    if (estProf()) {
      bloc.appendChild(el("p", { style: "margin:0" }, [el("strong", { text: "GitHub est connecté sur cet appareil." }), " Vous pouvez publier, et ouvrir l'aperçu des chapitres masqués."]));
      bloc.appendChild(el("div", { class: "btns" }, el("button", { class: "btn", type: "button", text: "Déconnecter cet appareil", onclick: function () {
        if (!confirm("Retirer le jeton GitHub de cet appareil ? Il faudra le coller à nouveau pour publier.")) return;
        try { localStorage.removeItem(CLE_PROF); } catch (e) {}
        messageProf = null;
        rendre();
      } })));
      return bloc;
    }
    bloc.appendChild(el("h2", { text: "Connecter GitHub, une fois par appareil" }));
    bloc.appendChild(el("p", { class: "petit", style: "margin:6px 0 0", text: "Pour publier, l'application a besoin d'un jeton GitHub qui l'autorise à modifier ce site. Il reste sur cet appareil et peut être supprimé à tout moment sur GitHub." }));
    var lienJeton = el("a", { href: "https://github.com/settings/personal-access-tokens/new", target: "_blank", rel: "noopener", text: "la page de création de jeton" });
    var etapes = el("ol", { class: "etapes" });
    [
      ["Sur GitHub, ouvrez ", lienJeton, " (jeton « fine-grained »)."],
      ["Nom : « Boîte à outils » ; expiration : la fin de l'année scolaire."],
      ["Repository access : « Only select repositories », puis " + DEPOT.repo + "."],
      ["Permissions, Repository permissions, Contents : « Read and write »."],
      ["Cliquez sur « Generate token », copiez le jeton et collez-le ici."]
    ].forEach(function (e) { etapes.appendChild(el("li", null, e)); });
    bloc.appendChild(etapes);
    var champ = el("input", { class: "champ", type: "password", autocomplete: "off", spellcheck: "false", placeholder: "github_pat_…", "aria-label": "Jeton GitHub" });
    var btn = el("button", { class: "btn plein", type: "button", text: "Enregistrer" });
    var retour = el("p", { class: "petit", role: "status", style: "margin:8px 0 0" });
    function enregistrer() {
      var t = champ.value.trim();
      if (!t) { champ.focus(); return; }
      btn.disabled = true;
      retour.textContent = "Vérification auprès de GitHub…";
      appelGitHub(urlDepot(), { headers: enTetesGitHub(t), cache: "no-store" }).then(function (depot) {
        if (depot && depot.permissions && depot.permissions.push === false) {
          var e = new Error(messageErreurGitHub(403));
          e.statut = 403;
          throw e;
        }
        ecrire(CLE_PROF, { token: t });
        messageProf = { ok: true, texte: "Jeton enregistré sur cet appareil. Vous pouvez publier." };
        rendre();
      }).catch(function (e) {
        btn.disabled = false;
        retour.textContent = e.message;
      });
    }
    btn.addEventListener("click", enregistrer);
    champ.addEventListener("keydown", function (e) { if (e.key === "Enter") enregistrer(); });
    bloc.appendChild(el("div", { class: "ligne-champ" }, [champ, btn]));
    bloc.appendChild(retour);
    return bloc;
  }

  // ---------- Hors connexion : le service worker de la boîte à outils (rituels/sw.js) garde la page et les fiches ----------
  // (sur le site en https ; ?sw dans l'adresse l'active aussi en local, pour le tester)
  if ("serviceWorker" in navigator && (location.protocol === "https:" || /[?&]sw(=|&|$)/.test(location.search))) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }

  // ---------- Démarrage : lire la liste des chapitres ouverts, puis afficher ----------
  function chargerVisibles() {
    return fetch("activation.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("activation.json : " + r.status);
      return r.json();
    }).then(function (j) {
      if (!j || !Array.isArray(j.visibles)) return false;
      var classes = Array.isArray(j.aventure) ? j.aventure : [];
      var change = JSON.stringify(j.visibles) !== JSON.stringify(visibles) || JSON.stringify(classes) !== JSON.stringify(classesAventure);
      visibles = j.visibles;
      classesAventure = classes;
      ecrire(CLE_VISIBLES, visibles);
      ecrire(CLE_AV_CLASSES, classesAventure);
      return change;
    });
  }
  // la liste a changé depuis le dernier passage : on rafraîchit, sans interrompre un exercice en cours
  function rafraichirApresChargement() {
    var r = routeActuelle();
    if (["prof", "express", "aventure", "sauvegarde", "controle", "defi"].indexOf(r.vue) >= 0) return;
    if (r.vue === "outil") {
      var ch = chapitre(r.ch);
      if (!ch || estVisible(ch) || estProf()) return;
    }
    rendre();
  }
  if (Array.isArray(visibles)) {
    rendre();
    chargerVisibles().then(function (change) { if (change) rafraichirApresChargement(); }, function () {});
  } else {
    // première visite : on attend la liste (4 s au plus) pour ne pas montrer un chapitre pas encore ouvert
    app.appendChild(el("p", { class: "vide", text: "Chargement…" }));
    var demarre = false;
    var secours = setTimeout(function () { demarre = true; rendre(); }, 4000);
    chargerVisibles().catch(function () {}).then(function () {
      if (demarre) { rafraichirApresChargement(); return; }
      clearTimeout(secours);
      demarre = true;
      rendre();
    });
  }
})();
