<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1F4A">
<title>Le passage 3D · Réviser</title>
<link rel="icon" href="../icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap');
  /* Le passage en 3D (version test) : le personnage se dirige au joystick ou au clavier,
     d'île en île ; à chaque point de passage, il saute sur la plateforme de la bonne réponse.
     Page à part : elle lit les fiches (cours.js) et le personnage de l'élève, sans rien modifier de sa progression. */
  :root {
    --nuit: #1C1F4A; --nuit2: #14173F; --carte: #2A2E6B; --bord: #3B4090; --texte: #EDEBFF; --doux: #C9C6F2;
    --violet: #6C4CF1; --violet2: #8B6CFF; --or: #FFC83D; --coeur: #FF5A6E; --vert: #3FCF7A; --rouge: #FF6B6B;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: Inter, system-ui, sans-serif; color: var(--texte); font-size: 15px; line-height: 1.4;
    background: linear-gradient(180deg, #EEF3FF 0%, #D5E0FA 55%, #C3D2F5 100%);
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  [hidden] { display: none !important; }

  /* ----- en haut : quitter, étapes, ducats, cœurs ----- */
  #haut { position: fixed; left: 0; right: 0; top: 0; padding: calc(10px + env(safe-area-inset-top)) 12px 0; display: flex; align-items: center; gap: 10px; pointer-events: none; }
  #haut > * { pointer-events: auto; }
  .rond { flex: none; width: 44px; height: 44px; border-radius: 14px; border: 0; background: var(--nuit); box-shadow: 0 4px 0 var(--nuit2); display: grid; place-items: center; color: #fff; }
  .rond svg { width: 20px; height: 20px; }
  #etapes { flex: 1; display: flex; justify-content: center; gap: 6px; }
  #etapes i { width: 16px; height: 16px; border-radius: 50%; background: rgba(28, 31, 74, .35); border: 2px solid rgba(255, 255, 255, .7); }
  #etapes i.fait { background: var(--or); border-color: #fff; }
  #etapes i.ici { background: #fff; border-color: var(--violet); box-shadow: 0 0 0 3px rgba(108, 76, 241, .35); }
  .pastille { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px 0 8px; border-radius: 17px; background: var(--nuit); box-shadow: 0 3px 0 var(--nuit2); font-weight: 800; color: #fff; }
  .piece { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #FFE58A, #F2B21B 70%); box-shadow: inset 0 -2px 0 #C98A0B; display: inline-block; }
  #coeurs { display: inline-flex; gap: 2px; }
  #coeurs svg { width: 24px; height: 24px; }

  /* ----- la question ----- */
  #carte {
    position: fixed; left: 12px; right: 12px; top: calc(64px + env(safe-area-inset-top)); max-width: 560px; margin: 0 auto;
    background: rgba(28, 31, 74, .94); border-radius: 20px; padding: 12px 14px 12px; box-shadow: 0 5px 0 var(--nuit2);
    max-height: 46vh; overflow: auto; touch-action: pan-y;
  }
  #carte .surtitre { font-size: 12px; font-weight: 700; color: var(--or); text-transform: uppercase; letter-spacing: .06em; }
  #carte h2 { font-size: 17px; margin: 2px 0 2px; font-weight: 800; }
  #carte p { margin: 0 0 8px; font-weight: 600; font-size: 14px; color: var(--doux); }
  .reps { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .reps.long { grid-template-columns: 1fr; }
  .rep { display: flex; align-items: center; gap: 8px; text-align: left; background: var(--carte); border: 2px solid var(--bord); border-radius: 12px; padding: 7px 9px; font-weight: 600; font-size: 14px; color: #fff; }
  .rep i, .lettre { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--violet); display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 13px; color: #fff; }
  .rep.bien { border-color: var(--vert); } .rep.bien i { background: var(--vert); }
  .rep.mal { border-color: var(--rouge); } .rep.mal i { background: var(--rouge); }
  .astuce { margin: 8px 0 0; font-size: 12px; color: var(--doux); font-weight: 600; }
  #carte.ok { box-shadow: 0 5px 0 #1E8C4C, inset 0 0 0 2px var(--vert); }
  #carte.ko { box-shadow: 0 5px 0 #C23636, inset 0 0 0 2px var(--rouge); }
  .verdict { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 800; margin-bottom: 4px; }
  .verdict svg { width: 30px; height: 30px; flex: none; }
  .ok .verdict { color: var(--vert); } .ko .verdict { color: var(--rouge); }
  .correction { font-size: 14px; font-weight: 600; margin: 0 0 4px; }
  .correction b { color: #fff; }
  .bouton { display: block; width: 100%; margin-top: 10px; border: 0; border-radius: 16px; padding: 13px 16px; font-weight: 800; font-size: 17px; color: #fff; background: var(--violet); box-shadow: 0 5px 0 #4A2FC4; text-align: center; text-decoration: none; }
  .bouton.rouge { background: #EF4444; box-shadow: 0 5px 0 #B91C1C; }
  .bouton:active { transform: translateY(3px); box-shadow: 0 2px 0 #4A2FC4; }
  .lien { display: block; text-align: center; margin-top: 14px; color: #fff; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; background: none; border: 0; width: 100%; }

  /* ----- bulle d'information ----- */
  #bulle { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); background: rgba(28, 31, 74, .88); color: #fff; padding: 9px 16px; border-radius: 16px; font-weight: 800; font-size: 16px; pointer-events: none; text-align: center; max-width: 86vw; animation: bulle .25s ease-out; }
  @keyframes bulle { from { transform: translate(-50%, -30%); opacity: 0; } }

  /* ----- commandes tactiles ----- */
  #joy { position: fixed; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%; background: rgba(28, 31, 74, .22); border: 3px solid rgba(255, 255, 255, .75); pointer-events: none; transition: opacity .2s; }
  #joy.repos { opacity: .55; }
  #manche { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px; border-radius: 50%; background: rgba(255, 255, 255, .95); box-shadow: 0 4px 0 rgba(28, 31, 74, .35); }
  #saut { position: fixed; right: 18px; bottom: calc(26px + env(safe-area-inset-bottom)); width: 88px; height: 88px; border-radius: 50%; border: 0; background: var(--violet); color: #fff; box-shadow: 0 6px 0 #4A2FC4; font-weight: 800; font-size: 13px; display: grid; place-items: center; gap: 0; padding-top: 6px; }
  #saut svg { width: 30px; height: 30px; margin-bottom: -6px; }
  #saut:active, #saut.appui { transform: translateY(4px); box-shadow: 0 2px 0 #4A2FC4; }
  #aide { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: rgba(28, 31, 74, .8); color: #fff; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 12px; white-space: nowrap; pointer-events: none; }
  #aide kbd { font: 800 12px Inter, sans-serif; background: #fff; color: var(--nuit); border-radius: 5px; padding: 1px 6px; margin: 0 1px; }

  /* ----- écrans d'accueil et de fin ----- */
  .ecran { position: fixed; inset: 0; overflow: auto; touch-action: pan-y; background: radial-gradient(120% 80% at 50% 0%, #2B2F78 0%, var(--nuit) 60%); padding: calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); }
  .ecran .boite { max-width: 520px; margin: 0 auto; }
  .badge { display: inline-block; background: var(--or); color: var(--nuit); font-weight: 800; font-size: 12px; padding: 3px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: .05em; }
  .ecran h1 { font-size: 30px; line-height: 1.1; margin: 10px 0 6px; font-weight: 800; letter-spacing: -.02em; }
  .ecran .intro { color: var(--doux); font-weight: 600; margin: 0 0 14px; }
  .illu { display: block; width: 100%; max-width: 360px; margin: 4px auto 10px; }
  .regles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 18px; }
  .regle { background: var(--carte); border-radius: 16px; padding: 10px 8px; text-align: center; font-size: 12.5px; font-weight: 700; line-height: 1.25; }
  .regle svg { display: block; width: 40px; height: 40px; margin: 0 auto 6px; }
  .champ { margin: 0 0 14px; }
  .champ > b { display: block; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--doux); margin-bottom: 6px; }
  .segments { display: flex; flex-wrap: wrap; gap: 6px; }
  .segments button, .liste button { border: 2px solid var(--bord); background: var(--carte); border-radius: 12px; padding: 8px 14px; font-weight: 700; }
  .segments button[aria-pressed="true"], .liste button[aria-pressed="true"] { border-color: var(--violet2); background: #3A2F8F; box-shadow: 0 0 0 3px rgba(139, 108, 255, .3); }
  .liste { display: grid; gap: 6px; }
  .liste button { text-align: left; display: flex; gap: 10px; align-items: baseline; }
  .liste button small { color: var(--doux); font-weight: 600; flex: none; min-width: 26px; }
  .liste.chapitres button { flex-direction: column; gap: 0; align-items: flex-start; }
  .liste.chapitres button small { font-size: 12px; }
  .liste button:disabled { opacity: .45; cursor: default; }
  .vide { color: var(--doux); font-weight: 600; }
  #fin { background: linear-gradient(180deg, rgba(28, 31, 74, 0) 0%, rgba(28, 31, 74, 0) 36%, rgba(28, 31, 74, .96) 55%); display: flex; flex-direction: column; justify-content: flex-end; }
  #fin.echec { background: radial-gradient(120% 80% at 50% 0%, #2B2F78 0%, var(--nuit) 60%); justify-content: flex-start; }
  #fin h1 { text-align: center; }
  .stats { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin: 6px 0 14px; }
  .stats span { display: inline-flex; align-items: center; gap: 6px; background: var(--carte); border-radius: 999px; padding: 7px 14px; font-weight: 800; }
  .revoir { background: var(--carte); border-radius: 16px; padding: 10px 14px; margin: 0 0 6px; }
  .revoir h2 { font-size: 15px; margin: 0 0 6px; }
  .revoir li { margin: 0 0 6px; font-size: 14px; color: var(--doux); font-weight: 600; }
  .revoir li b { color: #fff; }
  .revoir ul { margin: 0; padding-left: 18px; }
  .erreur3d { background: var(--carte); border-radius: 16px; padding: 14px; font-weight: 600; }
  @media (max-width: 380px) { .ecran h1 { font-size: 26px; } .regle { font-size: 11.5px; } }
</style>
</head>
<body>
<canvas id="scene" tabindex="-1" aria-label="Le jeu en 3D"></canvas>

<div id="haut" hidden>
  <button id="quitter" class="rond" type="button" aria-label="Revenir au menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div id="etapes" aria-label="Points de passage"></div>
  <span class="pastille" title="Ducats ramassés"><i class="piece"></i><b id="ducats">0</b></span>
  <span id="coeurs" aria-label="Cœurs"></span>
  <button id="son" class="rond" type="button" aria-label="Couper le son"></button>
</div>
<div id="carte" hidden aria-live="polite"></div>
<div id="bulle" hidden></div>
<div id="commandes" hidden>
  <div id="joy" class="repos"><div id="manche"></div></div>
  <button id="saut" type="button" aria-label="Sauter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M6 11l6-6 6 6"/></svg>Sauter</button>
</div>
<div id="aide" hidden><kbd>Z</kbd><kbd>Q</kbd><kbd>S</kbd><kbd>D</kbd> ou flèches : avancer · <kbd>Espace</kbd> : sauter · clic sur une plateforme : y sauter</div>

<section id="accueil" class="ecran"><div class="boite" id="accueil-boite"></div></section>
<section id="fin" class="ecran" hidden><div class="boite" id="fin-boite"></div></section>

<script src="cours.js"></script>
<script type="module">
import * as THREE from "../vendor/three-0.160.0.module.min.js";

// =====================================================================
//  Petits outils
// =====================================================================
const $ = (s) => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const borne = (v, a, b) => Math.max(a, Math.min(b, v));
const melanger = (t) => { t = t.slice(); for (let i = t.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [t[i], t[j]] = [t[j], t[i]]; } return t; };
const normaliser = (s) => String(s == null ? "" : s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim();
const lire = (cle, defaut) => { try { const v = localStorage.getItem(cle); return v ? JSON.parse(v) : defaut; } catch (e) { return defaut; } };
const ecrire = (cle, v) => { try { localStorage.setItem(cle, JSON.stringify(v)); } catch (e) {} };
function el(tag, attrs, enfants) {
  const n = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (v == null || v === false) return;
    if (k === "text") n.textContent = v; else if (k === "html") n.innerHTML = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? "" : v);
  });
  (enfants || []).forEach((e) => { if (e != null) n.appendChild(typeof e === "string" ? document.createTextNode(e) : e); });
  return n;
}
const SVG_COEUR = (plein) => '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.2 0 3.6 1.2 5.2 3 1.6-1.8 3-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z" fill="' + (plein ? "#FF5A6E" : "#3B4090") + '" stroke="' + (plein ? "#E23C52" : "#2A2E6B") + '" stroke-width="1.5"/></svg>';
const SVG_OK = '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#3FCF7A"/><path d="M9 16.5l4.5 4.5L23 11.5" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const SVG_KO = '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#FF6B6B"/><path d="M11 11l10 10M21 11L11 21" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></svg>';
const SVG_SON = (on) => on
  ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>'
  : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
const COLLEGE = ["6e", "5e", "4e", "3e"];
const CLE_CHOIX = "reviser-passage3d-v1";
const CLE_SON = "reviser-passage3d-son";

// =====================================================================
//  Les questions : tirées des fiches du chapitre (et de la partie du cours choisie)
// =====================================================================
function banque(ch, pi) {
  const part = pi >= 0 && Array.isArray(ch.parties) ? ch.parties[pi] : null;
  const garde = (liste, champ, cle) => (part && Array.isArray(part[cle])) ? liste.filter((x) => part[cle].indexOf(String(x[champ])) >= 0) : (part ? [] : liste);
  const T = {
    notions: (ch.notions || []).filter((x) => x && x.mot && x.def),
    reperes: (ch.reperes || []).filter((x) => x && x.date && x.txt),
    lieux: (ch.lieux || []).filter((x) => x && x.nom && x.txt),
    perso: (ch.personnages || []).filter((x) => x && x.nom && Array.isArray(x.txt) && x.txt.length)
  };
  const P = { notions: garde(T.notions, "mot", "notions"), reperes: garde(T.reperes, "date", "reperes"), lieux: garde(T.lieux, "nom", "lieux"), perso: garde(T.perso, "nom", "personnages") };
  const qs = (ch.questions || []).filter((q) => q && q.q && q.r && Array.isArray(q.faux) && q.faux.length && (!part || q.p === pi + 1));
  // les personnages des autres chapitres de la classe, pour avoir assez de propositions
  const persoClasse = COURS.filter((c) => c.n === ch.n && c !== ch).flatMap((c) => (c.personnages || []).map((x) => x.nom)).filter(Boolean);
  // les fausses réponses : celles de la partie d'abord, puis celles du reste du chapitre
  function pioche(cle, champ, bonne, extra) {
    const vus = new Set([normaliser(bonne)]), out = [];
    [melanger(P[cle]), melanger(T[cle])].forEach((l) => l.forEach((x) => { const v = String(x[champ]); const k = normaliser(v); if (!vus.has(k)) { vus.add(k); out.push(v); } }));
    melanger(extra || []).forEach((v) => { const k = normaliser(v); if (!vus.has(k)) { vus.add(k); out.push(v); } });
    return out;
  }
  const autre = (liste, x) => melanger(liste.filter((y) => y !== x))[0];
  const items = [];
  const qcm = (cle, type, bonne, autres, faire) => { if (autres.length) items.push({ cle, type, max: Math.min(4, 1 + autres.length), faire: (nb) => faire(melanger([bonne].concat(autres.slice(0, nb - 1)))) }); };
  const vf = (cle, type, faire) => items.push({ cle, type, vf: true, max: 2, faire });

  P.reperes.forEach((r) => {
    if (T.reperes.length > 1) vf("vf-r-" + r.date, "date", () => {
      const vrai = Math.random() < .5, a = autre(T.reperes, r);
      return { consigne: "Vrai ou faux ?", texte: r.date + " : " + (vrai ? r.txt : a.txt), options: ["Vrai", "Faux"], bonne: vrai ? "Vrai" : "Faux", expl: r.date + " : " + r.txt };
    });
    qcm("r-" + r.date, "date", r.date, pioche("reperes", "date", r.date), (options) => ({ consigne: "En quelle année ?", texte: r.txt, options, bonne: r.date, expl: r.date + " : " + r.txt }));
  });
  P.notions.forEach((n) => {
    if (T.notions.length > 1) vf("vf-n-" + n.mot, "notion", () => {
      const vrai = Math.random() < .5, a = autre(T.notions, n);
      return { consigne: "Vrai ou faux ?", texte: n.mot + " : " + (vrai ? n.def : a.def), options: ["Vrai", "Faux"], bonne: vrai ? "Vrai" : "Faux", expl: n.mot + " : " + n.def };
    });
    qcm("n-" + n.mot, "notion", n.mot, pioche("notions", "mot", n.mot), (options) => ({ consigne: "Quel mot correspond à cette définition ?", texte: n.def, options, bonne: n.mot, expl: n.mot + " : " + n.def }));
  });
  P.lieux.forEach((x) => {
    if (T.lieux.length > 1) vf("vf-l-" + x.nom, "lieu", () => {
      const vrai = Math.random() < .5, a = autre(T.lieux, x);
      return { consigne: "Vrai ou faux ?", texte: (vrai ? x.nom : a.nom) + " : " + x.txt, options: ["Vrai", "Faux"], bonne: vrai ? "Vrai" : "Faux", expl: x.nom + " : " + x.txt };
    });
    qcm("l-" + x.nom, "lieu", x.nom, pioche("lieux", "nom", x.nom), (options) => ({ consigne: "De quel lieu s'agit-il ?", texte: x.txt, options, bonne: x.nom, expl: x.nom + " : " + x.txt }));
  });
  P.perso.forEach((x) => {
    qcm("p-" + x.nom, "perso", x.nom, pioche("perso", "nom", x.nom, persoClasse), (options) => ({ consigne: "Qui suis-je ?", texte: x.txt.slice(-2).join(" "), options, bonne: x.nom, expl: x.nom + (x.dates ? " (" + x.dates + ")" : "") + " : " + x.txt[x.txt.length - 1] }));
  });
  qs.forEach((q, i) => qcm("q-" + i, "cours", q.r, melanger(q.faux.filter((f) => normaliser(f) !== normaliser(q.r))), (options) => ({ consigne: q.q, texte: "", options, bonne: q.r, expl: q.expl || "" })));
  return items;
}
function assez(items) { return items.some((i) => i.vf) && items.filter((i) => !i.vf && i.max >= 3).length >= 2; }
function tirerQuestion(nb) {
  const items = etat.items, deja = etat.utilises;
  let cands = nb <= 2 ? items.filter((i) => i.vf) : items.filter((i) => !i.vf && i.max >= nb);
  if (!cands.length && nb > 2) { const m = Math.max(2, ...items.filter((i) => !i.vf).map((i) => i.max)); cands = items.filter((i) => !i.vf && i.max >= Math.min(nb, m)); nb = Math.min(nb, m); }
  if (!cands.length) cands = items;
  let neufs = cands.filter((i) => !deja.has(i.cle));
  if (!neufs.length) { cands.forEach((i) => deja.delete(i.cle)); neufs = cands; }
  // d'abord un type au hasard (dates, mots, lieux, personnages, questions du cours), puis une question de ce type
  const types = [...new Set(neufs.map((i) => i.type))];
  const type = types[Math.floor(Math.random() * types.length)];
  const it = melanger(neufs.filter((i) => i.type === type))[0];
  deja.add(it.cle);
  const q = it.faire(Math.min(nb, it.max));
  q.options = q.options.map(String);
  return q;
}

// =====================================================================
//  La scène 3D
// =====================================================================
const canvas = $("#scene");
let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });

};
function montrerAccueil() {
  etat.phase = "accueil"; etat.bloque = true;
  ["#haut", "#carte", "#commandes", "#aide", "#bulle", "#fin"].forEach((s) => { $(s).hidden = true; });
  const acc = $("#accueil"), boite = $("#accueil-boite");
  acc.hidden = false;
  boite.innerHTML = "";
  boite.append(el("span", { class: "badge", text: "Version test" }), el("h1", { text: "Le passage en 3D" }),
    el("p", { class: "intro", text: "Dirige ton personnage d'île en île. À chaque point de passage, saute sur la plateforme de la bonne réponse : la mauvaise s'effondre !" }));
  boite.insertAdjacentHTML("beforeend", illustration());
  boite.append(el("div", { class: "regles" }, [
    el("div", { class: "regle", html: ICONES.joy + "Avance avec le joystick (ou ZQSD)" }),
    el("div", { class: "regle", html: ICONES.saut + "Saute d'une plateforme à l'autre" }),
    el("div", { class: "regle", html: ICONES.coeur + "La bonne plateforme tient, la mauvaise tombe" })
  ]));
  if (!renderer) { boite.append(el("p", { class: "erreur3d", text: "Cet appareil ne peut pas afficher la 3D. Essaie avec un autre navigateur, ou utilise le mode aventure des révisions." })); }
  else if (!chapitres.length) { boite.append(el("p", { class: "vide", text: "Aucun chapitre n'est encore ouvert pour ce jeu." })); }
  else {
    const classes = [...new Set(chapitres.map((c) => c.n))];
    const zoneCh = el("div", { class: "liste chapitres" }), zonePartie = el("div", { class: "liste" });
    const seg = el("div", { class: "segments" });
    classes.forEach((n) => seg.appendChild(el("button", { type: "button", "aria-pressed": String(n === choix.n), text: nomClasse(n), onclick: () => { choix.n = n; choix.ch = null; choix.p = 0; montrerAccueil(); } })));
    const liste = chapitres.filter((c) => c.n === choix.n);
    if (!liste.some((c) => c.id === choix.ch)) { choix.ch = liste[0].id; choix.p = 0; }
    liste.forEach((c) => zoneCh.appendChild(el("button", { type: "button", "aria-pressed": String(c.id === choix.ch), onclick: () => { choix.ch = c.id; choix.p = 0; montrerAccueil(); } }, [el("small", { text: c.num || "" }), el("span", { text: c.titre })])));
    const ch = liste.find((c) => c.id === choix.ch);
    const parts = Array.isArray(ch.parties) && Array.isArray(ch.plan) ? ch.plan.slice(0, ch.parties.length) : [];
    if (choix.p > parts.length || (choix.p > 0 && !assez(banque(ch, choix.p - 1)))) choix.p = 0;
    parts.forEach((titre, i) => { const ok = assez(banque(ch, i)); zonePartie.appendChild(el("button", { type: "button", disabled: !ok, "aria-pressed": String(choix.p === i + 1), onclick: () => { choix.p = i + 1; montrerAccueil(); } }, [el("small", { text: ROMAINS[i] + "." }), el("span", { text: titre })])); });
    zonePartie.appendChild(el("button", { type: "button", "aria-pressed": String(choix.p === 0), onclick: () => { choix.p = 0; montrerAccueil(); } }, [el("small", { text: "★" }), el("span", { text: "Tout le chapitre" })]));
    boite.append(
      el("div", { class: "champ" }, [el("b", { text: "Classe" }), seg]),
      el("div", { class: "champ" }, [el("b", { text: "Chapitre" }), zoneCh]),
      el("div", { class: "champ" }, [el("b", { text: "Partie du cours" }), zonePartie]),
      el("button", { class: "bouton", id: "jouer", type: "button", text: "C'est parti !", onclick: () => lancer() })
    );
    ecrire(CLE_CHOIX, choix);
  }
  boite.append(el("a", { class: "lien", href: "reviser.html", text: "Retour aux révisions" }));
}
async function lancer() {
  const ch = COURS.find((c) => c.id === choix.ch);
  if (!ch || !renderer) return;
  etat.ch = ch; etat.pi = choix.p - 1;
  etat.items = banque(ch, etat.pi);
  if (!assez(etat.items)) { etat.pi = -1; etat.items = banque(ch, -1); }
  etat.paliers = COLLEGE.indexOf(ch.n) >= 0 ? [2, 2, 3, 3, 3] : [2, 2, 3, 3, 4];
  try { await document.fonts.load("800 64px Inter"); } catch (e) {}
  $("#accueil").hidden = true; $("#fin").hidden = true;
  $("#haut").hidden = false; $("#commandes").hidden = false; $("#carte").hidden = true;
  const souris = window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches;
  $("#aide").hidden = !souris; joyEl.hidden = souris;
  placerJoyRepos();
  touches.clear(); joy.s = joy.l = 0; joy.id = null;
  construireNiveau();
  redimensionner();
  bulle(souris ? "Avance jusqu'au point de passage !" : "Joystick à gauche, saut à droite !", 2200);
  canvas.focus({ preventScroll: true });
}

// =====================================================================
//  La boucle
// =====================================================================
let avant = performance.now(), temps = 0;
function boucle(maintenant) {
  requestAnimationFrame(boucle);
  // sur un appareil lent, la physique avance par petits pas : le jeu garde la même vitesse
  const dt = Math.min(.1, Math.max(0, (maintenant - avant) / 1000));
  avant = maintenant;
  if (etat.phase === "accueil" || !renderer) return;
  const n = Math.max(1, Math.ceil(dt / (1 / 60))), pas = dt / n;
  for (let i = 0; i < n; i++) {
    temps += pas;
    majPlateformes(pas, temps);
    majJoueur(pas);
    majPieces(pas, temps);
    majGerbe(pas);
  }
  majPerso(dt, temps);
  verifierCoffre();
  majCamera(dt);
  renderer.render(scene, camera);
}
requestAnimationFrame(boucle);

// pour les tests automatiques
window.__p3d = {
  etat: () => ({ phase: etat.phase, k: etat.k, coeurs: etat.coeurs, ducats: etat.ducats, premiers: etat.premiers, q: etat.q && { options: etat.q.options.slice(), bonne: etat.q.bonne }, J: { s: +J.s.toFixed(2), l: +J.l.toFixed(2), y: +J.y.toFixed(2), sol: J.sol ? J.sol.type : null, i: etat.chemin.indexOf(J.sol), occupe: !!(J.auto || J.cap) } }),
  reponse: (i) => allerVers(etat.reponses[i]),
  suivant: () => { const i = etat.chemin.indexOf(J.sol); const p = etat.chemin[i + 1]; return p ? allerVers(p) : false; },
  coffre: () => { if (etat.ile && J.sol === etat.ile) { J.s = etat.ile.s - 1; J.l = etat.ile.l; } }
};

majSon();
await chargerChapitres();
montrerAccueil();
</script>
