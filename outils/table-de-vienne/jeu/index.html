<title>La table de Vienne</title>
<meta name="description" content="Jeu : redessiner l'Europe au congrès de Vienne (1814-1815), puis voir l'ordre de 1815 à l'épreuve jusqu'en 1848 (PPO Metternich et le congrès de Vienne, 1re)" />
<meta name="theme-color" content="#1F4E5F" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,700;1,400&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" />
<style>
  /* Même charte que « Galère pour l'Orient » et « La ville ronde de Bagdad » ; titres et carte en caractères d'époque */
  :root {
    --ground: #FBFAF6; --surface: #FFFEFB; --ink: #22313A; --muted: #4F5E66; --caption: #5E6A72;
    --teal: #1F4E5F; --teal-ink: #FBF7EF; --vermilion: #C0492B; --cream: #FBF4E9; --cream-line: #E8DCC6;
    --line: #E3DCCD; --dot: #D6CDBA; --shadow: 0 2px 12px rgb(31 78 95 / .14);
    --ok: #2F7A45; --ok-soft: #E5F1E7; --ko: #B03A2A; --ko-soft: #F8E6E2; --gold: #B8892B; --gold-soft: #FBF1DC;
    --on-vermilion: #FBF7EF;
    --font: 'Arimo', Arial, 'Helvetica Neue', sans-serif;
    --fell: 'IM Fell English', Georgia, 'Times New Roman', serif;
    --fell-sc: 'IM Fell English SC', Georgia, 'Times New Roman', serif;
    /* carte : un objet imprimé, identique dans les deux thèmes */
    --papier: #F2EBDA; --mer: #D2E0DF; --encre: #2E2A25;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0F242B; --surface: #15313A; --ink: #EDF3F4; --muted: #AFC3C8; --caption: #9DB2B8;
      --teal: #8CC4D4; --teal-ink: #0F242B; --vermilion: #F08D72; --cream: #1C3B45; --cream-line: #2E5360;
      --line: #2B4C57; --dot: #3C5F6B; --shadow: 0 2px 12px rgb(0 0 0 / .4);
      --ok: #7CC98F; --ok-soft: #1B3A2A; --ko: #F08D72; --ko-soft: #3A2320; --gold: #E3B67A; --gold-soft: #2C3A33;
      --on-vermilion: #0F242B;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0F242B; --surface: #15313A; --ink: #EDF3F4; --muted: #AFC3C8; --caption: #9DB2B8;
    --teal: #8CC4D4; --teal-ink: #0F242B; --vermilion: #F08D72; --cream: #1C3B45; --cream-line: #2E5360;
    --line: #2B4C57; --dot: #3C5F6B; --shadow: 0 2px 12px rgb(0 0 0 / .4);
    --ok: #7CC98F; --ok-soft: #1B3A2A; --ko: #F08D72; --ko-soft: #3A2320; --gold: #E3B67A; --gold-soft: #2C3A33;
    --on-vermilion: #0F242B;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font); -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: default; }
  :focus-visible { outline: 3px solid var(--vermilion); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .ico { width: 18px; height: 18px; flex: none; }
  .app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }

  /* ---------- Bandeau ---------- */
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 8px clamp(16px, 2vw, 28px); background: #1F4E5F; color: #FBF7EF; }
  .bar .titre { flex: none; }
  .eyebrow { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
  .bar h1 { margin: 1px 0 0; font-family: var(--fell); font-weight: 400; font-size: clamp(22px, 1.8vw, 30px); line-height: 1.1; }
  .hud { flex: 1 1 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 14px; }
  .hud-date { font-family: var(--fell); font-style: italic; font-size: 17px; padding: 3px 12px; border-radius: 999px; background: rgb(255 255 255 / .12); white-space: nowrap; }
  .jauges { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .jauge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
  .jauge .j-nom { opacity: .9; }
  .j-barre { display: inline-block; width: 52px; height: 8px; border-radius: 8px; background: rgb(255 255 255 / .22); overflow: hidden; }
  .j-barre i { display: block; height: 100%; border-radius: 8px; transition: width .5s ease, background-color .3s; }
  .jauge.haut i { background: #7CC98F; } .jauge.moyen i { background: #E3B67A; } .jauge.bas i { background: #F08D72; }
  .bar-tools { flex: none; margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }
  .tbtn { font-size: 14px; font-weight: 700; min-height: 36px; padding: 6px 14px; border-radius: 8px; border: 1.5px solid currentColor; background: transparent; color: #FBF7EF; }
  .tbtn:hover { background: rgb(255 255 255 / .12); }
  .tbtn.ico-btn { width: 40px; padding: 0; display: inline-grid; place-items: center; }
  .tbtn.ico-btn svg { width: 18px; height: 18px; }
  @media (max-width: 1180px) { .jauge .j-nom { display: none; } }

  /* ---------- Scène ---------- */
  .stage { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) clamp(340px, 31vw, 520px); }
  .view { position: relative; min-height: 0; overflow: hidden; background: var(--mer); }
  #carte { position: absolute; inset: 0; }
  .carte-svg { display: block; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; will-change: transform; }
  #carte { touch-action: none; }
  .carte-svg:active { cursor: grabbing; }
  .et { font-family: var(--fell-sc); fill: var(--encre); stroke: var(--papier); paint-order: stroke; stroke-linejoin: round; pointer-events: none; }
  .et-b { font-family: var(--fell); font-style: italic; }
  .et-q { font-family: var(--font); font-weight: 700; fill: #9E3520; stroke: #FFF8EE; }
  .ville { pointer-events: none; }
  .ville-nom { font: 12px var(--fell); fill: var(--encre); stroke: var(--papier); stroke-width: 3px; paint-order: stroke; stroke-linejoin: round; }
  .niv1 .ville-nom { font-size: 13px; font-weight: 700; }
  .marq { pointer-events: none; }
  .marq-texte { font: 700 12px var(--font); fill: #22313A; stroke: #FFFFFF; stroke-width: 3px; paint-order: stroke; }
  .a-negocier { cursor: pointer; }
  .a-negocier:hover { filter: brightness(.95); }
  .carte-info { position: absolute; left: 0; top: 0; z-index: 4; max-width: 260px; padding: 5px 10px; border-radius: 8px; background: rgb(15 36 43 / .9); color: #FBF7EF; font-size: 13px; pointer-events: none; }
  .carte-ctrl { position: absolute; right: 12px; top: 12px; z-index: 3; display: flex; flex-direction: column; gap: 6px; }
  .carte-ctrl button { width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid #C9BFA8; background: rgb(251 248 240 / .95); color: #22313A; font-size: 20px; font-weight: 700; line-height: 1; box-shadow: 0 1px 4px rgb(0 0 0 / .15); }
  .carte-ctrl button:hover { background: #FFFFFF; }
  .carte-ctrl svg { width: 20px; height: 20px; }
  .bascule { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 3; display: flex; padding: 3px; gap: 3px; border-radius: 12px; background: rgb(251 248 240 / .95); box-shadow: 0 1px 6px rgb(0 0 0 / .18); max-width: calc(100% - 90px); }
  .bascule button { border: 0; border-radius: 9px; padding: 7px 12px; background: transparent; color: #22313A; font-size: 14px; font-weight: 700; white-space: nowrap; }
  .bascule button[aria-pressed="true"] { background: #1F4E5F; color: #FBF7EF; }
  .legende { position: absolute; left: 12px; bottom: 12px; z-index: 2; display: grid; gap: 4px; max-width: min(300px, calc(100% - 24px)); padding: 9px 12px; border-radius: 12px; background: rgb(251 248 240 / .94); box-shadow: 0 2px 10px rgb(0 0 0 / .16); color: #3E4A50; font-size: 12.5px; }
  .legende .leg-titre { margin: 0 0 2px; font-family: var(--fell-sc); font-size: 14px; letter-spacing: .06em; color: #22313A; }
  .legende .l { display: flex; align-items: center; gap: 8px; }
  .pastille { width: 18px; height: 12px; border-radius: 2px; flex: none; }
  .pastille.hach { background: repeating-linear-gradient(45deg, #F6EFE0 0 3px, rgb(192 73 43 / .6) 3px 5px); box-shadow: inset 0 0 0 1.5px #C0492B; }
  .trait { width: 22px; height: 0; flex: none; border-top: 3px dashed #7A2E1F; }
  .trait.conf1812 { border-top-color: #23397A; }
  .m-def { width: 11px; height: 11px; flex: none; margin: 0 3px; background: #1F4E5F; transform: rotate(45deg); border-radius: 2px; }
  .m-cont { width: 13px; height: 13px; flex: none; margin: 0 2px; background: #C0492B; border-radius: 50%; }
  .view.talking .legende { visibility: hidden; }
  .toast { position: absolute; left: 50%; top: 62px; transform: translateX(-50%); z-index: 6; margin: 0; padding: 9px 16px; border-radius: 10px; background: rgb(15 36 43 / .92); color: #FBF7EF; font-size: 14px; max-width: calc(100% - 24px); text-align: center; pointer-events: none; }

  /* ---------- Dialogue ---------- */
  .talk { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(700px, calc(100% - 24px)); max-height: calc(100% - 28px); overflow: auto; padding: 14px 16px 12px; border-radius: 14px; background: rgb(18 32 38 / .95); color: #FBF7EF; box-shadow: 0 8px 28px rgb(0 0 0 / .35); border: 1.5px solid rgb(227 182 122 / .6); z-index: 5; }
  .talk-head { display: flex; align-items: center; gap: 12px; }
  .talk-face, .npc-face, .c-visage, .a-visage { flex: none; border-radius: 50%; overflow: hidden; background: #E9DCC2; }
  .talk-face svg, .npc-face svg, .c-visage svg, .a-visage svg { display: block; width: 100%; height: 100%; }
  .talk-face { width: 60px; height: 60px; border: 2px solid #E3B67A; }
  .talk-id { flex: 1; min-width: 0; }
  .talk-name { margin: 0; font-family: var(--fell); font-size: 21px; color: #E3B67A; }
  .talk-role { margin: 0; font-size: 13px; color: #C9D8DC; }
  .talk-x { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgb(255 255 255 / .12); color: #FBF7EF; font-size: 22px; line-height: 1; }
  .talk-x:hover { background: rgb(255 255 255 / .22); }
  .talk-text { margin: 10px 0 0; font-size: 17px; line-height: 1.5; min-height: 3em; cursor: pointer; }
  .talk-choices { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
  .talk-choices button { display: flex; align-items: baseline; gap: 8px; text-align: left; font-size: 15px; line-height: 1.35; padding: 9px 12px; border-radius: 9px; border: 1.5px solid rgb(227 182 122 / .65); background: rgb(255 255 255 / .06); color: #FBF7EF; }
  .talk-choices button:hover { background: rgb(227 182 122 / .2); }
  .talk-choices button.seen { border-color: rgb(255 255 255 / .25); color: #C9D8DC; }
  .talk-choices button.bye { border-style: dashed; }
  .talk-choices kbd { flex: none; min-width: 1.6em; padding: 0 4px; border-radius: 4px; background: rgb(255 255 255 / .15); font: 700 12px/1.6 var(--font); text-align: center; }
  .talk-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; font-size: 12px; color: #AFC3C8; }
  .talk-listen { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 7px 12px; border-radius: 999px; border: 1.5px solid rgb(255 255 255 / .35); background: transparent; color: #FBF7EF; }
  .talk-listen:hover { background: rgb(255 255 255 / .12); }

  /* ---------- Panneau ---------- */
  .panel { min-height: 0; overflow: auto; background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; font-size: clamp(15px, .55rem + .45vw, 18px); line-height: 1.45; }
  .panel-body { padding: 16px clamp(16px, 1.6vw, 26px) 14px; display: flex; flex-direction: column; gap: 13px; }
  .progress { display: flex; flex-wrap: wrap; gap: 4px; margin: 0; padding: 0; list-style: none; }
  .progress li { font-size: 11.5px; font-weight: 700; letter-spacing: .03em; padding: 3px 9px; border-radius: 999px; border: 1.5px solid var(--dot); color: var(--caption); }
  .progress li.fait { background: var(--teal); border-color: var(--teal); color: var(--teal-ink); }
  .progress li.actuel { background: var(--vermilion); border-color: var(--vermilion); color: var(--on-vermilion); }
  .count { margin: 0; font-size: .75em; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--vermilion); }
  .panel h2 { margin: 0; font-family: var(--fell); font-weight: 400; font-size: 1.6em; line-height: 1.12; color: var(--teal); text-wrap: balance; }
  .panel h3 { margin: 4px 0 -4px; font-size: .78em; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--caption); }
  .panel p { margin: 0; }
  .nav { position: sticky; bottom: 0; margin-top: auto; display: flex; flex-wrap: wrap; gap: 10px; padding: 12px clamp(16px, 1.6vw, 26px); background: var(--surface); border-top: 1px solid var(--line); }
  .nbtn { flex: 1; font-size: .92em; font-weight: 700; min-height: 48px; padding: 10px 14px; border-radius: 10px; border: 2px solid var(--teal); background: transparent; color: var(--teal); }
  .nbtn.primary { background: var(--vermilion); border-color: var(--vermilion); color: var(--on-vermilion); }
  .nbtn:disabled { opacity: .4; }
  .conseil { padding: 10px 14px; border-radius: 10px; background: var(--gold-soft); color: var(--ink); font-size: .88em; }
  .aide-dialogue { padding: 10px 14px; border-radius: 10px; border: 1.5px dashed var(--dot); color: var(--muted); font-size: .9em; }
  .date-geante { font-family: var(--fell); font-size: 2.3em; color: var(--vermilion); line-height: 1; }
  .ppo { align-self: flex-start; padding: 4px 11px; border-radius: 999px; background: var(--teal); color: var(--teal-ink); font-size: .78em; font-weight: 700; }
  .npcs { display: flex; flex-direction: column; gap: 8px; }
  .npc-btn { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 8px 12px; border-radius: 12px; border: 2px solid var(--teal); background: var(--surface); color: var(--ink); }
  .npc-btn:hover { background: var(--cream); }
  .npc-btn.guide { border-style: dashed; }
  .npc-btn:not(.met) { animation: npcPulse 2.4s ease-in-out infinite; }
  @keyframes npcPulse { 0%, 100% { box-shadow: 0 0 0 0 rgb(192 73 43 / 0); } 50% { box-shadow: 0 0 0 5px rgb(192 73 43 / .22); } }
  .npc-face { width: 48px; height: 48px; border: 2px solid var(--vermilion); }
  .npc-txt { flex: 1; display: flex; flex-direction: column; line-height: 1.25; }
  .npc-txt b { color: var(--teal); }
  .npc-txt small { font-size: .8em; color: var(--caption); }
  .npc-done { flex: none; font-size: .75em; font-weight: 700; color: var(--vermilion); text-align: right; }
  .question { padding: 12px 14px; border-radius: 10px; background: var(--cream); border: 1.5px solid var(--cream-line); display: flex; flex-direction: column; gap: 8px; }
  .q-etiq { margin: 0; font-size: .75em; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--vermilion); }
  .question .q { font-weight: 700; }
  .choix { display: grid; gap: 6px; }
  .choix button { text-align: left; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 8px 12px; font-size: .92em; line-height: 1.35; }
  .choix button:hover:not(:disabled) { border-color: var(--teal); }
  .choix button.bonne, .aff-choix button.bonne { border-color: var(--ok); background: var(--ok-soft); color: var(--ink); font-weight: 700; }
  .choix button.fausse, .aff-choix button.fausse { border-color: var(--ko); background: var(--ko-soft); color: var(--ink); text-decoration: line-through; }
  .aff-choix button.attendue { border-color: var(--ok); border-style: dashed; }
  .explication { font-size: .9em; padding: 9px 12px; border-radius: 8px; background: var(--surface); border-left: 4px solid var(--teal); }
  .explication b { display: block; }
  .explication.ok b { color: var(--ok); } .explication.ko b { color: var(--ko); }
  .dossiers { display: grid; gap: 8px; }
  .dossier { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 11px 14px; border-radius: 12px; border: 2px dashed var(--vermilion); background: var(--surface); color: var(--ink); }
  .dossier:hover { background: var(--cream); }
  .dossier.fait { border-style: solid; border-color: var(--teal); }
  .d-titre { font-family: var(--fell); font-size: 1.2em; color: var(--teal); }
  .d-etat { font-size: .85em; color: var(--caption); }
  .dossier.fait .d-etat { color: var(--ink); }
  .lien-retour { align-self: flex-start; border: 0; background: none; padding: 2px 0; color: var(--teal); font-weight: 700; font-size: .9em; text-decoration: underline; text-underline-offset: 3px; }
  .ames { font-size: .88em; color: var(--muted); }
  .ames-chiffre { display: inline-block; padding: 2px 10px; margin-right: 4px; border-radius: 999px; background: var(--gold-soft); color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
  .avis-liste { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .avis { display: flex; align-items: flex-start; gap: 10px; font-size: .9em; line-height: 1.4; }
  .a-visage { width: 38px; height: 38px; border: 1.5px solid var(--dot); }
  .avis b { color: var(--teal); }
  .a-texte { color: var(--ink); font-style: italic; }
  .options { display: grid; gap: 7px; }
  .option { display: flex; align-items: flex-start; gap: 10px; text-align: left; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font-size: .93em; line-height: 1.35; }
  .option:hover { border-color: var(--teal); }
  .option.choisie { border-color: var(--vermilion); background: var(--cream); font-weight: 700; }
  .o-rond { flex: none; width: 18px; height: 18px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--dot); background: var(--surface); }
  .option.choisie .o-rond { border-color: var(--vermilion); box-shadow: inset 0 0 0 4px var(--surface); background: var(--vermilion); }
  .reaction { display: flex; flex-direction: column; gap: 8px; padding: 11px 14px; border-radius: 10px; background: var(--cream); border-left: 5px solid var(--vermilion); font-size: .92em; scroll-margin-bottom: 96px; }
  .deltas { display: flex; flex-wrap: wrap; gap: 6px; }
  .delta { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: .85em; font-weight: 700; font-variant-numeric: tabular-nums; }
  .delta span { display: inline-flex; }
  .delta .ico { width: 15px; height: 15px; }
  .delta.plus { background: var(--ok-soft); color: var(--ok); } .delta.moins { background: var(--ko-soft); color: var(--ko); }
  .bilan-lignes { display: grid; gap: 6px; }
  .ligne-bilan { border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); }
  .ligne-bilan summary { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 9px 12px; cursor: pointer; font-size: .92em; }
  .lb-titre { font-weight: 700; color: var(--teal); }
  .lb-marque { flex: none; font-size: .85em; font-weight: 700; color: var(--vermilion); }
  .ligne-bilan.pareil .lb-marque { color: var(--ok); }
  .lb-corps { display: grid; gap: 6px; padding: 0 12px 10px; font-size: .88em; }
  .comparaison { display: grid; gap: 8px; }
  .cmp { display: grid; grid-template-columns: 118px 1fr; align-items: center; gap: 10px; font-size: .88em; }
  .cmp-nom { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--teal); }
  .cmp-barres { display: grid; gap: 3px; }
  .cmp-l { display: grid; grid-template-columns: 52px 1fr; align-items: center; gap: 6px; }
  .cmp-l small { color: var(--caption); font-size: .8em; }
  .cmp .j-barre { width: 100%; background: var(--line); }
  .cmp .j-barre.haut i { background: var(--ok); } .cmp .j-barre.moyen i { background: var(--gold); } .cmp .j-barre.bas i { background: var(--ko); }
  .a-retenir { border-left: 5px solid var(--vermilion); background: var(--cream); border-radius: 4px; padding: 10px 14px; font-size: .92em; line-height: 1.5; }
  .a-retenir b { color: var(--vermilion); display: block; font-size: .78em; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 3px; }
  .a-retenir.peuples { border-left-color: var(--teal); }
  .a-retenir.peuples b { color: var(--teal); }
  .peuple-toi { display: block; margin-top: 6px; font-weight: 700; }
  .resultat { background: var(--cream); border-radius: 10px; padding: 12px 14px; font-size: .95em; line-height: 1.5; font-weight: 700; }
  .pastilles { display: flex; gap: 6px; }
  .pdot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--dot); }
  .pdot.done { background: var(--teal); border-color: var(--teal); }
  .pdot[aria-current="step"] { background: var(--vermilion); border-color: var(--vermilion); }
