  * { box-sizing: border-box; }
  body { margin: 0; -webkit-tap-highlight-color: transparent; }
  input, textarea, button { font: inherit; }

  /* Micro-interactions : transitions douces sur tout élément interactif */
  button, a, input, select, textarea {
    transition: background-color .15s ease, border-color .15s ease, color .15s ease,
      opacity .15s ease, transform .1s ease, box-shadow .15s ease;
  }
  button:not(:disabled) { cursor: pointer; }

  /* Survol clavier/souris (Chromebook, ordinateur) */
  button:not(:disabled):hover, a:hover { opacity: 0.82; }
  button:not(:disabled):active { transform: scale(0.98); }
  button:focus-visible, a:focus-visible, input:focus-visible,
  select:focus-visible, textarea:focus-visible {
    outline: 2px solid #1F4E5F;
    outline-offset: 2px;
    border-radius: 3px;
  }

  /* Accordéon des chapitres : rotation douce du chevron */
  .chevron { transition: transform .18s ease; }
  .chevron.open { transform: rotate(0deg); }

  /* --- Mode sombre ---

     en basculant l'attribut data-theme sur <html>, sans rien redessiner. */

    --bg: #FAF8F3; --panel: #FFFFFF; --ink: #2B2B2B; --sub: #555555; --faint: #8A8478;

    --done: #5C7A5E; --doneSoft: #E7EDE4; --shadow: rgba(31,78,95,0.05);

  [data-theme="dark"] {
    --bg: #1B1E20; --panel: #24282B; --ink: #EDE9E1; --sub: #B6B1A7; --faint: #7E796F;
    --line: #383D3F; --encadre: #2C3033; --accent: #7FB2C9; --accentSoft: #223138;
    --histoire: #DB9679; --histoireSoft: #3A2B24; --geo: #7FB2C9; --geoSoft: #1F2E34;
    --todo: #6E695F; --todoSoft: #2A2C29; --wip: #D9AC5C; --wipSoft: #37301E;

  /* --- Grand écran (ordinateur, tablette large) ---
     La nav passe de la barre du bas à une colonne latérale fixe,
     et le contenu s'élargit pour occuper l'espace au lieu de rester

  .side-nav { display: none; }
  .content-shift { transition: margin-left .15s ease; }
  @media (min-width: 880px) {
    .bottom-nav { display: none !important; }
    .side-nav { display: flex !important; }
    .content-shift { margin-left: 220px !important; }
    .content-width { max-width: 900px !important; }
    .list-grid { display: grid !important; grid-template-columns: repeat(2, 1fr) !important; gap: 14px !important; align-items: start; }
    .home-grid { display: grid !important; grid-template-columns: 1.3fr 1fr !important; gap: 32px !important; align-items: start; }
    .home-grid > section { margin: 0 !important; }
  }
  /* Très grand écran : colonne « Prochaines dates » à droite de l'accueil */
  .right-rail { display: none; }

    .has-rail .right-rail { display: flex !important; }
    .has-rail .content-shift { margin-right: 330px !important; }
    .has-rail .rail-inline { display: none !important; }
  }
