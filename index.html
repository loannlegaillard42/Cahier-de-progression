  * { box-sizing: border-box; }
  body { margin: 0; -webkit-tap-highlight-color: transparent; }
  input, textarea, button { font: inherit; }

  /* Micro-interactions : transitions douces sur tout élément interactif */
  button, a, input, select, textarea {
    transition: background-color .15s ease, border-color .15s ease, color .15s ease,
      opacity .15s ease, transform .1s ease, box-shadow .15s ease;
  }
  button:not(:disabled) { cursor: pointer; }

  /* Survol clavier/souris (Chromebook, ordinateur) */
  button:not(:disabled):hover, a:hover { opacity: 0.82; }
  button:not(:disabled):active { transform: scale(0.98); }
  button:focus-visible, a:focus-visible, input:focus-visible,
  select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 3px;
  }

  /* Zone tactile agrandie pour le doigt, sans rien changer à la mise en page :
     le bouton garde sa taille, mais on peut le toucher un peu à côté. */
  .hit, .hit-y { position: relative; }
  .hit::after { content: ""; position: absolute; inset: -9px; }
  .hit-y::after { content: ""; position: absolute; inset: -9px 0; }
  /* Minuteur du mode « En classe » : clignote quand le temps est écoulé */
  @keyframes clignote { 50% { opacity: .35; } }
  .clignote { animation: clignote 1s step-end infinite; }
  @media (prefers-reduced-motion: reduce) { .clignote { animation: none; } }

  /* Impression / PDF : seule la fiche de progression s'imprime, toujours sur fond blanc */
  .print-sheet { display: none; }
  @media print {
    #root { display: none !important; }
    .print-sheet { display: block; }

    @page { margin: 14mm; }

  /* Accordéon des chapitres : rotation douce du chevron */
  .chevron { transition: transform .18s ease; }
  .chevron.open { transform: rotate(0deg); }

      pending.current = value;
      if (timer.current) clearTimeout(timer.current);
      timer.current = setTimeout(flush, delay);

      window.removeEventListener("pagehide", save.flush);
    };
  }, [save]);

}

/* ---------- Appréciations de bulletin ----------

  { id: "attention", label: "Concentration", plus: false, text: "La concentration en classe doit être plus constante." },

  { id: "materiel", label: "Matériel", plus: false, text: "Le matériel doit être apporté à chaque séance." },

const COMP_PHRASES = { "c4-temps": "les repères chronologiques", "c4-espace": "les repères géographiques", "c4-raisonner": "le raisonnement",
  "c4-numerique": "la recherche d'informations", "c4-document": "l'analyse de documents", "c4-langages": "la pratique des langages (croquis, récit…)", "c4-cooperer": "le travail en équipe" };
const compPhrase = c => COMP_PHRASES[c.id] || c.label.charAt(0).toLowerCase() + c.label.slice(1);

function firstName(name) {

/* ---------- Synchronisation entre appareils ----------
   Le cahier est chiffré sur l'appareil (AES-GCM 256 bits, clé tirée du mot de passe par
   PBKDF2-SHA-256) puis rangé dans « cahier.json » d'un dépôt GitHub privé, par l'API GitHub
   et une clé d'accès limitée à ce dépôt : GitHub ne voit que du texte chiffré. Les fichiers
   joints suivent, un par fiche, dans « fichiers/ ».
   Fusion à trois voies : la dernière version échangée (la « base », gardée dans IndexedDB)
   sert de référence pour garder à la fois les modifications de cet appareil et celles des
   autres. Si la même valeur a changé des deux côtés, cet appareil l'emporte (le cahier en
   ligne, juste après « Réunir ») ; une modification l'emporte sur une suppression. */
const SYNC_KEY = "synchro-v1";
const SYNC_BASE = "synchro-base";
const SYNC_FILE = "cahier.json";
const SYNC_DIR = "fichiers";

const SYNC_MESSAGES = {
  reseau: "Pas de connexion : la synchro reprendra toute seule.",
  cle: "GitHub refuse la clé d'accès (expirée, supprimée ou mal copiée).",
  depot: "Dépôt introuvable : vérifie son nom (pseudo/nom-du-dépôt) et que la clé donne bien accès à ce dépôt.",
  droits: "La clé ne permet pas d'écrire dans le dépôt : donne-lui l'autorisation « Contents : Read and write ».",
  public: "Ce dépôt est public : rends-le privé sur GitHub (Settings › Change visibility) avant d'y ranger ton cahier.",
  motdepasse: "Mot de passe incorrect.",
  format: "Le fichier cahier.json de ce dépôt n'est pas un cahier synchronisé.",
  navigateur: "Ce navigateur est trop ancien pour la synchro chiffrée : mets-le à jour.",
  quota: "GitHub limite temporairement les échanges : la synchro reprendra dans quelques minutes.",
  conflit: "Plusieurs appareils envoient en même temps : nouvel essai dans un instant.",
  serveur: "GitHub ne répond pas correctement pour l'instant : nouvel essai plus tard.",
  court: "Le mot de passe doit faire au moins 8 caractères.",
  differents: "Les deux mots de passe sont différents."

const syncMessage = code => SYNC_MESSAGES[code] || "Erreur inattendue pendant la synchro.";

const syncPause = code => "Synchro en pause. " + (code === "motdepasse" ? "Le mot de passe a été changé depuis un autre appareil : retape-le dans les Réglages." : syncMessage(code));
function syncError(code) {
  const e = new Error("synchro : " + code);
  e.code = code;
  return e;
}
function syncConfig() {
  try {
    const c = JSON.parse(localStorage.getItem(SYNC_KEY));
    return c && c.repo && c.token && c.key ? c : null;
  } catch (e) {
    return null;
  }
}

// N'écrit que si la synchro est toujours active (elle a pu être arrêtée pendant un échange)

}
function deviceName() {
  const ua = navigator.userAgent || "";
  if (/CrOS/.test(ua)) return "Chromebook";
  if (/iPhone/.test(ua)) return "iPhone";
  if (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return "iPad";
  if (/Android/.test(ua)) return "Android";
  if (/Windows/.test(ua)) return "PC Windows";
  if (/Macintosh/.test(ua)) return "Mac";

// Sur GitHub Pages (pseudo.github.io), le dépôt proposé est pseudo/cahier-donnees
function defaultSyncRepo() {

const SYNC_REPO_RE = /^[\w.-]+\/[\w.-]+$/;

const syncTokenUrl = () => "https://github.com/settings/personal-access-tokens/new?" + new URLSearchParams({
  name: `Cahier de progression (${deviceName()})`,

const syncRepoUrl = repo => "https://github.com/new?" + new URLSearchParams({

function syncWhen(iso) {
  if (!iso) return "";

// Octets <-> base64 (par tranches : les gros fichiers dépasseraient la pile)
function bytesToB64(bytes) {
  let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
function b64ToBytes(b64) {

  const out = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
  return out;
}
async function gzipBytes(bytes, inflate) {
  const stream = new Blob([bytes]).stream().pipeThrough(inflate ? new DecompressionStream("gzip") : new CompressionStream("gzip"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function deriveSyncKey(password, salt, iter) {
  if (!window.crypto || !crypto.subtle) throw syncError("navigateur");
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64ToBytes(salt), iterations: iter }, base, 256);
  return bytesToB64(new Uint8Array(bits));
}
// Chiffre un texte ; l'enveloppe garde en clair le sel, l'appareil et la date d'envoi
async function sealSync(cfg, text) {
  let bytes = new TextEncoder().encode(text);
  if (SYNC_GZIP) bytes = await gzipBytes(bytes, false);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await crypto.subtle.importKey("raw", b64ToBytes(cfg.key), "AES-GCM", false, ["encrypt"]);
  const data = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, bytes));
  return JSON.stringify({ app: "cahier-de-progression", v: 1, salt: cfg.salt, iter: cfg.iter, gzip: SYNC_GZIP, appareil: cfg.device, date: new Date().toISOString(), iv: bytesToB64(iv), data: bytesToB64(data) });
}
function parseEnvelope(text) {
  let env = null;
  try {
    env = JSON.parse(text);
  } catch (e) {}
  if (!env || env.app !== "cahier-de-progression" || !env.iv || !env.data || !env.salt) throw syncError("format");
  return env;
}
async function openSync(keyB64, env) {
  let bytes;
  try {
    const key = await crypto.subtle.importKey("raw", b64ToBytes(keyB64), "AES-GCM", false, ["decrypt"]);
    bytes = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(env.iv) }, key, b64ToBytes(env.data)));
  } catch (e) {
    throw syncError("motdepasse");
  }
  if (env.gzip) {
    if (!SYNC_GZIP) throw syncError("navigateur");
    bytes = await gzipBytes(bytes, true);
  }
  return new TextDecoder().decode(bytes);
}

// API GitHub (dépôt « pseudo/nom »)
async function ghRequest(cfg, path, { method = "GET", body, allow404 } = {}) {
  let res;
  try {
    res = await fetch(`https://api.github.com/repos/${cfg.repo}${path}`, {
      method,
      cache: "no-store",
      headers: { Authorization: `Bearer ${cfg.token}`, Accept: "application/vnd.github+json", ...(body ? { "Content-Type": "application/json" } : {}) },
      body: body ? JSON.stringify(body) : undefined

  } catch (e) {
    throw syncError("reseau");
  }
  if (res.ok) return res.status === 204 ? null : res.json();
  if (res.status === 404 && allow404) return null;
  const s = res.status;
  const limite = res.headers.get("x-ratelimit-remaining") === "0";
  throw syncError(s === 401 ? "cle" : s === 404 ? "depot" : s === 409 || s === 422 ? "conflit" : s === 429 || (s === 403 && limite) ? "quota" : s === 403 ? "droits" : "serveur");
}
async function ghGetFile(cfg, path) {
  const meta = await ghRequest(cfg, `/contents/${path}`, { allow404: true });
  if (!meta || Array.isArray(meta)) return null;
  // Au-delà de 1 Mo, l'API ne joint plus le contenu : on passe par le « blob »
  const b64 = meta.encoding === "base64" && meta.content ? meta.content : (await ghRequest(cfg, `/git/blobs/${meta.sha}`)).content;
  return { sha: meta.sha, text: new TextDecoder().decode(b64ToBytes(b64)) };
}
async function ghPutFile(cfg, path, text, sha, message) {

  return r.content.sha;
}
// Empreinte actuelle de « cahier.json », lue dans la liste du dépôt : une petite réponse,
// pour ne pas retélécharger tout le cahier chaque minute quand rien n'a changé
const ghHeadSha = cfg => ghRequest(cfg, "/contents", { allow404: true }).then(list => {
  const f = Array.isArray(list) ? list.find(x => x.name === SYNC_FILE) : null;
  return f ? f.sha : null;
});
const ghListDir = cfg => ghRequest(cfg, `/contents/${SYNC_DIR}`, { allow404: true }).then(list => Array.isArray(list) ? list : []);

// Fusion à trois voies
const isPlainObj = v => v !== null && typeof v === "object" && !Array.isArray(v);
function sameJSON(a, b) {
  if (a === b) return true;
  if (Array.isArray(a)) return Array.isArray(b) && a.length === b.length && a.every((x, i) => sameJSON(x, b[i]));
  if (!isPlainObj(a) || !isPlainObj(b)) return false;
  const ka = Object.keys(a).filter(k => a[k] !== undefined);
  const kb = Object.keys(b).filter(k => b[k] !== undefined);
  return ka.length === kb.length && ka.every(k => sameJSON(a[k], b[k]));
}
function merge3(base, mine, theirs, prefer = "mine") {
  if (sameJSON(mine, theirs)) return mine;
  if (sameJSON(base, mine)) return theirs;
  if (sameJSON(base, theirs)) return mine;
  if (isPlainObj(mine) && isPlainObj(theirs)) {
    const b = isPlainObj(base) ? base : {};
    const out = {};
    new Set([...Object.keys(mine), ...Object.keys(theirs)]).forEach(k => {
      const v = merge3(b[k], mine[k], theirs[k], prefer);
      if (v !== undefined) out[k] = v;
    });
    return out;
  }
  if (Array.isArray(mine) && Array.isArray(theirs)) {
    const b = Array.isArray(base) ? base : [];
    const all = [...b, ...mine, ...theirs];
    if (all.every(x => isPlainObj(x) && x.id != null)) return mergeById(b, mine, theirs, prefer);
    if (all.every(x => x === null || typeof x !== "object")) return mergeSet(b, mine, theirs);
  }
  if (mine === undefined) return theirs;
  if (theirs === undefined) return mine;
  return prefer === "theirs" ? theirs : mine;
}
// Titre (et classe, date) d'un élément : sert à reconnaître le même élément créé des deux côtés
function naturalKey(x) {
  const t = x.title ?? x.text ?? x.name ?? x.label;
  return typeof t === "string" && t.trim() ? JSON.stringify([x.classId ?? null, x.date ?? null, t.trim()]) : null;
}
// Listes d'éléments avec id (classes, chapitres, évaluations…) : élément par élément.
// Un élément créé des deux côtés avec le même titre (ex. : le programme de départ d'un
// nouvel appareil) n'est pas dédoublé : il garde l'id déjà en ligne.
function mergeById(base, mine, theirs, prefer) {
  const byId = list => new Map(list.map(x => [String(x.id), x]));
  const B = byId(base), M = byId(mine), T = byId(theirs);
  const theirsNew = new Map();
  theirs.forEach(x => {
    const id = String(x.id), k = naturalKey(x);
    if (k && !B.has(id) && !M.has(id) && !theirsNew.has(k)) theirsNew.set(k, x);
  });
  const out = [], seen = new Set();
  const keep = id => {
    if (seen.has(id)) return;
    seen.add(id);
    const v = merge3(B.get(id), M.get(id), T.get(id), prefer);
    if (v !== undefined) out.push(v);
  };
  mine.forEach(x => {
    const id = String(x.id), k = naturalKey(x);
    const twin = k && !B.has(id) && !T.has(id) ? theirsNew.get(k) : null;
    if (!twin) return keep(id);
    theirsNew.delete(k);
    seen.add(id);
    seen.add(String(twin.id));
    out.push(merge3(undefined, { ...x, id: twin.id }, twin, prefer));
  });
  theirs.forEach(x => keep(String(x.id)));
  return out;
}
// Listes de valeurs simples (ordre des classes, compétences d'une évaluation…)
function mergeSet(base, mine, theirs) {
  const B = new Set(base), M = new Set(mine), T = new Set(theirs);
  const out = mine.filter(x => !(B.has(x) && !T.has(x)));
  theirs.forEach(x => {
    if (!B.has(x) && !M.has(x) && !out.includes(x)) out.push(x);
  });
  return out;
}

const loadSyncBase = () => fileLoad(SYNC_BASE).then(t => t ? JSON.parse(t) : null, () => null);
const saveSyncBase = d => (d ? fileSave(SYNC_BASE, JSON.stringify(d)) : fileRemove(SYNC_BASE)).catch(() => {});

// Un échange : récupère la version en ligne, fusionne avec celle de l'appareil, envoie le résultat.
async function syncRound(getLocal, applyMerged) {
  for (let essai = 0; essai < 4; essai++) {
    const cfg = syncConfig();
    if (!cfg) return;
    let base = await loadSyncBase();
    const head = await ghHeadSha(cfg);
    if (head && head === cfg.sha && sameJSON(getLocal(), base)) return;
    const remote = !head ? null : head === cfg.sha ? { sha: head } : await ghGetFile(cfg, SYNC_FILE);
    let sha = remote ? cfg.sha : null;
    if (remote && remote.sha !== cfg.sha) {
      const theirs = JSON.parse(await openSync(cfg.key, parseEnvelope(remote.text)));
      // Rien d'asynchrone entre la lecture des données de l'appareil et l'application de la fusion
      const mine = getLocal();
      const merged = withDefaults(merge3(base, mine, theirs, cfg.reunir ? "theirs" : "mine"));
      if (!sameJSON(merged, mine)) applyMerged(merged);
      base = theirs;
      sha = remote.sha;
      await saveSyncBase(base);
      patchSyncConfig({ sha, reunir: false });
    }
    const snapshot = getLocal();
    if (remote && sameJSON(snapshot, base)) return;
    try {
      const text = await sealSync(cfg, JSON.stringify(snapshot));
      const newSha = await ghPutFile(cfg, SYNC_FILE, text, sha, `Synchro depuis ${cfg.device}`);
      await saveSyncBase(snapshot);
      patchSyncConfig({ sha: newSha });
      return;
    } catch (e) {
      // Un autre appareil a envoyé entre-temps : on recommence avec sa version
      if (e.code !== "conflit") throw e;
    }
  }
  throw syncError("conflit");
}
// Fichiers joints : envoie ceux qui manquent en ligne, récupère ceux qui manquent ici,
// retire en ligne ceux des fiches supprimées. Le cahier part toujours avant ses fichiers.
async function syncFiles(getLocal) {
  const cfg = syncConfig();
  if (!cfg) return;
  const fiches = getLocal().fiches.filter(f => f.fileInDb);
  const known = new Set(cfg.files || []);
  const here = await Promise.all(fiches.map(f => fileLoad(f.id).then(d => !!d, () => false)));
  const toSend = fiches.filter((f, i) => here[i] && !known.has(f.id));
  const toFetch = fiches.filter((f, i) => !here[i]);
  const gone = [...known].filter(id => !getLocal().fiches.some(f => f.id === id));
  if (!toSend.length && !toFetch.length && !gone.length) return;
  const online = new Map((await ghListDir(cfg)).map(x => [x.name, x.sha]));
  let received = false;
  for (const f of toSend) {
    if (!online.has(f.id)) {
      const content = await fileLoad(f.id);
      await ghPutFile(cfg, `${SYNC_DIR}/${f.id}`, await sealSync(cfg, content), null, "Fichier joint");
    }
    known.add(f.id);
  }
  for (const f of toFetch) {
    if (!online.has(f.id)) continue;
    const file = await ghGetFile(cfg, `${SYNC_DIR}/${f.id}`);
    if (!file) continue;
    await fileSave(f.id, await openSync(cfg.key, parseEnvelope(file.text)));
    known.add(f.id);
    received = true;
  }
  for (const id of gone) {
    if (online.has(id)) await ghDeleteFile(cfg, `${SYNC_DIR}/${id}`, online.get(id)).catch(() => {});
    known.delete(id);
  }
  patchSyncConfig({ files: [...known] });
  if (received) window.dispatchEvent(new Event("cahier-fichiers"));
}

  return remote ? { remote, env: parseEnvelope(remote.text) } : { remote: null, env: null };
}

/* ---------- Mode « En classe » ----------

   progression du chapitre). Il n'est pas fait pour être projeté : les noms des élèves et
   les observations restent sur l'appareil (et dans la synchro chiffrée).
   Données : data.observations[date][classe][élève] = { participe: 2, bavardage: 1, … } */
const OBS_KINDS = [
  { id: "participe", label: "Participe", plus: true, tag: "participation", seuil: 3 },
  { id: "bavardage", label: "Bavarde", tag: "bavardages", seuil: 3 },
  { id: "materiel", label: "Matériel oublié", short: "Matériel", tag: "materiel", seuil: 2 },
  { id: "travail", label: "Travail non fait", short: "Travail", tag: "travailperso", seuil: 2 },
  { id: "absent", label: "Absent", toggle: true }

const OBS_NAMES = { participe: ["participation", "participations"], bavardage: ["bavardage", "bavardages"], materiel: ["oubli de matériel", "oublis de matériel"], travail: ["travail non fait", "travaux non faits"] };

// Observations d'une classe sur une période : { élève: { participe: 6, … } }
function obsCounts(data, classId, fromISO, toISO) {
  const out = {};
  Object.entries(data.observations || {}).forEach(([iso, day]) => {
    if (iso < fromISO || iso > toISO || !day || !day[classId]) return;
    Object.entries(day[classId]).forEach(([sid, kinds]) => {
      const o = out[sid] || (out[sid] = {});
      Object.entries(kinds || {}).forEach(([k, n]) => { if (k !== "absent") o[k] = (o[k] || 0) + (Number(n) || 0); });
    });
  });
  return out;
}
// Observations cochées d'office dans les appréciations, quand elles reviennent souvent
const suggestedTags = obs => OBS_KINDS.filter(k => k.tag && obs && (obs[k.id] || 0) >= k.seuil).map(k => k.tag);
const apprTags = (entry, info) => entry.tags || suggestedTags(info.obs);
// Le cours à afficher : celui en cours (ou qui commence dans moins de 15 min), sinon le suivant de la journée, sinon le dernier
function pickSlot(slots, hm) {
  const m = hmToMin(hm);
  return slots.find(s => hmToMin(s.start) - 15 <= m && hmToMin(s.end) > m) || slots.find(s => hmToMin(s.start) > m) || slots[slots.length - 1] || null;
}
// Chapitre proposé : celui de la séance du jour, sinon celui de la dernière séance de ce cours
// (ou le suivant s'il est terminé), sinon le premier chapitre commencé de la classe.
function guessChapter(data, slot, classId, iso) {
  const cls = data.classes[classId];
  if (!cls) return "";
  const all = cls.themes.flatMap(th => th.chapters);
  const entries = data.cahier || {};
  if (slot) {
    const today = entries[`${iso}|${slot.id}`];
    if (today && today.chapterId && all.some(c => c.id === today.chapterId)) return today.chapterId;
    const ids = new Set(data.schedule.slots.filter(s => sameCourse(s, slot)).map(s => s.id));
    const last = Object.keys(entries).filter(k => {
      const [d, sid] = k.split("|");
      return d < iso && ids.has(sid) && entries[k] && entries[k].chapterId;
    }).sort().pop();
    if (last) {
      const i = all.findIndex(c => c.id === entries[last].chapterId);
      if (i >= 0) {
        if (chapterStatus(all[i]) !== "done") return all[i].id;
        const next = all.slice(i + 1).find(c => chapterStatus(c) !== "done");
        if (next) return next.id;
      }
    }
  }
  const wip = all.find(c => chapterStatus(c) === "wip") || all.find(c => chapterStatus(c) === "todo");
  return wip ? wip.id : "";

const DRAW_KEY = "en-classe-tirage-v1";
function loadDrawn(key) {
  try {
    return (JSON.parse(localStorage.getItem(DRAW_KEY)) || {})[key] || [];
  } catch (e) {
    return [];
  }
}
function saveDrawn(key, ids) {
  try {
    const all = JSON.parse(localStorage.getItem(DRAW_KEY)) || {};

    Object.keys(all).forEach(k => { if (k.split("|")[0] !== day) delete all[k]; });
    all[key] = ids;
    localStorage.setItem(DRAW_KEY, JSON.stringify(all));
  } catch (e) {}

    let base = done;

      base = [];
      setNote("Tout le monde est passé : nouveau tour.");
